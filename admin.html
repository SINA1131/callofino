<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CALLAFINO | Admin</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    background:#050505;
    color:#fff;
    min-height:100vh;
}

header{
    background:#080808;
    border-bottom:1px solid #292000;
    padding:20px;
    text-align:center;
}

.logo{
    color:#d4af37;
    font-size:28px;
    font-weight:bold;
}

.container{
    width:92%;
    max-width:950px;
    margin:35px auto;
}

.title{
    text-align:center;
    margin-bottom:30px;
}

.title h1{
    color:#d4af37;
    margin-bottom:8px;
}

.title p{
    color:#777;
}

.card{
    background:#0d0d0d;
    border:1px solid #292000;
    border-radius:16px;
    padding:25px;
    margin-bottom:25px;
}

.card h2{
    color:#d4af37;
    margin-bottom:20px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

label{
    display:block;
    color:#aaa;
    margin-bottom:7px;
}

input,
select{
    width:100%;
    padding:13px;
    background:#151515;
    color:#fff;
    border:1px solid #333;
    border-radius:9px;
    outline:none;
}

input:focus,
select:focus{
    border-color:#d4af37;
}

button{
    border:none;
    border-radius:9px;
    padding:12px 16px;
    background:#d4af37;
    color:#000;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#f0ca4d;
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.create-btn{
    width:100%;
    margin-top:18px;
    padding:14px;
    font-size:16px;
}

.message{
    text-align:center;
    min-height:22px;
    margin:15px 0;
    color:#d4af37;
}

.tournament{
    background:#111;
    border:1px solid #292929;
    border-radius:13px;
    padding:18px;
    margin-bottom:15px;
}

.tournament:hover{
    border-color:#d4af37;
}

.tournament-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
}

.tournament-title{
    color:#fff;
    font-size:19px;
    font-weight:bold;
}

.status{
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
}

.status.open{
    color:#5cff7a;
    background:#15351d;
}

.status.full{
    color:#ff6565;
    background:#381515;
}

.status.started{
    color:#ffd84d;
    background:#3b3011;
}

.status.closed{
    color:#888;
    background:#222;
}

.info{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
    margin-bottom:15px;
}

.info div{
    background:#0b0b0b;
    border-radius:8px;
    padding:10px;
    color:#aaa;
    font-size:13px;
}

.info strong{
    color:#ddd;
}

.actions{
    display:flex;
    gap:8px;
}

.actions button{
    flex:1;
}

.close-btn{
    background:#555;
    color:#fff;
}

.delete-btn{
    background:#8d2424;
    color:#fff;
}

.delete-btn:hover{
    background:#b52f2f;
}

.empty{
    text-align:center;
    color:#777;
    padding:25px;
}

.back{
    display:block;
    text-align:center;
    color:#aaa;
    text-decoration:none;
    margin:25px 0;
}

.back:hover{
    color:#d4af37;
}

@media(max-width:650px){

    .form-grid{
        grid-template-columns:1fr;
    }

    .info{
        grid-template-columns:1fr;
    }

    .actions{
        flex-direction:column;
    }

}

</style>

</head>

<body>

<header>

    <div class="logo">
        CALLAFINO ADMIN
    </div>

</header>


<div class="container">


<div class="title">

    <h1>⚙️ پنل مدیریت تورنمنت</h1>

    <p>
        مدیریت مسابقات CALLAFINO
    </p>

</div>


<!-- CREATE -->

<div class="card">

    <h2>
        ➕ ساخت تورنمنت
    </h2>


    <div class="form-grid">


        <div>

            <label>
                نام تورنمنت
            </label>

            <input
                id="title"
                type="text"
                placeholder="مثلاً Friday Night"
            >

        </div>


        <div>

            <label>
                بازی
            </label>

            <select id="game">

                <option>
                    Call of Duty Mobile
                </option>

                <option>
                    FC Mobile
                </option>

                <option>
                    PUBG Mobile
                </option>

                <option>
                    Free Fire
                </option>

            </select>

        </div>


        <div>

            <label>
                نوع مسابقه
            </label>

            <select id="type">

                <option value="Solo">
                    Solo
                </option>

                <option value="Squad">
                    Squad
                </option>

            </select>

        </div>


        <div>

            <label>
                ظرفیت Slot
            </label>

            <input
                id="capacity"
                type="number"
                min="1"
                value="32"
            >

        </div>


        <div>

            <label>
                زمان شروع
            </label>

            <input
                id="startTime"
                type="datetime-local"
            >

        </div>


    </div>


    <button
        class="create-btn"
        id="createBtn"
    >
        ➕ ساخت تورنمنت
    </button>


    <div
        class="message"
        id="message"
    ></div>

</div>


<!-- LIST -->

<div class="card">

    <h2>
        🏆 تورنمنت‌ها
    </h2>

    <div id="tournaments">

        <div class="empty">
            در حال بارگذاری...
        </div>

    </div>

</div>


<a
    href="dashboard.html"
    class="back"
>
    ← بازگشت به داشبورد
</a>


</div>


<script type="module">


/* =========================
   SUPABASE
========================= */

import {
    createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
"https://oisqrkqwbskvqkparmiw.supabase.co";


const SUPABASE_KEY =
"sb_publishable_FGoXFElayJeRdyFxyc61hQ_c5CUn5HL";


const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   ELEMENTS
========================= */

const titleInput =
document.getElementById("title");

const gameInput =
document.getElementById("game");

const typeInput =
document.getElementById("type");

const capacityInput =
document.getElementById("capacity");

const startTimeInput =
document.getElementById("startTime");

const createBtn =
document.getElementById("createBtn");

const message =
document.getElementById("message");

const tournaments =
document.getElementById("tournaments");


let currentUser = null;


/* =========================
   MESSAGE
========================= */

function showMessage(text){

    message.textContent = text;

    setTimeout(() => {

        message.textContent = "";

    },4000);

}


/* =========================
   CHECK ADMIN
========================= */

async function checkAdmin(){

    const {
        data,
        error
    } =
    await supabase.auth.getUser();


    if(
        error ||
        !data.user
    ){

        window.location.href =
        "login.html";

        return false;

    }


    currentUser =
    data.user;


    const {
        data:admin,
        error:adminError
    } =
    await supabase
    .from("admins")
    .select("user_id")
    .eq(
        "user_id",
        currentUser.id
    )
    .maybeSingle();


    if(
        adminError ||
        !admin
    ){

        document.body.innerHTML = `

            <div style="
                text-align:center;
                padding:100px 20px;
                color:white;
                font-family:Arial;
            ">

                <h1 style="
                    color:#d4af37;
                    margin-bottom:15px;
                ">
                    🚫 دسترسی ممنوع
                </h1>

                <p style="color:#888;">
                    شما دسترسی Admin ندارید.
                </p>

                <br>

                <a
                    href="dashboard.html"
                    style="
                        color:#d4af37;
                        text-decoration:none;
                    "
                >
                    ← بازگشت
                </a>

            </div>

        `;

        return false;

    }


    return true;

}


/* =========================
   CREATE
========================= */

createBtn.addEventListener(
"click",
async () => {


    const title =
    titleInput.value.trim();


    const game =
    gameInput.value;


    const type =
    typeInput.value;


    const capacity =
    parseInt(
        capacityInput.value
    );


    const startTime =
    startTimeInput.value;


    if(!title){

        showMessage(
            "❌ نام تورنمنت را وارد کن."
        );

        return;

    }


    if(
        !capacity ||
        capacity < 1
    ){

        showMessage(
            "❌ ظرفیت معتبر نیست."
        );

        return;

    }


    createBtn.disabled = true;

    createBtn.textContent =
    "در حال ساخت...";


    const {
        error
    } =
    await supabase
    .from("tournaments")
    .insert({

        title: title,

        game: game,

        type: type,

        max_players: capacity,

        status: "open",

        start_time:
        startTime
        ? new Date(startTime)
        : null

    });


    if(error){

        console.error(error);

        showMessage(
            "❌ ساخت تورنمنت انجام نشد."
        );

    }
    else{

        showMessage(
            "✅ تورنمنت با موفقیت ساخته شد."
        );


        titleInput.value = "";

        capacityInput.value = 32;

        startTimeInput.value = "";


        await loadTournaments();

    }


    createBtn.disabled = false;

    createBtn.textContent =
    "➕ ساخت تورنمنت";

});


/* =========================
   LOAD
========================= */

async function loadTournaments(){

    tournaments.innerHTML =
    `<div class="empty">
        در حال بارگذاری...
    </div>`;


    const {
        data,
        error
    } =
    await supabase
    .from("tournaments")
    .select("*")
    .order(
        "created_at",
        {
            ascending:false
        }
    );


    if(error){

        console.error(error);

        tournaments.innerHTML =
        `<div class="empty">
            ❌ خطا در دریافت تورنمنت‌ها
        </div>`;

        return;

    }


    if(
        !data ||
        data.length === 0
    ){

        tournaments.innerHTML =
        `<div class="empty">
            هنوز تورنمنتی ساخته نشده.
        </div>`;

        return;

    }


    tournaments.innerHTML = "";


    for(
        const tournament
        of data
    ){

        await createTournament(
            tournament
        );

    }

}


/* =========================
   CREATE CARD
========================= */

async function createTournament(
    tournament
){

    const card =
    document.createElement("div");


    card.className =
    "tournament";


    const {
        count
    } =
    await supabase
    .from(
        "tournament_registrations"
    )
    .select(
        "*",
        {
            count:"exact",
            head:true
        }
    )
    .eq(
        "tournament_id",
        tournament.id
    );


    const registered =
    count || 0;


    let statusText =
    "باز";


    if(tournament.status === "full"){
        statusText =
        "تکمیل ظرفیت";
    }

    if(tournament.status === "started"){
        statusText =
        "شروع شده";
    }

    if(tournament.status === "closed"){
        statusText =
        "بسته";
    }


    const start =
    tournament.start_time
    ? new Date(
        tournament.start_time
    ).toLocaleString(
        "fa-IR"
    )
    : "تعیین نشده";


    card.innerHTML = `

        <div class="tournament-top">

            <div class="tournament-title">

                🏆
                ${escapeHtml(
                    tournament.title
                )}

            </div>

            <div class="status ${tournament.status}">

                ${statusText}

            </div>

        </div>


        <div class="info">

            <div>
                🎮 بازی:
                <strong>
                    ${escapeHtml(
                        tournament.game
                    )}
                </strong>
            </div>

            <div>
                👥 نوع:
                <strong>
                    ${escapeHtml(
                        tournament.type
                    )}
                </strong>
            </div>

            <div>
                🎟️ Slot:
                <strong>
                    ${registered}
                    /
                    ${tournament.max_players}
                </strong>
            </div>

            <div>
                🕐 شروع:
                <strong>
                    ${start}
                </strong>
            </div>

        </div>


        <div class="actions">


            ${
                tournament.status === "open"
                ?
                `
                <button
                    class="close-btn"
                    data-action="close"
                >
                    🔒 بستن
                </button>
                `
                :
                ""
            }


            ${
                tournament.status === "closed"
                ?
                `
                <button
                    data-action="open"
                >
                    🔓 باز کردن
                </button>
                `
                :
                ""
            }


            <button
                class="delete-btn"
                data-action="delete"
            >
                🗑️ حذف
            </button>


        </div>

    `;


    const closeBtn =
    card.querySelector(
        '[data-action="close"]'
    );


    if(closeBtn){

        closeBtn.addEventListener(
            "click",
            () => updateStatus(
                tournament.id,
                "closed"
            )
        );

    }


    const openBtn =
    card.querySelector(
        '[data-action="open"]'
    );


    if(openBtn){

        openBtn.addEventListener(
            "click",
            () => updateStatus(
                tournament.id,
                "open"
            )
        );

    }


    const deleteBtn =
    card.querySelector(
        '[data-action="delete"]'
    );


    deleteBtn.addEventListener(
        "click",
        () => deleteTournament(
            tournament.id
        )
    );


    tournaments.appendChild(card);

}


/* =========================
   UPDATE STATUS
========================= */

async function updateStatus(
    id,
    status
){

    const {
        error
    } =
    await supabase
    .from("tournaments")
    .update({
        status:status
    })
    .eq(
        "id",
        id
    );


    if(error){

        console.error(error);

        showMessage(
            "❌ تغییر وضعیت انجام نشد."
        );

        return;

    }


    showMessage(
        "✅ وضعیت تورنمنت تغییر کرد."
    );


    await loadTournaments();

}


/* =========================
   DELETE
========================= */

async function deleteTournament(id){

    const ok =
    confirm(
        "آیا مطمئنی می‌خواهی این تورنمنت حذف شود؟"
    );


    if(!ok){
        return;
    }


    const {
        error
    } =
    await supabase
    .from("tournaments")
    .delete()
    .eq(
        "id",
        id
    );


    if(error){

        console.error(error);

        showMessage(
            "❌ حذف تورنمنت انجام نشد."
        );

        return;

    }


    showMessage(
        "✅ تورنمنت حذف شد."
    );


    await loadTournaments();

}


/* =========================
   SECURITY
========================= */

function escapeHtml(value){

    if(
        value === null ||
        value === undefined
    ){
        return "";
    }


    return String(value)
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );

}


/* =========================
   START
========================= */

async function start(){

    const isAdmin =
    await checkAdmin();


    if(!isAdmin){
        return;
    }


    await loadTournaments();

}


start();

</script>

</body>

</html>
