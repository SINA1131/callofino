<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CALLAFINO | Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    background:#050505;
    color:white;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.login-container{
    width:90%;
    max-width:420px;
}

.logo{
    text-align:center;
    color:#39ff14;
    font-size:35px;
    font-weight:bold;
    margin-bottom:30px;
    letter-spacing:2px;
}

.login-box{
    background:#0c0c0c;
    border:1px solid #222;
    border-radius:14px;
    padding:30px;
    box-shadow:0 0 25px rgba(57,255,20,.08);
}

.login-box h1{
    text-align:center;
    margin-bottom:25px;
    font-size:25px;
}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    color:#aaa;
    font-size:14px;
}

.input-group input{
    width:100%;
    background:#111;
    color:white;
    border:1px solid #333;
    border-radius:8px;
    padding:13px;
    outline:none;
    font-size:15px;
    direction:ltr;
}

.input-group input:focus{
    border-color:#39ff14;
}

.login-btn{
    width:100%;
    background:#39ff14;
    color:#000;
    border:0;
    padding:13px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
    margin-top:5px;
}

.login-btn:hover{
    background:#2de010;
}

.login-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.message{
    margin-bottom:15px;
    text-align:center;
    font-size:14px;
}

.error{
    background:#170909;
    border:1px solid #5b2020;
    color:#ff7777;
    padding:12px;
    border-radius:8px;
}

.success{
    background:#091709;
    border:1px solid #205b20;
    color:#7dff7d;
    padding:12px;
    border-radius:8px;
}

.register-link{
    text-align:center;
    margin-top:20px;
    color:#888;
    font-size:14px;
}

.register-link a{
    color:#39ff14;
    text-decoration:none;
}

.register-link a:hover{
    text-decoration:underline;
}

.back-home{
    text-align:center;
    margin-top:18px;
}

.back-home a{
    color:#777;
    text-decoration:none;
    font-size:13px;
}

.back-home a:hover{
    color:#39ff14;
}

</style>
</head>

<body>

<div class="login-container">

    <div class="logo">
        CALLAFINO
    </div>

    <div class="login-box">

        <h1>ورود به حساب</h1>

        <div id="message" class="message"></div>

        <form id="loginForm">

            <div class="input-group">

                <label for="email">
                    ایمیل
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="example@email.com"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="input-group">

                <label for="password">
                    رمز عبور
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="رمز عبور"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >
                ورود
            </button>

        </form>


        <div class="register-link">

            حساب کاربری ندارید؟

            <a href="register.html">
                ثبت‌نام کنید
            </a>

        </div>


        <div class="back-home">

            <a href="index.html">
                ← بازگشت به صفحه اصلی
            </a>

        </div>

    </div>

</div>


<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://oisqrkqwbskvqkparmiw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_FGoXFElayJeRdyFxyc61hQ_c5CUn5HL";

const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   ELEMENTS
========================= */

const loginForm =
document.getElementById("loginForm");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const loginBtn =
document.getElementById("loginBtn");

const message =
document.getElementById("message");


/* =========================
   MESSAGE
========================= */

function showMessage(
    text,
    type = "error"
){

    message.innerHTML = `
        <div class="${type}">
            ${escapeHTML(text)}
        </div>
    `;

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   CHECK EXISTING SESSION
========================= */

async function checkSession(){

    const {
        data:{
            session
        }
    } =
    await supabase.auth.getSession();


    if(session){

        window.location.href =
        "dashboard.html";

    }

}


/* =========================
   LOGIN
========================= */

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const email =
        emailInput.value.trim();

        const password =
        passwordInput.value;


        if(!email || !password){

            showMessage(
                "ایمیل و رمز عبور را وارد کنید."
            );

            return;

        }


        loginBtn.disabled = true;

        loginBtn.textContent =
        "در حال ورود...";

        message.innerHTML = "";


        try{

            const {
                data,
                error
            } =
            await supabase.auth.signInWithPassword({

                email:
                email,

                password:
                password

            });


            if(error){

                console.error(error);

                showMessage(
                    "ایمیل یا رمز عبور اشتباه است."
                );

                loginBtn.disabled =
                false;

                loginBtn.textContent =
                "ورود";

                return;

            }


            if(!data || !data.user){

                showMessage(
                    "ورود انجام نشد. دوباره تلاش کنید."
                );

                loginBtn.disabled =
                false;

                loginBtn.textContent =
                "ورود";

                return;

            }


            showMessage(
                "ورود موفق بود. در حال انتقال...",
                "success"
            );


            /*
             * کمی صبر می‌کنیم تا
             * Supabase session را ذخیره کند.
             */

            setTimeout(
                () => {

                    window.location.href =
                    "dashboard.html";

                },
                500
            );

        }
        catch(error){

            console.error(error);

            showMessage(
                "خطایی هنگام ورود رخ داد."
            );

            loginBtn.disabled =
            false;

            loginBtn.textContent =
            "ورود";

        }

    }
);


/* =========================
   START
========================= */

checkSession();

</script>

</body>
</html>
