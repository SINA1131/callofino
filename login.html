<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CALLAFINO | Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    min-height:100vh;
    background:#050505;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

/* Background Glow */
body::before{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    background:#d4af37;
    filter:blur(180px);
    opacity:.12;
    top:-200px;
    left:-150px;
}

body::after{
    content:"";
    position:fixed;
    width:450px;
    height:450px;
    background:#8b6f18;
    filter:blur(180px);
    opacity:.10;
    bottom:-200px;
    right:-150px;
}

/* Login Box */
.login-box{
    position:relative;
    z-index:2;
    width:90%;
    max-width:430px;
    padding:42px 35px;
    background:rgba(15,15,15,.88);
    border:1px solid rgba(212,175,55,.35);
    border-radius:24px;
    box-shadow:
        0 0 50px rgba(212,175,55,.08),
        inset 0 0 30px rgba(255,255,255,.02);
    backdrop-filter:blur(15px);
    animation:boxIn .8s ease;
}

@keyframes boxIn{
    from{
        opacity:0;
        transform:translateY(30px) scale(.97);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

/* Logo */
.logo{
    text-align:center;
    font-size:32px;
    font-weight:900;
    letter-spacing:3px;
    margin-bottom:8px;
}

.logo span{
    color:#d4af37;
}

.subtitle{
    text-align:center;
    color:#888;
    font-size:14px;
    margin-bottom:35px;
}

/* Inputs */
.input-group{
    margin-bottom:20px;
}

.input-group label{
    display:block;
    color:#bbb;
    font-size:14px;
    margin-bottom:8px;
}

.input-group input{
    width:100%;
    padding:15px;
    border-radius:12px;
    border:1px solid #292929;
    background:#090909;
    color:white;
    outline:none;
    font-size:15px;
    transition:.3s;
}

.input-group input:focus{
    border-color:#d4af37;
    box-shadow:0 0 15px rgba(212,175,55,.12);
}

/* Button */
.login-btn{
    width:100%;
    padding:15px;
    margin-top:8px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#d4af37,#a98520);
    color:#050505;
    font-size:16px;
    font-weight:900;
    cursor:pointer;
    transition:.3s;
}

.login-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(212,175,55,.18);
}

.login-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
}

/* Message */
.message{
    min-height:22px;
    text-align:center;
    margin-top:18px;
    font-size:14px;
    color:#d4af37;
}

/* Register */
.register-text{
    text-align:center;
    margin-top:25px;
    color:#777;
    font-size:14px;
}

.register-text a{
    color:#d4af37;
    text-decoration:none;
    font-weight:bold;
}

.register-text a:hover{
    text-decoration:underline;
}

/* Back */
.back{
    display:block;
    text-align:center;
    margin-top:18px;
    color:#666;
    text-decoration:none;
    font-size:13px;
    transition:.3s;
}

.back:hover{
    color:#d4af37;
}

/* Mobile */
@media(max-width:500px){
    .login-box{
        padding:35px 24px;
    }

    .logo{
        font-size:27px;
    }
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        CALLAFINO<span>.</span>
    </div>

    <div class="subtitle">
        Welcome back, gamer 🎮
    </div>

    <form id="loginForm">

        <div class="input-group">
            <label for="email">ایمیل</label>
            <input
                type="email"
                id="email"
                placeholder="example@email.com"
                required
            >
        </div>

        <div class="input-group">
            <label for="password">رمز عبور</label>
            <input
                type="password"
                id="password"
                placeholder="رمز عبور خود را وارد کنید"
                required
            >
        </div>

        <button
            type="submit"
            class="login-btn"
            id="loginBtn"
        >
            LOGIN
        </button>

        <div
            class="message"
            id="message"
        ></div>

    </form>

    <div class="register-text">
        حساب کاربری نداری؟
        <a href="register.html">ثبت‌نام کن</a>
    </div>

    <a href="index.html" class="back">
        ← بازگشت به CALLAFINO
    </a>

</div>

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://oisqrkqwbskvqkparmiw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_FGoXFElayJeRdyFxyc61hQ_c5CUn5HL";

const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   ELEMENTS
========================= */

const form =
document.getElementById("loginForm");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const loginBtn =
document.getElementById("loginBtn");

const message =
document.getElementById("message");


/* =========================
   LOGIN
========================= */

form.addEventListener("submit", async (event) => {

    event.preventDefault();

    const email =
    emailInput.value.trim();

    const password =
    passwordInput.value;

    message.textContent = "";

    if(!email || !password){
        message.textContent =
        "لطفاً همه فیلدها را کامل کنید.";
        return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = "LOGGING IN...";

    const { data, error } =
    await supabase.auth.signInWithPassword({
        email: email,
        password: password
    });

    if(error){

        console.error(error);

        message.textContent =
        "ایمیل یا رمز عبور اشتباه است.";

        loginBtn.disabled = false;
        loginBtn.textContent = "LOGIN";

        return;
    }


    /* =========================
       SUCCESS
    ========================= */

    message.textContent =
    "ورود موفق بود!";

    setTimeout(() => {

        window.location.href =
        "dashboard.html";

    }, 700);

});

</script>

</body>
</html>
