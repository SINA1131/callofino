<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CALLAFINO | Tournament</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    background:#050505;
    color:#fff;
    min-height:100vh;
}

header{
    padding:20px;
    text-align:center;
    border-bottom:1px solid #292000;
}

.logo{
    color:#d4af37;
    font-size:28px;
    font-weight:bold;
}

.container{
    width:90%;
    max-width:700px;
    margin:35px auto;
}

.card{
    background:#0d0d0d;
    border:1px solid #292000;
    border-radius:15px;
    padding:25px;
    margin-bottom:20px;
}

h2{
    color:#d4af37;
    margin-bottom:20px;
}

p{
    color:#aaa;
    margin-bottom:15px;
}

button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:#d4af37;
    color:#000;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#f0ca4d;
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

#message{
    text-align:center;
    margin:20px 0;
    color:#d4af37;
}

.registration{
    background:#111;
    border:1px solid #222;
    border-radius:10px;
    padding:15px;
    margin-top:10px;
}

.registration strong{
    color:#d4af37;
}

.back{
    display:block;
    text-align:center;
    color:#aaa;
    text-decoration:none;
    margin-top:20px;
}

.back:hover{
    color:#d4af37;
}
</style>
</head>

<body>

<header>
    <div class="logo">CALLAFINO</div>
</header>

<div class="container">

    <div class="card">
        <h2>🏆 Tournament</h2>
        <p>ثبت نام در مسابقات CALLAFINO</p>

        <button id="soloBtn">
            ثبت نام Solo
        </button>

        <button id="squadBtn">
            ثبت نام Squad
        </button>

        <div id="message"></div>
    </div>

    <div class="card">
        <h2>📋 ثبت‌نام‌های من</h2>

        <div id="registrations">
            در حال بارگذاری...
        </div>
    </div>

    <a href="dashboard.html" class="back">
        ← بازگشت به داشبورد
    </a>

</div>

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://oisqrkqwbskvqkparmiw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_FGoXFElayJeRdyFxyc61hQ_c5CUn5HL";

const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   ELEMENTS
========================= */

const soloBtn =
document.getElementById("soloBtn");

const squadBtn =
document.getElementById("squadBtn");

const message =
document.getElementById("message");

const registrations =
document.getElementById("registrations");

let currentUser = null;


/* =========================
   MESSAGE
========================= */

function showMessage(text){
    message.textContent = text;
}


/* =========================
   GET USER
========================= */

async function getUser(){

    const {
        data,
        error
    } = await supabase.auth.getUser();

    if(error || !data.user){

        window.location.href =
        "login.html";

        return null;
    }

    currentUser = data.user;

    return currentUser;
}


/* =========================
   GET NEXT SLOT
========================= */

async function getNextSlot(type){

    const {
        data,
        error
    } = await supabase
        .from("tournament_registrations")
        .select("slot")
        .eq("type", type)
        .order("slot", {
            ascending:false
        })
        .limit(1);

    if(error){
        console.error(error);
        return 1;
    }

    if(!data || data.length === 0){
        return 1;
    }

    return (data[0].slot || 0) + 1;
}


/* =========================
   SOLO
========================= */

soloBtn.addEventListener(
"click",
async () => {

    if(!currentUser){
        return;
    }

    soloBtn.disabled = true;

    showMessage(
        "در حال ثبت نام..."
    );

    const slot =
    await getNextSlot("solo");

    const {
        error
    } = await supabase
        .from("tournament_registrations")
        .insert({
            user_id: currentUser.id,
            squad_id: null,
            type: "solo",
            slot: slot
        });

    if(error){

        console.error(error);

        showMessage(
            "❌ ثبت نام انجام نشد"
        );

        soloBtn.disabled = false;

        return;
    }

    showMessage(
        "✅ ثبت نام Solo با موفقیت انجام شد"
    );

    await loadRegistrations();

    soloBtn.disabled = false;
});


/* =========================
   SQUAD
========================= */

squadBtn.addEventListener(
"click",
async () => {

    if(!currentUser){
        return;
    }

    squadBtn.disabled = true;

    showMessage(
        "در حال بررسی Squad..."
    );


    const {
        data: squads,
        error: squadError
    } = await supabase
        .from("squads")
        .select("*")
        .or(
            `player1_id.eq.${currentUser.id},player2_id.eq.${currentUser.id}`
        )
        .in(
            "status",
            ["accepted","ready"]
        )
        .order(
            "created_at",
            { ascending:false }
        )
        .limit(1);


    if(squadError){

        console.error(squadError);

        showMessage(
            "❌ خطا در پیدا کردن Squad"
        );

        squadBtn.disabled = false;

        return;
    }


    if(!squads || squads.length === 0){

        showMessage(
            "❌ ابتدا باید یک Squad فعال داشته باشی"
        );

        squadBtn.disabled = false;

        return;
    }


    const squad =
    squads[0];


    const slot =
    await getNextSlot("squad");


    const {
        error
    } = await supabase
        .from("tournament_registrations")
        .insert({
            user_id: currentUser.id,
            squad_id: squad.id,
            type: "squad",
            slot: slot
        });


    if(error){

        console.error(error);

        showMessage(
            "❌ ثبت نام Squad انجام نشد"
        );

        squadBtn.disabled = false;

        return;
    }


    showMessage(
        "✅ Squad با موفقیت ثبت نام شد"
    );

    await loadRegistrations();

    squadBtn.disabled = false;
});


/* =========================
   LOAD MY REGISTRATIONS
========================= */

async function loadRegistrations(){

    registrations.innerHTML =
    "در حال بارگذاری...";


    const {
        data,
        error
    } = await supabase
        .from("tournament_registrations")
        .select("*")
        .eq(
            "user_id",
            currentUser.id
        )
        .order(
            "created_at",
            { ascending:false }
        );


    if(error){

        console.error(error);

        registrations.innerHTML =
        "❌ خطا در دریافت اطلاعات";

        return;
    }


    if(!data || data.length === 0){

        registrations.innerHTML =
        "هنوز در مسابقه‌ای ثبت نام نکرده‌ای.";

        return;
    }


    registrations.innerHTML = "";


    data.forEach(item => {

        const div =
        document.createElement("div");

        div.className =
        "registration";


        const type =
        item.type === "solo"
        ? "Solo"
        : "Squad";


        div.innerHTML = `
            <strong>${type}</strong>
            <br>
            Slot: ${item.slot}
        `;


        registrations.appendChild(div);

    });
}


/* =========================
   START
========================= */

async function start(){

    const user =
    await getUser();

    if(!user){
        return;
    }

    await loadRegistrations();
}


start();

</script>

</body>
</html>
