<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>CALLAFINO | Tournament</title>

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
        Tahoma,
        Arial,
        sans-serif;

    background:#050505;
    color:#fff;

    min-height:100vh;
}

/* =========================
   SCROLLBAR
========================= */

::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-track{
    background:#050505;
}

::-webkit-scrollbar-thumb{
    background:#39ff14;
    border-radius:20px;
}

/* =========================
   HEADER
========================= */

header{

    position:sticky;
    top:0;
    z-index:1000;

    width:100%;

    background:
        rgba(5,5,5,.88);

    backdrop-filter:blur(15px);

    border-bottom:
        1px solid
        rgba(57,255,20,.15);
}

.navbar{

    max-width:1250px;
    margin:auto;

    min-height:75px;

    padding:
        0 25px;

    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:20px;
}

.logo{

    font-size:25px;

    font-weight:900;

    letter-spacing:2px;

    color:#39ff14;

    text-decoration:none;

    text-shadow:
        0 0 10px
        rgba(57,255,20,.5);

    white-space:nowrap;
}

.nav-links{

    display:flex;

    align-items:center;

    gap:10px;

    flex-wrap:wrap;

    justify-content:center;
}

.nav-links a{

    color:#bbb;

    text-decoration:none;

    padding:
        10px 14px;

    border-radius:10px;

    transition:.25s;

    font-size:14px;
}

.nav-links a:hover{

    color:#39ff14;

    background:
        rgba(57,255,20,.07);
}

/* =========================
   MAIN
========================= */

main{

    width:100%;

    max-width:1250px;

    margin:auto;

    padding:
        40px 20px 80px;
}

/* =========================
   LOADING
========================= */

.loading{

    min-height:250px;

    display:flex;

    align-items:center;

    justify-content:center;

    color:#39ff14;

    font-size:17px;
}

/* =========================
   ERROR
========================= */

.error{

    background:
        rgba(255,50,50,.08);

    border:
        1px solid
        rgba(255,50,50,.35);

    color:#ff6b6b;

    padding:20px;

    border-radius:15px;

    text-align:center;
}

/* =========================
   TOURNAMENT LIST
========================= */

#tournamentsList{

    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(280px,1fr));

    gap:20px;
}

.tournament-card{

    position:relative;

    overflow:hidden;

    background:
        linear-gradient(
            145deg,
            #111,
            #080808
        );

    border:
        1px solid
        rgba(57,255,20,.16);

    border-radius:20px;

    padding:22px;

    cursor:pointer;

    transition:
        transform .25s,
        border-color .25s,
        box-shadow .25s;
}

.tournament-card:hover{

    transform:
        translateY(-5px);

    border-color:
        rgba(57,255,20,.55);

    box-shadow:
        0 0 30px
        rgba(57,255,20,.08);
}

.tournament-card h3{

    color:#39ff14;

    margin-bottom:15px;

    font-size:19px;
}

.tournament-info{

    display:flex;

    flex-direction:column;

    gap:9px;

    color:#aaa;

    font-size:13px;
}

.tournament-info span{

    color:#eee;
}

/* =========================
   DETAILS
========================= */

#tournamentDetails{

    display:none;
}

.back-btn{

    border:1px solid
        rgba(57,255,20,.3);

    background:
        rgba(57,255,20,.05);

    color:#39ff14;

    padding:
        10px 17px;

    border-radius:10px;

    cursor:pointer;

    margin-bottom:25px;

    transition:.2s;
}

.back-btn:hover{

    background:
        rgba(57,255,20,.12);

    border-color:#39ff14;
}

/* =========================
   HERO
========================= */

.details-header{

    background:
        linear-gradient(
            145deg,
            #111,
            #070707
        );

    border:
        1px solid
        rgba(57,255,20,.2);

    border-radius:22px;

    padding:28px;

    margin-bottom:25px;
}

.details-header h1{

    color:#39ff14;

    font-size:
        clamp(24px,4vw,38px);

    margin-bottom:20px;
}

.details-meta{

    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(150px,1fr));

    gap:12px;
}

.meta-box{

    background:
        rgba(255,255,255,.025);

    border:
        1px solid
        rgba(255,255,255,.07);

    padding:14px;

    border-radius:13px;
}

.meta-box small{

    display:block;

    color:#777;

    margin-bottom:6px;
}

.meta-box strong{

    color:#eee;
}

/* =========================
   DESCRIPTION
========================= */

.details-description{

    margin-top:20px;

    color:#aaa;

    line-height:2;

    white-space:pre-wrap;
}

/* =========================
   REGISTER
========================= */

.register-area{

    margin-top:25px;

    display:flex;

    flex-wrap:wrap;

    gap:12px;

    align-items:center;
}

.register-btn{

    background:#39ff14;

    color:#000;

    border:none;

    border-radius:12px;

    padding:
        13px 24px;

    font-weight:900;

    cursor:pointer;

    transition:.2s;
}

.register-btn:hover{

    transform:
        translateY(-2px);

    box-shadow:
        0 0 25px
        rgba(57,255,20,.3);
}

.register-btn:disabled{

    opacity:.45;

    cursor:not-allowed;

    transform:none;

    box-shadow:none;
}

.status-text{

    color:#999;

    font-size:13px;
}

/* =========================
   SLOTS SECTION
========================= */

.slots-section{

    margin-top:30px;

    background:
        linear-gradient(
            145deg,
            #101010,
            #070707
        );

    border:
        1px solid
        rgba(57,255,20,.14);

    border-radius:22px;

    padding:25px;
}

.section-title{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    margin-bottom:20px;

    flex-wrap:wrap;
}

.section-title h2{

    color:#39ff14;

    font-size:21px;
}

.section-title span{

    color:#777;

    font-size:13px;
}

/* =========================
   SLOTS
========================= */

#detailsSlots{

    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(280px,1fr));

    gap:15px;
}

.slot{

    background:
        rgba(255,255,255,.025);

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:17px;

    padding:17px;

    transition:.2s;
}

.slot:hover{

    border-color:
        rgba(57,255,20,.3);
}

.slot-title{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:15px;

    color:#ddd;

    font-weight:bold;
}

.slot-size{

    color:#39ff14;

    font-size:12px;

    background:
        rgba(57,255,20,.07);

    padding:
        5px 9px;

    border-radius:8px;
}

.slot-players{

    display:grid;

    gap:10px;
}

.players-1{

    grid-template-columns:1fr;
}

.players-2{

    grid-template-columns:
        repeat(2,1fr);
}

.players-4{

    grid-template-columns:
        repeat(2,1fr);
}

/* =========================
   PLAYER
========================= */

.player{

    min-width:0;

    display:flex;

    align-items:center;

    gap:9px;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid
        rgba(255,255,255,.06);

    padding:9px;

    border-radius:11px;
}

.player-avatar{

    width:35px;

    height:35px;

    min-width:35px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    background:
        rgba(57,255,20,.08);

    border:
        1px solid
        rgba(57,255,20,.2);

    color:#39ff14;

    font-size:14px;

    font-weight:bold;
}

.player-avatar img{

    width:100%;

    height:100%;

    object-fit:cover;
}

.player-name{

    min-width:0;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;

    color:#eee;

    font-size:13px;
}

.player.empty{

    opacity:.45;
}

/* =========================
   EMPTY
========================= */

.empty{

    padding:35px 15px;

    text-align:center;

    color:#777;
}

/* =========================
   TOAST
========================= */

#toastContainer{

    position:fixed;

    left:20px;

    bottom:20px;

    z-index:9999;

    display:flex;

    flex-direction:column;

    gap:10px;

    width:
        min(370px,calc(100vw - 40px));
}

.toast{

    background:#111;

    border:
        1px solid
        rgba(57,255,20,.25);

    border-radius:15px;

    padding:15px;

    box-shadow:
        0 10px 35px
        rgba(0,0,0,.45);

    animation:
        toastIn .3s ease;
}

.toast-title{

    font-weight:bold;

    margin-bottom:5px;

    color:#39ff14;
}

.toast-message{

    color:#bbb;

    font-size:13px;

    line-height:1.7;
}

.toast.error{

    border-color:
        rgba(255,60,60,.4);
}

.toast.error .toast-title{

    color:#ff6565;
}

.toast.warning{

    border-color:
        rgba(255,190,50,.35);
}

.toast.warning .toast-title{

    color:#ffc14d;
}

@keyframes toastIn{

    from{

        opacity:0;

        transform:
            translateY(15px);
    }

    to{

        opacity:1;

        transform:
            translateY(0);
    }

}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .navbar{

        padding:
            12px 15px;

        flex-direction:column;

        align-items:center;
    }

    .nav-links{

        width:100%;
    }

    .nav-links a{

        font-size:12px;

        padding:
            8px 10px;
    }

    main{

        padding:
            25px 12px 60px;
    }

    .details-header{

        padding:20px;
    }

    .slots-section{

        padding:18px;
    }

    .players-2{

        grid-template-columns:1fr;
    }

    .players-4{

        grid-template-columns:1fr;
    }

}

/* =========================
   ROOM
========================= */

.room-box{

    margin-top:25px;

    padding:20px;

    border:
        1px solid
        rgba(57,255,20,.25);

    background:
        rgba(57,255,20,.04);

    border-radius:17px;

    display:none;
}

.room-box h3{

    color:#39ff14;

    margin-bottom:12px;
}

.room-code{

    font-size:24px;

    letter-spacing:4px;

    font-weight:900;

    color:#fff;

    direction:ltr;

    text-align:center;

    padding:15px;

    background:#080808;

    border-radius:12px;
}

/* =========================
   FOOTER
========================= */

footer{

    border-top:
        1px solid
        rgba(57,255,20,.1);

    text-align:center;

    padding:25px;

    color:#555;

    font-size:12px;
}

</style>

</head>

<!-- =========================
     JAVASCRIPT
========================= -->

<script type="module">

/* =========================
   SUPABASE
========================= */

import {
    createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
"https://oisqrkqwbskvqparmiw.supabase.co";


const SUPABASE_KEY =
"sb_publishable_FGoXFElayJeRdyFxyc61hQ_c5CUn5HL";


const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   GLOBALS
========================= */

let currentUser = null;

let tournaments = [];

let selectedTournament = null;


/* =========================
   INIT
========================= */

document.addEventListener(
    "DOMContentLoaded",
    async ()=>{

        await getCurrentUser();

        await loadTournaments();

    }
);


/* =========================
   CURRENT USER
========================= */

async function getCurrentUser(){

    const {
        data,
        error
    } =
    await supabase.auth.getUser();


    if(error){

        console.error(
            "getUser:",
            error
        );

        currentUser = null;

        return;

    }


    currentUser =
        data?.user || null;

}


/* =========================
   LOAD TOURNAMENTS
========================= */

async function loadTournaments(){

    const container =
        document.getElementById(
            "tournamentsList"
        );


    container.innerHTML =
        `
        <div class="loading">
            Loading...
        </div>
        `;


    const {
        data,
        error
    } =
    await supabase
    .from("tournaments")
    .select("*")
    .order(
        "created_at",
        {
            ascending:false
        }
    );


    if(error){

        console.error(
            "Tournament loading:",
            error
        );


        container.innerHTML =
        `
        <div class="error">
            ${escapeHTML(error.message)}
        </div>
        `;

        return;

    }


    tournaments =
        data || [];


    container.innerHTML = "";


    if(!tournaments.length){

        container.innerHTML =
        `
        <div class="empty">
            هنوز تورنمنتی ایجاد نشده است.
        </div>
        `;

        return;

    }


    tournaments.forEach(
        tournament=>{

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "tournament-card";


            const type =
                normalizeType(
                    tournament.type
                );


            const slotSize =
                getSlotSize(type);


            card.innerHTML =
            `

                <h3>
                    ${escapeHTML(
                        tournament.title ||
                        "Tournament"
                    )}
                </h3>


                <div class="tournament-info">

                    <div>
                        بازی:
                        <span>
                            ${escapeHTML(
                                tournament.game ||
                                "-"
                            )}
                        </span>
                    </div>


                    <div>
                        نوع:
                        <span>
                            ${escapeHTML(
                                getTypeText(type)
                            )}
                        </span>
                    </div>


                    <div>
                        هر Slot:
                        <span>
                            ${slotSize} نفره
                        </span>
                    </div>


                    <div>
                        ظرفیت:
                        <span>
                            ${escapeHTML(
                                tournament.max_players ||
                                "-"
                            )}
                        </span>
                    </div>

                </div>

            `;


            card.addEventListener(
                "click",
                ()=>{
                    openTournament(
                        tournament
                    );
                }
            );


            container.appendChild(
                card
            );

        }
    );

}


/* =========================
   OPEN TOURNAMENT
========================= */

async function openTournament(
    tournament
){

    selectedTournament =
        tournament;


    document.getElementById(
        "tournamentsPage"
    ).style.display =
        "none";


    document.getElementById(
        "tournamentDetails"
    ).style.display =
        "block";


    renderTournamentDetails(
        tournament
    );


    await loadSlots(
        tournament
    );


    await checkRegistration(
        tournament
    );


    await checkRoomAnnouncement();

}


/* =========================
   RENDER DETAILS
========================= */

function renderTournamentDetails(
    tournament
){

    const type =
        normalizeType(
            tournament.type
        );


    const slotSize =
        getSlotSize(type);


    document.getElementById(
        "detailsTitle"
    ).textContent =
        tournament.title ||
        "Tournament";


    document.getElementById(
        "detailsGame"
    ).textContent =
        tournament.game ||
        "-";


    document.getElementById(
        "detailsType"
    ).textContent =
        getTypeText(type);


    document.getElementById(
        "detailsMaxPlayers"
    ).textContent =
        tournament.max_players ||
        "-";


    document.getElementById(
        "detailsDate"
    ).textContent =
        tournament.date ||
        tournament.tournament_date ||
        tournament.start_time ||
        "-";


    document.getElementById(
        "detailsFee"
    ).textContent =
        formatEntryFee(
            tournament.entry_fee ||
            tournament.fee ||
            0
        );


    document.getElementById(
        "detailsDescription"
    ).textContent =
        tournament.description ||
        "";


    document.getElementById(
        "slotDescription"
    ).textContent =
        `${slotSize} نفره`;

}


/* =========================
   LOAD SLOTS
   FIXED SOLO PLAYER NAME
========================= */

async function loadSlots(
    tournament
){

    const container =
        document.getElementById(
            "detailsSlots"
        );


    container.innerHTML =
        `
        <div class="loading">
            Loading...
        </div>
        `;


    /* =========================
       TOURNAMENT TYPE
    ========================= */

    const type =
        normalizeType(
            tournament.type
        );


    const slotSize =
        getSlotSize(
            type
        );


    /* =========================
       GET SLOT DATA FROM RPC
    ========================= */

    const {
        data:rpcData,
        error:rpcError
    } =
    await supabase.rpc(
        "get_tournament_slots",
        {
            p_tournament_id:
                tournament.id
        }
    );


    if(rpcError){

        console.error(
            "get_tournament_slots:",
            rpcError
        );


        container.innerHTML =
        `
        <div class="error">
            ${escapeHTML(
                rpcError.message
            )}
        </div>
        `;

        return;

    }


    let data =
        rpcData || [];


    /* =====================================================
       DIRECT REGISTRATION DATA

       مهم:
       برای Solo اسم را مستقیماً از
       tournament_registrations
       می‌گیریم تا وابسته به ساختار RPC نباشد.
    ===================================================== */

    const {
        data:registrations,
        error:registrationError
    } =
    await supabase
    .from("tournament_registrations")
    .select(
        "slot,user_id,type"
    )
    .eq(
        "tournament_id",
        tournament.id
    )
    .order(
        "slot",
        {
            ascending:true
        }
    );


    if(registrationError){

        console.error(
            "tournament_registrations:",
            registrationError
        );

    }


    /* =========================
       REGISTRATION MAP
    ========================= */

    const registrationMap = {};

    const registrationUserIds = [];


    (
        registrations || []
    ).forEach(
        registration=>{

            const slotNumber =
                Number(
                    registration.slot
                );


            if(
                !slotNumber
            ){
                return;
            }


            if(
                type === "solo"
            ){

                registrationMap[
                    slotNumber
                ] =
                {
                    user_id:
                        registration.user_id
                };


                if(
                    registration.user_id
                ){

                    registrationUserIds.push(
                        registration.user_id
                    );

                }

            }

        }
    );


    /* =========================
       LOAD SOLO PROFILES
    ========================= */

    const directProfiles = {};


    if(
        registrationUserIds.length
    ){

        const uniqueIds =
            [
                ...new Set(
                    registrationUserIds
                )
            ];


        const {
            data:profileRows,
            error:profileError
        } =
        await supabase
        .from("profiles")
        .select(
            "id,username"
        )
        .in(
            "id",
            uniqueIds
        );


        if(profileError){

            console.error(
                "Solo profile loading:",
                profileError
            );

        }
        else{

            (
                profileRows || []
            ).forEach(
                profile=>{

                    directProfiles[
                        profile.id
                    ] =
                        profile;

                }
            );

        }

    }


    /* =====================================================
       IF RPC HAS NO DATA

       برای Solo از registrationها Slot می‌سازیم.
    ===================================================== */

    if(
        !data.length &&
        type === "solo" &&
        registrations?.length
    ){

        data =
            registrations.map(
                registration=>{

                    const username =
                        directProfiles[
                            registration.user_id
                        ]?.username ||
                        "";


                    return {

                        slot:
                            registration.slot,

                        player1_id:
                            registration.user_id,

                        player1_name:
                            username

                    };

                }
            );

    }


    container.innerHTML = "";


    if(!data.length){

        container.innerHTML =
        `
        <div class="empty">
            هنوز اسلاتی وجود ندارد.
        </div>
        `;

        return;

    }


    /* =====================================================
       COLLECT PLAYER IDS FROM RPC
    ===================================================== */

    const playerIds = [];


    data.forEach(
        slot=>{

            for(
                let i=1;
                i<=slotSize;
                i++
            ){

                const id =
                    slot[
                        `player${i}_id`
                    ] ||
                    slot[
                        `player${i}_user_id`
                    ];


                if(id){

                    playerIds.push(
                        id
                    );

                }

            }

        }
    );


    /* =========================
       LOAD PROFILES
    ========================= */

    const profiles =
        await getPlayerProfiles(
            playerIds
        );


    /* =========================
       RENDER
    ========================= */

    data.forEach(
        slot=>{

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "slot";


            const players = [];


            for(
                let i=1;
                i<=slotSize;
                i++
            ){

                let playerId =
                    slot[
                        `player${i}_id`
                    ] ||
                    slot[
                        `player${i}_user_id`
                    ] ||
                    null;


                let name =
                    slot[
                        `player${i}_name`
                    ] ||
                    slot[
                        `player${i}_username`
                    ] ||
                    "";


                /* =================================================
                   SOLO FALLBACK

                   این بخش مشکل اصلی را حل می‌کند:
                   Slot -> registration -> user_id -> profile -> username
                ================================================= */

                if(
                    type === "solo" &&
                    i === 1
                ){

                    const directRegistration =
                        registrationMap[
                            Number(
                                slot.slot
                            )
                        ];


                    if(
                        directRegistration?.user_id
                    ){

                        playerId =
                            directRegistration.user_id;


                        name =
                            directProfiles[
                                playerId
                            ]?.username ||
                            name ||
                            "";

                    }

                }


                /* =========================
                   PROFILE FALLBACK
                ========================= */

                if(
                    !name &&
                    playerId &&
                    profiles[playerId]
                ){

                    name =
                        profiles[
                            playerId
                        ].username ||
                        "";

                }


                /* =========================
                   AVATAR
                ========================= */

                const avatarUrl =
                    slot[
                        `player${i}_avatar`
                    ] ||
                    slot[
                        `player${i}_avatar_url`
                    ] ||
                    (
                        playerId &&
                        profiles[playerId]
                        ?
                        profiles[playerId].avatar_url
                        :
                        null
                    );


                /* =========================
                   PLAYER EXISTS
                ========================= */

                if(name){

                    players.push(
                    `

                    <div class="player">

                        <div class="player-avatar">

                            ${
                                avatarUrl
                                ?
                                `
                                <img
                                    src="${escapeHTML(
                                        avatarUrl
                                    )}"
                                    alt=""
                                    onerror="this.style.display='none';this.parentElement.textContent='${getPlayerAvatar(name)}';"
                                >
                                `
                                :
                                getPlayerAvatar(
                                    name
                                )
                            }

                        </div>


                        <div class="player-name">

                            ${escapeHTML(
                                name
                            )}

                        </div>

                    </div>

                    `);

                }

                /* =========================
                   EMPTY PLAYER
                ========================= */

                else{

                    players.push(
                    `

                    <div class="player empty">

                        <div class="player-avatar">
                            👤
                        </div>

                        <div class="player-name">
                            خالی
                        </div>

                    </div>

                    `);

                }

            }


            div.innerHTML =
            `

            <div class="slot-title">

                <span>
                    Slot #${escapeHTML(
                        slot.slot
                    )}
                </span>


                <span class="slot-size">
                    ${slotSize} نفره
                </span>

            </div>


            <div
                class="
                    slot-players
                    players-${slotSize}
                "
            >

                ${players.join("")}

            </div>

            `;


            container.appendChild(
                div
            );

        }
    );

}


/* =========================
   GET PLAYER PROFILES
========================= */

async function getPlayerProfiles(
    playerIds
){

    const ids =
        [
            ...new Set(
                (playerIds || [])
                .filter(Boolean)
            )
        ];


    if(!ids.length){

        return {};

    }


    const {
        data,
        error
    } =
    await supabase
    .from("profiles")
    .select(
        "id,username"
    )
    .in(
        "id",
        ids
    );


    if(error){

        console.error(
            "Profile loading error:",
            error
        );

        return {};

    }


    const map = {};


    (
        data || []
    ).forEach(
        profile=>{

            map[
                profile.id
            ] =
                profile;

        }
    );


    return map;

}


/* =========================
   REGISTER SELECTED
========================= */

async function registerSelectedTournament(){

    if(!selectedTournament){

        return;

    }


    const type =
        normalizeType(
            selectedTournament.type
        );


    if(
        type === "solo"
    ){

        await registerSoloTournament(
            selectedTournament
        );

    }
    else{

        await createTournamentTeam(
            selectedTournament
        );

    }

}


/* =========================
   SOLO REGISTER
========================= */

async function registerSoloTournament(
    tournament
){

    if(!currentUser){

        showToast(
            "error",
            "ثبت‌نام ناموفق",
            "ابتدا وارد حساب کاربری شوید."
        );

        return;

    }


    showToast(
        "warning",
        "در حال ثبت‌نام",
        "در حال پیدا کردن اولین Slot دارای ظرفیت..."
    );


    const {
        data:existingRegistration,
        error:registrationCheckError
    } =
    await supabase
    .from("tournament_registrations")
    .select("id")
    .eq(
        "tournament_id",
        tournament.id
    )
    .eq(
        "user_id",
        currentUser.id
    )
    .maybeSingle();


    if(registrationCheckError){

        console.error(
            registrationCheckError
        );


        showToast(
            "error",
            "ثبت‌نام ناموفق",
            registrationCheckError.message
        );

        return;

    }


    if(existingRegistration){

        showToast(
            "warning",
            "قبلاً ثبت‌نام کرده‌ای",
            "شما قبلاً در این تورنمنت ثبت‌نام کرده‌اید."
        );

        return;

    }


    const {
        data,
        error
    } =
    await supabase.rpc(
        "register_for_tournament_with_wallet",
        {
            p_tournament_id:
                tournament.id,

            p_squad_id:
                null
        }
    );


    if(error){

        console.error(
            "Solo registration error:",
            error
        );


        showToast(
            "error",
            "ثبت‌نام ناموفق",
            error.message ||
            "ثبت‌نام انجام نشد."
        );

        return;

    }


    const fee =
        Number(
            data?.fee ||
            0
        );


    const remainingBalance =
        Number(
            data?.remaining_balance ||
            0
        );


    const slot =
        data?.slot ||
        "-";


    showToast(
        "success",
        "ثبت‌نام موفق 🎉",
        `ثبت‌نام تک‌نفره با موفقیت انجام شد. Slot #${slot}`,
        6000
    );


    if(
        fee > 0
    ){

        setTimeout(
            ()=>{

                showToast(
                    "success",
                    "پرداخت موفق",
                    `مبلغ ${formatEntryFee(
                        fee
                    )} از کیف پول کسر شد. موجودی باقی‌مانده: ${formatEntryFee(
                        remainingBalance
                    )}`,
                    6500
                );

            },
            500
        );

    }


    await loadTournaments();


    await loadMyTournaments();


    await checkRoomAnnouncement();


    if(
        selectedTournament &&
        selectedTournament.id ===
        tournament.id
    ){

        await loadSlots(
            tournament
        );

        await checkRegistration(
            tournament
        );

    }

}


/* =========================
   TEAM REGISTER
========================= */

async function createTournamentTeam(
    tournament
){

    if(!currentUser){

        showToast(
            "error",
            "ورود لازم است",
            "ابتدا وارد حساب کاربری شوید."
        );

        return;

    }


    const type =
        normalizeType(
            tournament.type
        );


    const teamSize =
        getSlotSize(
            type
        );


    /*
       اگر سیستم قبلی شما
       createTournamentTeam
       کامل‌تر بوده،
       این بخش RPC اصلی ثبت تیم را اجرا می‌کند.
    */


    const {
        data,
        error
    } =
    await supabase.rpc(
        "register_for_tournament_with_wallet",
        {
            p_tournament_id:
                tournament.id,

            p_squad_id:
                null
        }
    );


    if(error){

        console.error(
            "Team registration:",
            error
        );


        showToast(
            "error",
            "ثبت‌نام ناموفق",
            error.message ||
            "ثبت‌نام انجام نشد."
        );

        return;

    }


    showToast(
        "success",
        "ثبت‌نام موفق 🎉",
        `ثبت‌نام ${getTypeText(
            type
        )} با موفقیت انجام شد.`,
        6000
    );


    await loadTournaments();


    await loadMyTournaments();


    if(
        selectedTournament
    ){

        await loadSlots(
            selectedTournament
        );

    }

}


/* =========================
   CHECK REGISTRATION
========================= */

async function checkRegistration(
    tournament
){

    const button =
        document.getElementById(
            "registerButton"
        );


    const status =
        document.getElementById(
            "registerStatus"
        );


    if(!currentUser){

        button.disabled =
            false;

        button.textContent =
            "ورود و ثبت‌نام";


        status.textContent =
            "برای ثبت‌نام باید وارد حساب شوید.";

        return;

    }


    const {
        data,
        error
    } =
    await supabase
    .from("tournament_registrations")
    .select(
        "id,slot,type"
    )
    .eq(
        "tournament_id",
        tournament.id
    )
    .eq(
        "user_id",
        currentUser.id
    )
    .maybeSingle();


    if(error){

        console.error(
            "checkRegistration:",
            error
        );

        return;

    }


    if(data){

        button.disabled =
            true;

        button.textContent =
            "ثبت‌نام شده ✓";


        status.textContent =
            `Slot #${data.slot || "-"}`;

    }
    else{

        button.disabled =
            false;

        button.textContent =
            "ثبت‌نام";


        status.textContent =
            "";

    }

}

/* =========================
   ROOM ANNOUNCEMENT
========================= */

async function checkRoomAnnouncement(){

    if(!selectedTournament){

        return;

    }


    const roomBox =
        document.getElementById(
            "roomBox"
        );


    const roomCode =
        document.getElementById(
            "roomCode"
        );


    roomBox.style.display =
        "none";


    const {
        data,
        error
    } =
    await supabase
    .from(
        "tournament_room_announcements"
    )
    .select("*")
    .eq(
        "tournament_id",
        selectedTournament.id
    )
    .order(
        "created_at",
        {
            ascending:false
        }
    )
    .limit(1)
    .maybeSingle();


    if(error){

        console.error(
            "Room announcement:",
            error
        );

        return;

    }


    if(
        data &&
        data.room_code
    ){

        roomCode.textContent =
            data.room_code;


        roomBox.style.display =
            "block";

    }

}

   BACK

    ).style.display =

/* =========================
   TYPE
========================= */

function normalizeType(
    type
){

    return String(
        type || ""
    )
    .trim()
    .toLowerCase();

}


function getSlotSize(
    type
){

    if(
        type === "solo"
    ){

        return 1;

    }


    if(
        type === "duo"
    ){

        return 2;

    }


    if(
        type === "squad"
    ){

        return 4;

    }


    return 1;

}


function getTypeText(
    type
){

    if(
        type === "solo"
    ){

        return "Solo";

    }


    if(
        type === "duo"
    ){

        return "Duo";

    }


    if(
        type === "squad"
    ){

        return "Squad";

    }


    return type || "-";

}


/* =========================
   ENTRY FEE
========================= */

function formatEntryFee(
    value
){

    const number =
        Number(
            value || 0
        );


    if(
        !number
    ){

        return "رایگان";

    }


    return (
        new Intl.NumberFormat(
            "fa-IR"
        ).format(
            number
        )
    ) + " تومان";

}


/* =========================
   AVATAR
========================= */

function getPlayerAvatar(
    name
){

    if(
        !name
    ){

        return "👤";

    }


    return escapeHTML(
        String(name)
            .trim()
            .charAt(0)
            .toUpperCase()
    );

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================
   TOAST
========================= */

function showToast(
    type,
    title,
    message,
    duration=4000
){

    const container =
        document.getElementById(
            "toastContainer"
        );


    const toast =
        document.createElement(
            "div"
        );


    toast.className =
        `toast ${type || ""}`;


    toast.innerHTML =
    `

        <div class="toast-title">

            ${escapeHTML(
                title
            )}

        </div>


        <div class="toast-message">

            ${escapeHTML(
                message
            )}

        </div>

    `;


    container.appendChild(
        toast
    );


    setTimeout(
        ()=>{

            toast.style.opacity =
                "0";

            toast.style.transform =
                "translateY(10px)";


            setTimeout(
                ()=>{

                    toast.remove();

                },
                300
            );

        },
        duration
    );

}


/* =========================
   GLOBAL FUNCTIONS
========================= */

window.openTournament =
    openTournament;

window.backToTournaments =
    backToTournaments;

window.registerSelectedTournament =
    registerSelectedTournament;

window.loadSlots =
    loadSlots;

window.showToast =
    showToast;

</script>
