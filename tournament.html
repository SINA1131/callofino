<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CALLAFINO | Tournaments</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    background:#050505;
    color:white;
    min-height:100vh;
}

header{
    height:70px;
    background:#080808;
    border-bottom:1px solid #1aff00;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 40px;
}

.logo{
    color:#1aff00;
    font-size:25px;
    font-weight:bold;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:25px;
    transition:.2s;
}

nav a:hover{
    color:#1aff00;
}

.container{
    width:90%;
    max-width:1200px;
    margin:40px auto;
}

.title{
    text-align:center;
    margin-bottom:35px;
}

.title h1{
    color:#1aff00;
    font-size:35px;
    margin-bottom:10px;
}

.title p{
    color:#aaa;
}

.tournaments{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
}

.tournament-card{
    background:#0c0c0c;
    border:1px solid #222;
    border-radius:12px;
    padding:22px;
    transition:.25s;
}

.tournament-card:hover{
    border-color:#1aff00;
    transform:translateY(-3px);
}

.tournament-card h2{
    color:#1aff00;
    margin-bottom:15px;
}

.info{
    color:#aaa;
    line-height:2;
    margin-bottom:15px;
}

.status{
    display:inline-block;
    padding:5px 10px;
    border-radius:6px;
    background:#123b0e;
    color:#1aff00;
    margin-bottom:15px;
}

.status.full{
    background:#3b0e0e;
    color:#ff4444;
}

button{
    border:none;
    cursor:pointer;
    border-radius:7px;
    padding:11px 15px;
    font-weight:bold;
}

.register-btn{
    width:100%;
    background:#1aff00;
    color:#000;
}

.register-btn:hover{
    background:#14cc00;
}

.slots-btn{
    width:100%;
    margin-top:10px;
    background:#151515;
    border:1px solid #1aff00;
    color:#1aff00;
}

.slots-section{
    display:none;
    margin-top:40px;
}

.slots-section h2{
    text-align:center;
    color:#1aff00;
    margin-bottom:20px;
}

.slots{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:15px;
}

.slot-card{
    background:#0c0c0c;
    border:1px solid #222;
    border-radius:10px;
    padding:15px;
}

.slot-title{
    color:#1aff00;
    font-weight:bold;
    margin-bottom:12px;
}

.player{
    background:#151515;
    border-radius:6px;
    padding:9px;
    margin-top:7px;
    color:#ddd;
}

.empty{
    color:#666;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.8);
    align-items:center;
    justify-content:center;
    z-index:1000;
}

.modal-box{
    width:90%;
    max-width:500px;
    background:#0b0b0b;
    border:1px solid #1aff00;
    border-radius:12px;
    padding:25px;
}

.modal-box h2{
    color:#1aff00;
    margin-bottom:20px;
}

.squad-list{
    max-height:300px;
    overflow-y:auto;
}

.squad-item{
    background:#151515;
    border:1px solid #222;
    padding:14px;
    border-radius:8px;
    margin-bottom:10px;
    cursor:pointer;
}

.squad-item:hover{
    border-color:#1aff00;
}

.squad-item strong{
    color:#1aff00;
}

.close-btn{
    width:100%;
    margin-top:15px;
    background:#222;
    color:white;
}

.close-btn:hover{
    background:#333;
}

.my-tournaments{
    margin-top:50px;
}

.my-tournaments h2{
    color:#1aff00;
    margin-bottom:20px;
}

.my-item{
    background:#0c0c0c;
    border:1px solid #222;
    padding:15px;
    border-radius:8px;
    margin-bottom:10px;
}

.loading{
    text-align:center;
    color:#777;
}

.error{
    color:#ff4444;
    text-align:center;
    margin:20px;
}

@media(max-width:600px){
    header{
        padding:0 15px;
    }

    nav a{
        margin-left:10px;
        font-size:13px;
    }

    .container{
        width:94%;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">CALLAFINO</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="codm.html">CODM</a>
        <a href="dashboard.html">Dashboard</a>
    </nav>
</header>


<div class="container">

    <div class="title">
        <h1>TOURNAMENTS</h1>
        <p>Join tournaments and compete with other players.</p>
    </div>

    <div id="tournaments" class="tournaments">
        <div class="loading">Loading tournaments...</div>
    </div>


    <div id="slotsSection" class="slots-section">

        <h2 id="slotsTitle">Tournament Slots</h2>

        <div id="slots" class="slots"></div>

    </div>


    <div class="my-tournaments">

        <h2>My Tournaments</h2>

        <div id="myTournaments">
            <div class="loading">Loading...</div>
        </div>

    </div>

</div>


<!-- SQUAD MODAL -->

<div id="squadModal" class="modal">

    <div class="modal-box">

        <h2 id="modalTitle">Select Squad</h2>

        <div id="squadList" class="squad-list"></div>

        <button class="close-btn" onclick="closeSquadModal()">
            Close
        </button>

    </div>

</div>


<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
"https://oisqrkqwbskvqkparmiw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_FGoXFElayJeRdyFxyc61hQ_c5CUn5HL";

const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


let currentUser = null;
let selectedTournament = null;


/* =========================
   INIT
========================= */

async function init(){

    const {
        data:{
            user
        }
    } = await supabase.auth.getUser();

    if(!user){

        window.location.href =
        "login.html";

        return;
    }

    currentUser = user;

    await loadTournaments();

    await loadMyTournaments();
}


/* =========================
   LOAD TOURNAMENTS
========================= */

async function loadTournaments(){

    const container =
    document.getElementById("tournaments");

    container.innerHTML =
    `<div class="loading">Loading tournaments...</div>`;


    const {
        data,
        error
    } = await supabase
    .from("tournaments")
    .select("*")
    .order("created_at",{
        ascending:false
    });


    if(error){

        console.error(error);

        container.innerHTML =
        `<div class="error">
            Failed to load tournaments.
        </div>`;

        return;
    }


    if(!data || data.length === 0){

        container.innerHTML =
        `<div class="loading">
            No tournaments available.
        </div>`;

        return;
    }


    container.innerHTML = "";


    for(const tournament of data){

        let registeredCount = 0;

        try{

            const {
                data:slots
            } = await supabase.rpc(
                "get_tournament_slots",
                {
                    p_tournament_id:
                    tournament.id
                }
            );

            if(slots){

                registeredCount =
                slots.filter(
                    slot =>
                    isSlotOccupied(slot)
                ).length;

            }

        }catch(e){

            console.error(e);

        }


        const card =
        document.createElement("div");

        card.className =
        "tournament-card";


        const full =
        tournament.status === "full"
        ||
        registeredCount >= tournament.max_players;


        card.innerHTML = `

            <h2>
                ${escapeHTML(tournament.title)}
            </h2>

            <div class="info">

                <div>
                    🎮 Game:
                    ${escapeHTML(tournament.game)}
                </div>

                <div>
                    👥 Type:
                    ${escapeHTML(tournament.type)}
                </div>

                <div>
                    🪑 Slots:
                    ${registeredCount}
                    /
                    ${tournament.max_players}
                </div>

            </div>

            <div class="status ${full ? "full" : ""}">
                ${full ? "FULL" : "OPEN"}
            </div>

            <button
                class="register-btn"
                ${full ? "disabled" : ""}
                style="${full ? "opacity:.5;cursor:not-allowed;" : ""}"
                data-id="${tournament.id}"
                data-type="${tournament.type}"
            >
                ${full ? "Tournament Full" : "Register"}
            </button>

            <button
                class="slots-btn"
                data-id="${tournament.id}"
            >
                View Slots
            </button>
        `;


        const registerBtn =
        card.querySelector(".register-btn");


        if(!full){

            registerBtn.addEventListener(
                "click",
                () => {

                    registerTournament(
                        tournament
                    );

                }
            );

        }


        card.querySelector(
            ".slots-btn"
        ).addEventListener(
            "click",
            () => {

                showTournamentSlots(
                    tournament
                );

            }
        );


        container.appendChild(card);

    }

}


/* =========================
   SLOT CHECK
========================= */

function isSlotOccupied(slot){

    return !!(
        slot.player1_name
        ||
        slot.player2_name
        ||
        slot.player3_name
        ||
        slot.player4_name
    );

}


function countRegisteredSlots(slots){

    if(!slots)
        return 0;

    return slots.filter(
        slot =>
        isSlotOccupied(slot)
    ).length;

}


/* =========================
   SHOW SLOTS
========================= */

async function showTournamentSlots(
    tournament
){

    const section =
    document.getElementById(
        "slotsSection"
    );

    const slotsContainer =
    document.getElementById(
        "slots"
    );

    const title =
    document.getElementById(
        "slotsTitle"
    );


    section.style.display =
    "block";


    title.textContent =
    `${tournament.title} - Slots`;


    slotsContainer.innerHTML =
    `<div class="loading">
        Loading slots...
    </div>`;


    const {
        data,
        error
    } = await supabase.rpc(
        "get_tournament_slots",
        {
            p_tournament_id:
            tournament.id
        }
    );


    if(error){

        console.error(error);

        slotsContainer.innerHTML =
        `<div class="error">
            Failed to load slots.
        </div>`;

        return;
    }


    slotsContainer.innerHTML = "";


    const type =
    String(tournament.type)
    .toLowerCase();


    data.forEach(slot => {

        const card =
        document.createElement(
            "div"
        );

        card.className =
        "slot-card";


        let playersHTML = "";


        if(type === "solo"){

            playersHTML =
            createPlayerHTML(
                slot.player1_name
            );

        }


        else if(type === "duo"){

            playersHTML =
                createPlayerHTML(
                    slot.player1_name
                )
                +
                createPlayerHTML(
                    slot.player2_name
                );

        }


        else if(type === "squad"){

            playersHTML =
                createPlayerHTML(
                    slot.player1_name
                )
                +
                createPlayerHTML(
                    slot.player2_name
                )
                +
                createPlayerHTML(
                    slot.player3_name
                )
                +
                createPlayerHTML(
                    slot.player4_name
                );

        }


        card.innerHTML = `

            <div class="slot-title">
                Slot #${slot.slot}
            </div>

            ${playersHTML}

        `;


        slotsContainer.appendChild(
            card
        );

    });

}


function createPlayerHTML(
    name
){

    if(name){

        return `
            <div class="player">
                👤 ${escapeHTML(name)}
            </div>
        `;

    }


    return `
        <div class="player empty">
            Empty
        </div>
    `;

}


/* =========================
   REGISTER
========================= */

async function registerTournament(
    tournament
){

    const type =
    String(tournament.type)
    .toLowerCase();


    if(type === "solo"){

        await doRegister(
            tournament.id,
            null
        );

        return;
    }


    await openSquadModal(
        tournament
    );

}


/* =========================
   SQUAD MODAL
========================= */

async function openSquadModal(
    tournament
){

    selectedTournament =
    tournament;


    const modal =
    document.getElementById(
        "squadModal"
    );

    const list =
    document.getElementById(
        "squadList"
    );

    const title =
    document.getElementById(
        "modalTitle"
    );


    const type =
    String(tournament.type)
    .toLowerCase();


    title.textContent =
    type === "squad"
    ? "Select Your Squad (4 Players)"
    : "Select Your Duo (2 Players)";


    modal.style.display =
    "flex";


    list.innerHTML =
    `<div class="loading">
        Loading...
    </div>`;


    const {
        data:squads,
        error
    } = await supabase
    .from("squads")
    .select(`
        id,
        player1_id,
        player2_id,
        player3_id,
        player4_id,
        status
    `)
    .in(
        "status",
        ["accepted","ready"]
    );


    if(error){

        console.error(error);

        list.innerHTML =
        `<div class="error">
            Failed to load squads.
        </div>`;

        return;
    }


    const mySquads =
    squads.filter(
        squad => {

            if(type === "duo"){

                return (
                    squad.player1_id === currentUser.id
                    ||
                    squad.player2_id === currentUser.id
                );

            }


            if(type === "squad"){

                return (
                    (
                        squad.player1_id === currentUser.id
                        ||
                        squad.player2_id === currentUser.id
                        ||
                        squad.player3_id === currentUser.id
                        ||
                        squad.player4_id === currentUser.id
                    )
                    &&
                    squad.player1_id
                    &&
                    squad.player2_id
                    &&
                    squad.player3_id
                    &&
                    squad.player4_id
                );

            }


            return false;

        }
    );


    if(mySquads.length === 0){

        list.innerHTML =
        `<div class="loading">
            You don't have an eligible
            ${type === "squad" ? "4-player squad" : "duo"}.
        </div>`;

        return;
    }


    const ids = [];


    mySquads.forEach(
        squad => {

            [
                squad.player1_id,
                squad.player2_id,
                squad.player3_id,
                squad.player4_id

            ].forEach(id => {

                if(id && !ids.includes(id)){

                    ids.push(id);

                }

            });

        }
    );


    const {
        data:profiles,
        error:profileError
    } = await supabase
    .from("profiles")
    .select("id,username")
    .in(
        "id",
        ids
    );


    if(profileError){

        console.error(profileError);

        list.innerHTML =
        `<div class="error">
            Failed to load players.
        </div>`;

        return;
    }


    const profileMap = {};


    profiles.forEach(
        profile => {

            profileMap[
                profile.id
            ] =
            profile.username;

        }
    );


    list.innerHTML = "";


    mySquads.forEach(
        squad => {

            let names = [];


            if(squad.player1_id){

                names.push(
                    profileMap[
                        squad.player1_id
                    ] || "Unknown"
                );

            }


            if(squad.player2_id){

                names.push(
                    profileMap[
                        squad.player2_id
                    ] || "Unknown"
                );

            }


            if(
                type === "squad"
                &&
                squad.player3_id
            ){

                names.push(
                    profileMap[
                        squad.player3_id
                    ] || "Unknown"
                );

            }


            if(
                type === "squad"
                &&
                squad.player4_id
            ){

                names.push(
                    profileMap[
                        squad.player4_id
                    ] || "Unknown"
                );

            }


            const item =
            document.createElement(
                "div"
            );

            item.className =
            "squad-item";


            item.innerHTML = `

                <strong>
                    ${type === "squad"
                    ? "Squad"
                    : "Duo"}
                </strong>

                <div style="margin-top:8px;">
                    ${names
                        .map(
                            name =>
                            `👤 ${escapeHTML(name)}`
                        )
                        .join("<br>")
                    }
                </div>

            `;


            item.addEventListener(
                "click",
                async () => {

                    await doRegister(
                        tournament.id,
                        squad.id
                    );

                }
            );


            list.appendChild(item);

        }
    );

}


/* =========================
   DO REGISTER
========================= */

async function doRegister(
    tournamentId,
    squadId
){

    const {
        data,
        error
    } = await supabase.rpc(
        "register_for_tournament",
        {
            p_tournament_id:
            tournamentId,

            p_squad_id:
            squadId
        }
    );


    if(error){

        alert(
            error.message
        );

        return;
    }


    alert(
        `Registration successful!\nSlot #${data.slot}`
    );


    closeSquadModal();


    await loadTournaments();

    await loadMyTournaments();

}


/* =========================
   MY TOURNAMENTS
========================= */

async function loadMyTournaments(){

    const container =
    document.getElementById(
        "myTournaments"
    );


    const {
        data,
        error
    } = await supabase
    .from(
        "tournament_registrations"
    )
    .select(`
        slot,
        type,
        tournament_id,
        tournaments (
            title,
            game,
            type
        )
    `)
    .eq(
        "user_id",
        currentUser.id
    )
    .order(
        "created_at",
        {
            ascending:false
        }
    );


    if(error){

        console.error(error);

        container.innerHTML =
        `<div class="error">
            Failed to load your tournaments.
        </div>`;

        return;
    }


    if(!data || data.length === 0){

        container.innerHTML =
        `<div class="loading">
            You haven't registered for any tournament yet.
        </div>`;

        return;
    }


    container.innerHTML = "";


    data.forEach(
        item => {

            const div =
            document.createElement(
                "div"
            );

            div.className =
            "my-item";


            const tournament =
            item.tournaments;


            div.innerHTML = `

                <strong style="color:#1aff00;">
                    ${escapeHTML(
                        tournament?.title ||
                        "Tournament"
                    )}
                </strong>

                <div style="color:#aaa;margin-top:8px;">
                    🎮 ${escapeHTML(
                        tournament?.game ||
                        ""
                    )}
                </div>

                <div style="color:#aaa;">
                    👥 ${escapeHTML(
                        item.type ||
                        ""
                    )}
                </div>

                <div style="color:#1aff00;margin-top:5px;">
                    🪑 Slot #${item.slot}
                </div>

            `;


            container.appendChild(
                div
            );

        }
    );

}


/* =========================
   CLOSE MODAL
========================= */

function closeSquadModal(){

    document.getElementById(
        "squadModal"
    ).style.display =
    "none";

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

    if(value === null ||
       value === undefined){

        return "";

    }

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================
   START
========================= */

init();

</script>

</body>
</html>
