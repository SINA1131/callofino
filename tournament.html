<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>CALLAFINO | Tournaments</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    background:#080808;
    color:#fff;
    min-height:100vh;
}

header{
    background:#101010;
    border-bottom:1px solid #292929;
    padding:18px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.logo{
    color:#d4af37;
    font-size:25px;
    font-weight:bold;
}

nav{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

nav a{
    color:#aaa;
    text-decoration:none;
    padding:10px 14px;
    border-radius:8px;
}

nav a:hover{
    background:#1d1d1d;
    color:#d4af37;
}

.container{
    width:92%;
    max-width:1250px;
    margin:35px auto;
}

.title{
    margin-bottom:25px;
}

.title h1{
    font-size:32px;
}

.title h1 span{
    color:#d4af37;
}

.title p{
    color:#888;
    margin-top:8px;
}

.message{
    display:none;
    padding:14px;
    border-radius:10px;
    margin-bottom:20px;
}

.error{
    background:#301010;
    border:1px solid #702828;
    color:#ff8585;
}

.success{
    background:#102c18;
    border:1px solid #28683a;
    color:#8dffa9;
}

.tournaments{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
}

.tournament{
    background:#111;
    border:1px solid #292929;
    border-radius:18px;
    padding:22px;
    transition:.2s;
}

.tournament:hover{
    border-color:#d4af37;
    transform:translateY(-3px);
}

.tournament h2{
    color:#d4af37;
    margin-bottom:15px;
}

.info{
    display:grid;
    gap:9px;
    color:#999;
    margin-bottom:18px;
}

.info strong{
    color:#fff;
}

.badge{
    display:inline-block;
    padding:5px 10px;
    border-radius:20px;
    background:#202020;
    color:#d4af37;
    font-size:12px;
}

.register-btn{
    width:100%;
    padding:13px;
    border:0;
    border-radius:9px;
    background:#d4af37;
    color:#080808;
    font-weight:bold;
    cursor:pointer;
}

.register-btn:disabled{
    opacity:.4;
    cursor:not-allowed;
}

.slot-section{
    margin-top:50px;
}

.slot-section h2{
    color:#d4af37;
    margin-bottom:20px;
}

.slot-title{
    color:#fff;
    margin-bottom:15px;
}

.slots{
    display:grid;
    grid-template-columns:
    repeat(auto-fill,minmax(190px,1fr));
    gap:15px;
}

.slot{
    background:#101010;
    border:1px solid #292929;
    border-radius:14px;
    padding:17px;
    min-height:145px;
}

.slot.full{
    border-color:#806520;
}

.slot-number{
    color:#d4af37;
    font-weight:bold;
    margin-bottom:12px;
}

.player{
    background:#191919;
    border-radius:8px;
    padding:9px;
    margin-top:7px;
    color:#ddd;
}

.empty{
    color:#555;
    text-align:center;
    padding:25px;
}

.my-section{
    margin-top:50px;
}

.my-section h2{
    color:#d4af37;
    margin-bottom:20px;
}

.my-card{
    background:#111;
    border:1px solid #292929;
    border-radius:15px;
    padding:18px;
    margin-bottom:12px;
}

.my-card h3{
    color:#d4af37;
    margin-bottom:10px;
}

.my-card div{
    margin-top:7px;
    color:#aaa;
}

.my-card strong{
    color:#fff;
}

@media(max-width:700px){

    header{
        flex-direction:column;
    }

    nav{
        justify-content:center;
    }

}

</style>

</head>


<body>


<header>

    <div class="logo">
        CALLAFINO
    </div>

    <nav>

        <a href="dashboard.html">
            داشبورد
        </a>

        <a href="tournament.html">
            تورنومنت
        </a>

        <a href="ranking.html">
            رنکینگ
        </a>

        <a href="friends.html">
            دوستان
        </a>

        <a href="squad.html">
            Squad
        </a>

    </nav>

</header>


<main class="container">


<div
id="errorBox"
class="message error"
></div>


<div
id="successBox"
class="message success"
></div>


<div class="title">

    <h1>
        🏆
        <span>Tournaments</span>
    </h1>

    <p>
        تورنومنت موردنظر خودت را انتخاب کن.
    </p>

</div>


<div
id="tournaments"
class="tournaments"
>

    <div class="empty">
        در حال بارگذاری...
    </div>

</div>


<section class="slot-section">

    <h2>
        🎟️ Tournament Slots
    </h2>

    <div id="slotsContainer">

        <div class="empty">
            یک تورنومنت را انتخاب کن.
        </div>

    </div>

</section>


<section class="my-section">

    <h2>
        🏆 My Tournaments
    </h2>

    <div id="myTournaments">

        <div class="empty">
            در حال بارگذاری...
        </div>

    </div>

</section>


</main>


<script type="module">


import {
    createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
"https://oisqrkqwbskvqkparmiw.supabase.co";


const SUPABASE_KEY =
"sb_publishable_FGoXFElayJeRdyFxyc61hQ_c5CUn5HL";


const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


let currentUser = null;

let tournaments = [];


/* =====================================================
HELPERS
===================================================== */

function escapeHTML(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }

    return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function showError(message){

    const box =
    document.getElementById(
        "errorBox"
    );

    box.textContent =
    message;

    box.style.display =
    "block";

}


function showSuccess(message){

    const box =
    document.getElementById(
        "successBox"
    );

    box.textContent =
    message;

    box.style.display =
    "block";

}


/* =====================================================
AUTH
===================================================== */

async function checkUser(){

    const {
        data:{user},
        error
    } =
    await supabase.auth.getUser();


    if(error){

        showError(
            error.message
        );

        return false;

    }


    if(!user){

        window.location.href =
        "login.html";

        return false;

    }


    currentUser =
    user;

    return true;

}


/* =====================================================
TOURNAMENTS
===================================================== */

async function loadTournaments(){

    const {
        data,
        error
    } =
    await supabase
    .from("tournaments")
    .select("*")
    .order(
        "created_at",
        {
            ascending:false
        }
    );


    if(error){

        console.error(error);

        showError(
            "خطا در دریافت تورنومنت‌ها."
        );

        return;

    }


    tournaments =
    data || [];


    const container =
    document.getElementById(
        "tournaments"
    );


    container.innerHTML =
    "";


    if(!tournaments.length){

        container.innerHTML = `
            <div class="empty">
                هنوز تورنومنتی ساخته نشده.
            </div>
        `;

        return;

    }


    tournaments.forEach(
        tournament=>{

        const card =
        document.createElement(
            "div"
        );


        card.className =
        "tournament";


        const date =
        tournament.start_time
        ?
        new Date(
            tournament.start_time
        ).toLocaleString(
            "fa-IR"
        )
        :
        "تعیین نشده";


        const type =
        tournament.type ||
        "Solo";


        const status =
        tournament.status ||
        "open";


        const open =
        status.toLowerCase()
        ===
        "open";


        card.innerHTML = `

            <h2>
                ${escapeHTML(
                    tournament.title
                )}
            </h2>

            <div class="info">

                <div>
                    🎮 بازی:
                    <strong>
                        ${escapeHTML(
                            tournament.game
                        )}
                    </strong>
                </div>

                <div>
                    👥 حالت:
                    <span class="badge">
                        ${escapeHTML(type)}
                    </span>
                </div>

                <div>
                    🎟️ Slot:
                    <strong>
                        ${tournament.max_players}
                    </strong>
                </div>

                <div>
                    🕐 زمان:
                    <strong>
                        ${escapeHTML(date)}
                    </strong>
                </div>

                <div>
                    📌 وضعیت:
                    <strong>
                        ${escapeHTML(status)}
                    </strong>
                </div>

            </div>


            <button
                class="register-btn"
                data-id="${tournament.id}"
                ${!open ? "disabled" : ""}
            >

                ${
                    open
                    ?
                    "ثبت‌نام در تورنومنت"
                    :
                    "ثبت‌نام بسته است"
                }

            </button>

        `;


        container.appendChild(card);

    });


    document
    .querySelectorAll(
        ".register-btn"
    )
    .forEach(button=>{

        button.addEventListener(
            "click",
            async ()=>{

                await registerTournament(
                    button.dataset.id
                );

            }
        );

    });

}


/* =====================================================
REGISTER
===================================================== */

async function registerTournament(
    tournamentId
){

    const tournament =
    tournaments.find(
        t =>
        t.id === tournamentId
    );


    if(!tournament){

        return;

    }


    let squadId = null;


    const type =
    String(
        tournament.type
    ).toLowerCase();


    /* SOLO */

    if(type === "solo"){

        squadId = null;

    }


    /* DUO / SQUAD */

    else{

        const {
            data,
            error
        } =
        await supabase
        .from("squads")
        .select(`
            id,
            player1_id,
            player2_id,
            player3_id,
            player4_id,
            status
        `)
        .in(
            "status",
            [
                "accepted",
                "ready"
            ]
        );


        if(error){

            console.error(error);

            showError(
                "خطا در دریافت تیم."
            );

            return;

        }


        const mySquad =
        (data || []).find(
            squad=>{

                return (

                    squad.player1_id
                    === currentUser.id

                    ||

                    squad.player2_id
                    === currentUser.id

                    ||

                    squad.player3_id
                    === currentUser.id

                    ||

                    squad.player4_id
                    === currentUser.id

                );

            }
        );


        if(!mySquad){

            showError(
                type === "duo"
                ?
                "ابتدا یک Duo بساز."
                :
                "ابتدا یک Squad چهار نفره بساز."
            );

            return;

        }


        if(type === "duo"){

            if(
                !mySquad.player1_id ||
                !mySquad.player2_id
            ){

                showError(
                    "Duo باید ۲ بازیکن داشته باشد."
                );

                return;

            }

        }


        if(type === "squad"){

            if(
                !mySquad.player1_id ||
                !mySquad.player2_id ||
                !mySquad.player3_id ||
                !mySquad.player4_id
            ){

                showError(
                    "Squad باید ۴ بازیکن داشته باشد."
                );

                return;

            }

        }


        squadId =
        mySquad.id;

    }


    const {
        data,
        error
    } =
    await supabase.rpc(
        "register_for_tournament",
        {
            p_tournament_id:
            tournamentId,

            p_squad_id:
            squadId
        }
    );


    if(error){

        console.error(error);

        showError(
            error.message
        );

        return;

    }


    console.log(
        "Registration:",
        data
    );


    showSuccess(
        "ثبت‌نام با موفقیت انجام شد ✅"
    );


    await loadSlots(
        tournamentId
    );


    await loadMyTournaments();


    await loadTournaments();

}


/* =====================================================
LOAD SLOTS
===================================================== */

async function loadSlots(
    tournamentId
){

    const tournament =
    tournaments.find(
        t =>
        t.id === tournamentId
    );


    if(!tournament){

        return;

    }


    const {
        data,
        error
    } =
    await supabase
    .from(
        "tournament_registrations"
    )
    .select(`
        id,
        slot,
        type,
        player1_id,
        player2_id,
        player3_id,
        player4_id
    `)
    .eq(
        "tournament_id",
        tournamentId
    )
    .order(
        "slot",
        {
            ascending:true
        }
    );


    if(error){

        console.error(error);

        showError(
            "خطا در دریافت Slotها."
        );

        return;

    }


    const registrations =
    data || [];


    /* USER IDS */

    const ids = [];


    registrations.forEach(
        registration=>{

            [
                registration.player1_id,
                registration.player2_id,
                registration.player3_id,
                registration.player4_id

            ].forEach(id=>{

                if(
                    id &&
                    !ids.includes(id)
                ){

                    ids.push(id);

                }

            });

        }
    );


    /* PROFILES */

    let profiles = [];


    if(ids.length){

        const {
            data:profileData,
            error:profileError
        } =
        await supabase
        .from("profiles")
        .select(
            "id,username"
        )
        .in(
            "id",
            ids
        );


        if(profileError){

            console.error(
                profileError
            );

        }else{

            profiles =
            profileData || [];

        }

    }


    function getUsername(id){

        const profile =
        profiles.find(
            p =>
            p.id === id
        );


        if(profile){

            return profile.username;

        }


        return "Player";

    }


    const registrationMap =
    new Map();


    registrations.forEach(
        registration=>{

            registrationMap.set(
                registration.slot,
                registration
            );

        }
    );


    const container =
    document.getElementById(
        "slotsContainer"
    );


    container.innerHTML =
    "";


    const title =
    document.createElement(
        "h3"
    );


    title.className =
    "slot-title";


    title.textContent =
    `${tournament.title} — ${tournament.type}`;


    container.appendChild(
        title
    );


    const slots =
    document.createElement(
        "div"
    );


    slots.className =
    "slots";


    for(
        let i = 1;
        i <= tournament.max_players;
        i++
    ){

        const registration =
        registrationMap.get(i);


        const slot =
        document.createElement(
            "div"
        );


        slot.className =
        "slot";


        if(registration){

            slot.classList.add(
                "full"
            );


            const players = [];


            if(
                registration.player1_id
            ){

                players.push(
                    getUsername(
                        registration.player1_id
                    )
                );

            }


            if(
                registration.player2_id
            ){

                players.push(
                    getUsername(
                        registration.player2_id
                    )
                );

            }


            if(
                registration.player3_id
            ){

                players.push(
                    getUsername(
                        registration.player3_id
                    )
                );

            }


            if(
                registration.player4_id
            ){

                players.push(
                    getUsername(
                        registration.player4_id
                    )
                );

            }


            slot.innerHTML = `

                <div class="slot-number">
                    🎟️ SLOT ${i}
                </div>

                ${players.map(
                    name=>`

                    <div class="player">
                        👤 ${escapeHTML(name)}
                    </div>

                    `
                ).join("")}

            `;

        }else{

            slot.innerHTML = `

                <div class="slot-number">
                    🎟️ SLOT ${i}
                </div>

                <div class="empty">
                    🔓 خالی
                </div>

            `;

        }


        slots.appendChild(
            slot
        );

    }


    container.appendChild(
        slots
    );

}


/* =====================================================
MY TOURNAMENTS
===================================================== */

async function loadMyTournaments(){

    const {
        data,
        error
    } =
    await supabase
    .from(
        "tournament_registrations"
    )
    .select(`
        slot,
        type,
        tournament_id,
        player1_id,
        player2_id,
        player3_id,
        player4_id,
        tournaments(
            title,
            game,
            type,
            start_time
        )
    `)
    .or(
        `player1_id.eq.${currentUser.id},player2_id.eq.${currentUser.id},player3_id.eq.${currentUser.id},player4_id.eq.${currentUser.id}`
    )
    .order(
        "slot",
        {
            ascending:true
        }
    );


    if(error){

        console.error(error);

        return;

    }


    const container =
    document.getElementById(
        "myTournaments"
    );


    container.innerHTML =
    "";


    if(
        !data ||
        !data.length
    ){

        container.innerHTML = `
            <div class="empty">
                هنوز در هیچ تورنمنتی ثبت‌نام نکرده‌ای.
            </div>
        `;

        return;

    }


    data.forEach(
        item=>{

        const tournament =
        item.tournaments;


        const card =
        document.createElement(
            "div"
        );


        card.className =
        "my-card";


        card.innerHTML = `

            <h3>
                🏆
                ${escapeHTML(
                    tournament?.title || "-"
                )}
            </h3>

            <div>
                🎮 بازی:
                <strong>
                    ${escapeHTML(
                        tournament?.game || "-"
                    )}
                </strong>
            </div>

            <div>
                👥 حالت:
                <strong>
                    ${escapeHTML(
                        item.type || "-"
                    )}
                </strong>
            </div>

            <div>
                🎟️ Slot:
                <strong>
                    ${item.slot}
                </strong>
            </div>

        `;


        container.appendChild(
            card
        );

    });

}


/* =====================================================
START
===================================================== */

async function start(){

    const loggedIn =
    await checkUser();


    if(!loggedIn){

        return;

    }


    await loadTournaments();

    await loadMyTournaments();

}


start();


</script>


</body>
</html>
