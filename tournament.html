<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CALLAFINO | Tournaments</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    background:#050505;
    color:#fff;
    min-height:100vh;
}

header{
    height:70px;
    background:#090909;
    border-bottom:1px solid #1d1d1d;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 35px;
}

.logo{
    color:#39ff14;
    font-size:25px;
    font-weight:bold;
    letter-spacing:2px;
}

nav{
    display:flex;
    gap:20px;
}

nav a{
    color:#aaa;
    text-decoration:none;
    font-size:14px;
}

nav a:hover{
    color:#39ff14;
}

.container{
    width:92%;
    max-width:1200px;
    margin:auto;
    padding:40px 0;
}

.page-title{
    font-size:30px;
    margin-bottom:8px;
}

.page-subtitle{
    color:#777;
    margin-bottom:30px;
}


/* =========================
   TOURNAMENT GRID
========================= */

.tournament-grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(280px,1fr));

    gap:20px;
}

.tournament-card{
    background:#0c0c0c;
    border:1px solid #202020;
    border-radius:14px;
    padding:22px;

    transition:.2s;
}

.tournament-card:hover{
    border-color:#39ff14;
    transform:translateY(-2px);
}

.tournament-title{
    font-size:20px;
    margin-bottom:14px;
}

.game{
    color:#39ff14;
    font-size:13px;
    margin-bottom:12px;
}

.info{
    color:#999;
    font-size:13px;
    line-height:2;
}

.capacity-text{
    color:#fff;
}

.capacity-number{
    color:#39ff14;
    font-weight:bold;
}

.progress{
    width:100%;
    height:8px;

    background:#1a1a1a;

    border-radius:20px;

    overflow:hidden;

    margin-top:12px;
    margin-bottom:15px;
}

.progress-bar{
    height:100%;
    background:#39ff14;
    width:0%;

    transition:.3s;
}

.status-open{
    color:#39ff14;
    font-weight:bold;
}

.status-full{
    color:#ff6868;
    font-weight:bold;
}

.register-btn{
    width:100%;

    margin-top:18px;

    padding:13px;

    border:none;
    border-radius:9px;

    background:#39ff14;
    color:#000;

    font-weight:bold;

    cursor:pointer;
}

.register-btn:hover{
    opacity:.85;
}

.register-btn:disabled{
    background:#191919;
    color:#777;

    border:1px solid #292929;

    cursor:not-allowed;
}


/* =========================
   MY TOURNAMENTS
========================= */

.section-title{
    font-size:22px;
    margin:55px 0 20px;
}

.my-card{
    background:#0c0c0c;
    border:1px solid #202020;

    border-radius:12px;

    padding:18px;

    margin-bottom:12px;
}

.my-card h3{
    margin-bottom:10px;
}

.my-card p{
    color:#999;
    font-size:13px;
    line-height:2;
}

.slot{
    color:#39ff14;
    font-weight:bold;
}


/* =========================
   MODAL
========================= */

.modal{
    display:none;

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.8);

    align-items:center;
    justify-content:center;

    z-index:100;
}

.modal.active{
    display:flex;
}

.modal-box{
    width:92%;
    max-width:500px;

    background:#0b0b0b;

    border:1px solid #292929;

    border-radius:14px;

    padding:25px;
}

.modal-title{
    font-size:21px;
    margin-bottom:20px;
}

.squad-list{
    display:flex;
    flex-direction:column;
    gap:10px;

    max-height:350px;

    overflow-y:auto;
}

.squad-item{
    background:#111;

    border:1px solid #292929;

    border-radius:9px;

    padding:15px;

    cursor:pointer;
}

.squad-item:hover{
    border-color:#39ff14;
}

.squad-item strong{
    display:block;
    margin-bottom:5px;
}

.squad-item span{
    color:#777;
    font-size:12px;
}

.modal-actions{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.btn{
    flex:1;

    padding:12px;

    border:none;

    border-radius:8px;

    cursor:pointer;

    font-weight:bold;
}

.btn-primary{
    background:#39ff14;
    color:#000;
}

.btn-secondary{
    background:#181818;
    color:#fff;
    border:1px solid #333;
}

.empty{
    text-align:center;
    color:#666;
    padding:35px;
}

.loading{
    text-align:center;
    color:#777;
    padding:30px;
}

.message{
    padding:14px;
    border-radius:8px;
    margin-bottom:20px;
}

.message.success{
    background:#091709;
    border:1px solid #205b20;
    color:#7dff7d;
}

.message.error{
    background:#170909;
    border:1px solid #5b2020;
    color:#ff7777;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    header{
        padding:0 15px;
    }

    nav{
        gap:10px;
    }

    nav a{
        font-size:12px;
    }

    .container{
        width:94%;
        padding-top:25px;
    }

    .page-title{
        font-size:24px;
    }

}

</style>

</head>


<body>


<header>

<div class="logo">
CALLAFINO
</div>

<nav>

<a href="index.html">
خانه
</a>

<a href="codm.html">
کالاف موبایل
</a>

<a href="tournament.html">
تورنمنت
</a>

</nav>

</header>


<main class="container">


<h1 class="page-title">
🏆 Tournaments
</h1>

<p class="page-subtitle">
تورنمنت موردنظر خودت را انتخاب کن و ثبت‌نام کن
</p>


<div id="message"></div>


<div
class="tournament-grid"
id="tournamentList"
>

<div class="loading">
در حال دریافت تورنمنت‌ها...
</div>

</div>


<h2 class="section-title">
🎟️ My Tournaments
</h2>


<div id="myTournaments">

<div class="loading">
در حال دریافت...
</div>

</div>


</main>


<!-- =========================
     SQUAD MODAL
========================= -->

<div
class="modal"
id="squadModal"
>

<div class="modal-box">

<h2 class="modal-title">
انتخاب Squad / Duo
</h2>


<div
class="squad-list"
id="squadList"
>

<div class="loading">
در حال دریافت تیم‌ها...
</div>

</div>


<div class="modal-actions">

<button
class="btn btn-secondary"
id="closeModal"
>
انصراف
</button>

</div>

</div>

</div>


<script type="module">

import {
    createClient
}
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://oisqrkqwbskvqkparmiw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_FGoXFElayJeRdyFxyc61hQ_c5CUn5HL";

const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   ELEMENTS
========================= */

const tournamentList =
document.getElementById(
    "tournamentList"
);

const myTournaments =
document.getElementById(
    "myTournaments"
);

const message =
document.getElementById(
    "message"
);

const squadModal =
document.getElementById(
    "squadModal"
);

const squadList =
document.getElementById(
    "squadList"
);


/* =========================
   CURRENT USER
========================= */

let currentUser = null;


/* =========================
   SELECTED TOURNAMENT
========================= */

let selectedTournament = null;


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

    if(
        value === null ||
        value === undefined
    ){
        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================
   MESSAGE
========================= */

function showMessage(
    text,
    type="success"
){

    message.innerHTML = `
        <div class="message ${type}">
            ${escapeHTML(text)}
        </div>
    `;

}


/* =========================
   GET USER
========================= */

async function getCurrentUser(){

    const {
        data,
        error
    } =
    await supabase.auth.getUser();


    if(
        error ||
        !data.user
    ){

        window.location.href =
        "login.html";

        return false;
    }


    currentUser =
    data.user;


    return true;
}


/* =========================
   LOAD TOURNAMENTS
========================= */

async function loadTournaments(){

    tournamentList.innerHTML = `
        <div class="loading">
            در حال دریافت تورنمنت‌ها...
        </div>
    `;


    const {
        data:tournaments,
        error
    } =
    await supabase
    .from("tournaments")
    .select(`
        id,
        title,
        game,
        type,
        max_players,
        status
    `)
    .in(
        "status",
        [
            "open",
            "full"
        ]
    )
    .order(
        "created_at",
        {
            ascending:false
        }
    );


    if(error){

        tournamentList.innerHTML = `
            <div class="empty">
                خطا در دریافت تورنمنت‌ها
            </div>
        `;

        showMessage(
            error.message,
            "error"
        );

        return;
    }


    if(
        !tournaments ||
        tournaments.length === 0
    ){

        tournamentList.innerHTML = `
            <div class="empty">
                در حال حاضر تورنمنتی وجود ندارد.
            </div>
        `;

        return;
    }


    /*
        برای هر تورنمنت تعداد
        ثبت‌نام‌ها را دریافت می‌کنیم.
    */

    const tournamentData = [];


    for(
        const tournament
        of tournaments
    ){

        const {
            count,
            error:countError
        } =
        await supabase
        .from("tournament_registrations")
        .select(
            "id",
            {
                count:"exact",
                head:true
            }
        )
        .eq(
            "tournament_id",
            tournament.id
        );


        /*
            اگر دسترسی به count محدود باشد،
            از status استفاده می‌کنیم.
        */

        const registered =
        countError
        ?
        (
            tournament.status === "full"
            ?
            tournament.max_players
            :
            0
        )
        :
        (
            count || 0
        );


        tournamentData.push({

            ...tournament,

            registered:registered

        });

    }


    renderTournaments(
        tournamentData
    );

}


/* =========================
   RENDER TOURNAMENTS
========================= */

function renderTournaments(
    tournaments
){

    tournamentList.innerHTML = "";


    tournaments.forEach(
        tournament => {

            const registered =
            Number(
                tournament.registered
            ) || 0;


            const maxPlayers =
            Number(
                tournament.max_players
            ) || 1;


            const isFull =
            tournament.status === "full" ||
            registered >= maxPlayers;


            let percentage =
            (
                registered /
                maxPlayers
            ) * 100;


            percentage =
            Math.min(
                100,
                Math.max(
                    0,
                    percentage
                )
            );


            const card =
            document.createElement(
                "div"
            );


            card.className =
            "tournament-card";


            card.innerHTML = `

                <h2 class="tournament-title">
                    ${escapeHTML(
                        tournament.title
                    )}
                </h2>


                <div class="game">
                    🎮
                    ${escapeHTML(
                        tournament.game
                    )}
                </div>


                <div class="info">

                    نوع:
                    <strong>
                        ${escapeHTML(
                            tournament.type
                        )}
                    </strong>

                    <br>

                    ظرفیت:
                    <span class="capacity-text">
                        <span class="capacity-number">
                            ${registered}
                        </span>
                        /
                        ${maxPlayers}
                    </span>

                    <br>

                    وضعیت:
                    ${
                        isFull
                        ?
                        `<span class="status-full">
                            🔒 FULL
                        </span>`
                        :
                        `<span class="status-open">
                            🟢 OPEN
                        </span>`
                    }

                </div>


                <div class="progress">

                    <div
                        class="progress-bar"
                        style="
                            width:${percentage}%
                        "
                    ></div>

                </div>


                ${
                    isFull

                    ?

                    `
                    <button
                        class="register-btn"
                        disabled
                    >
                        🔒 Registration Closed
                    </button>
                    `

                    :

                    `
                    <button
                        class="register-btn"
                        data-register="${tournament.id}"
                    >
                        🎟️ Register Now
                    </button>
                    `
                }

            `;


            tournamentList.appendChild(
                card
            );

        }
    );


    /*
        ثبت event دکمه‌ها
    */

    tournamentList
    .querySelectorAll(
        "[data-register]"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    const tournamentId =
                    button.dataset.register;


                    const tournament =
                    tournaments.find(
                        t =>
                        t.id ===
                        tournamentId
                    );


                    if(tournament){

                        startRegistration(
                            tournament
                        );

                    }

                }
            );

        }
    );

}


/* =========================
   START REGISTRATION
========================= */

async function startRegistration(
    tournament
){

    selectedTournament =
    tournament;


    /*
        اگر ظرفیت همین لحظه پر شده باشد،
        دوباره چک می‌کنیم.
    */

    const {
        count,
        error
    } =
    await supabase
    .from("tournament_registrations")
    .select(
        "id",
        {
            count:"exact",
            head:true
        }
    )
    .eq(
        "tournament_id",
        tournament.id
    );


    if(
        !error &&
        count >= tournament.max_players
    ){

        showMessage(
            "ظرفیت این تورنمنت پر شده است.",
            "error"
        );


        await loadTournaments();

        return;
    }


    /*
        Solo
    */

    if(
        tournament.type.toLowerCase()
        ===
        "solo"
    ){

        await registerTournament(
            tournament.id,
            null
        );

        return;
    }


    /*
        Duo / Squad
    */

    await openSquadModal(
        tournament
    );

}


/* =========================
   LOAD USER SQUADS
========================= */

async function openSquadModal(
    tournament
){

    squadModal.classList.add(
        "active"
    );


    squadList.innerHTML = `
        <div class="loading">
            در حال دریافت تیم‌ها...
        </div>
    `;


    const {
        data:squads,
        error
    } =
    await supabase
    .from("squads")
    .select(`
        id,
        player1_id,
        player2_id,
        status
    `)
    .or(
        `player1_id.eq.${currentUser.id},player2_id.eq.${currentUser.id}`
    )
    .in(
        "status",
        [
            "accepted",
            "ready"
        ]
    );


    if(error){

        squadList.innerHTML = `
            <div class="empty">
                خطا در دریافت تیم‌ها
            </div>
        `;

        return;
    }


    if(
        !squads ||
        squads.length === 0
    ){

        squadList.innerHTML = `
            <div class="empty">
                برای ثبت‌نام ابتدا باید یک Duo / Squad داشته باشید.
            </div>
        `;

        return;
    }


    /*
        دریافت نام بازیکنان
    */

    const ids = [];


    squads.forEach(
        squad => {

            if(
                squad.player1_id
            ){
                ids.push(
                    squad.player1_id
                );
            }


            if(
                squad.player2_id
            ){
                ids.push(
                    squad.player2_id
                );
            }

        }
    );


    const {
        data:profiles
    } =
    await supabase
    .from("profiles")
    .select(
        "id,username"
    )
    .in(
        "id",
        [...new Set(ids)]
    );


    const profileMap =
    new Map(
        (profiles || [])
        .map(
            profile => [
                profile.id,
                profile.username
            ]
        )
    );


    squadList.innerHTML = "";


    squads.forEach(
        squad => {

            const player1 =
            profileMap.get(
                squad.player1_id
            ) ||
            "Unknown";


            const player2 =
            profileMap.get(
                squad.player2_id
            ) ||
            "Unknown";


            const item =
            document.createElement(
                "div"
            );


            item.className =
            "squad-item";


            item.innerHTML = `

                <strong>
                    ⚔️
                    ${escapeHTML(
                        player1
                    )}

                    ${
                        squad.player2_id
                        ?
                        ` + ${escapeHTML(
                            player2
                        )}`
                        :
                        ""
                    }
                </strong>

                <span>
                    Status:
                    ${escapeHTML(
                        squad.status
                    )}
                </span>

            `;


            item.addEventListener(
                "click",
                async () => {

                    await registerTournament(
                        tournament.id,
                        squad.id
                    );

                }
            );


            squadList.appendChild(
                item
            );

        }
    );

}


/* =========================
   REGISTER TOURNAMENT
========================= */

async function registerTournament(
    tournamentId,
    squadId
){

    /*
        Modal را می‌بندیم
    */

    squadModal.classList.remove(
        "active"
    );


    showMessage(
        "در حال ثبت‌نام...",
        "success"
    );


    /*
        RPC فعلی پروژه
    */

    const {
        data,
        error
    } =
    await supabase.rpc(
        "register_for_tournament",
        {
            p_tournament_id:
            tournamentId,

            p_squad_id:
            squadId
        }
    );


    if(error){

        /*
            خطای ظرفیت پر
        */

        if(
            error.message
            .toLowerCase()
            .includes("full")
        ){

            showMessage(
                "🔒 ظرفیت تورنمنت پر شده است.",
                "error"
            );

        }

        /*
            قبلاً ثبت‌نام شده
        */

        else if(
            error.message
            .toLowerCase()
            .includes(
                "already registered"
            )
        ){

            showMessage(
                "شما قبلاً در این تورنمنت ثبت‌نام کرده‌اید.",
                "error"
            );

        }

        else{

            showMessage(
                error.message,
                "error"
            );

        }


        /*
            وضعیت جدید را بلافاصله می‌گیریم.
        */

        await loadTournaments();

        await loadMyTournaments();

        return;
    }


    /*
        موفق
    */

    showMessage(
        `✅ ثبت‌نام با موفقیت انجام شد. Slot شما: #${data.slot}`,
        "success"
    );


    /*
        مهم:
        بعد از ثبت‌نام ظرفیت دوباره
        از دیتابیس خوانده می‌شود.
    */

    await loadTournaments();

    await loadMyTournaments();

}


/* =========================
   LOAD MY TOURNAMENTS
========================= */

async function loadMyTournaments(){

    myTournaments.innerHTML = `
        <div class="loading">
            در حال دریافت...
        </div>
    `;


    const {
        data:registrations,
        error
    } =
    await supabase
    .from("tournament_registrations")
    .select(`
        id,
        tournament_id,
        squad_id,
        type,
        slot,
        created_at
    `)
    .eq(
        "user_id",
        currentUser.id
    )
    .order(
        "created_at",
        {
            ascending:false
        }
    );


    if(error){

        myTournaments.innerHTML = `
            <div class="empty">
                خطا در دریافت ثبت‌نام‌ها
            </div>
        `;

        return;
    }


    if(
        !registrations ||
        registrations.length === 0
    ){

        myTournaments.innerHTML = `
            <div class="empty">
                هنوز در هیچ تورنمنتی ثبت‌نام نکرده‌اید.
            </div>
        `;

        return;
    }


    /*
        Tournament information
    */

    const tournamentIds =
    registrations
    .map(
        registration =>
        registration.tournament_id
    )
    .filter(Boolean);


    const {
        data:tournaments
    } =
    await supabase
    .from("tournaments")
    .select(`
        id,
        title,
        game,
        type,
        max_players,
        status
    `)
    .in(
        "id",
        tournamentIds
    );


    const tournamentMap =
    new Map(
        (tournaments || [])
        .map(
            tournament => [
                tournament.id,
                tournament
            ]
        )
    );


    /*
        Render
    */

    myTournaments.innerHTML = "";


    registrations.forEach(
        registration => {

            const tournament =
            tournamentMap.get(
                registration.tournament_id
            );


            if(!tournament){
                return;
            }


            const card =
            document.createElement(
                "div"
            );


            card.className =
            "my-card";


            card.innerHTML = `

                <h3>
                    🏆
                    ${escapeHTML(
                        tournament.title
                    )}
                </h3>


                <p>

                    🎮
                    ${escapeHTML(
                        tournament.game
                    )}

                    <br>

                    نوع:
                    ${escapeHTML(
                        tournament.type
                    )}

                    <br>

                    Slot:
                    <span class="slot">
                        #${escapeHTML(
                            registration.slot
                        )}
                    </span>

                    <br>

                    وضعیت تورنمنت:
                    ${
                        tournament.status ===
                        "full"

                        ?

                        `<span class="status-full">
                            🔒 Full
                        </span>`

                        :

                        `<span class="status-open">
                            🟢 Open
                        </span>`
                    }

                </p>

            `;


            myTournaments.appendChild(
                card
            );

        }
    );

}


/* =========================
   CLOSE MODAL
========================= */

document
.getElementById(
    "closeModal"
)
.addEventListener(
    "click",
    () => {

        squadModal.classList.remove(
            "active"
        );

    }
);


/*
    کلیک بیرون Modal
*/

squadModal.addEventListener(
    "click",
    event => {

        if(
            event.target ===
            squadModal
        ){

            squadModal.classList.remove(
                "active"
            );

        }

    }
);


/* =========================
   START
========================= */

const loggedIn =
await getCurrentUser();


if(loggedIn){

    await loadTournaments();

    await loadMyTournaments();

}

</script>

</body>
</html>
