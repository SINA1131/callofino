<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>CALLAFINO | Tournaments</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    background:#050505;
    color:#fff;
    min-height:100vh;
}

header{
    height:70px;
    background:#080808;
    border-bottom:1px solid #1aff00;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 40px;
}

.logo{
    color:#1aff00;
    font-size:25px;
    font-weight:bold;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:25px;
}

nav a:hover{
    color:#1aff00;
}

.container{
    width:90%;
    max-width:1200px;
    margin:40px auto;
}

.title{
    text-align:center;
    margin-bottom:35px;
}

.title h1{
    color:#1aff00;
    font-size:35px;
    margin-bottom:10px;
}

.title p{
    color:#aaa;
}

.tournaments{
    display:grid;
    grid-template-columns:
    repeat(
        auto-fit,
        minmax(280px,1fr)
    );
    gap:20px;
}

.tournament-card{
    background:#0c0c0c;
    border:1px solid #222;
    border-radius:12px;
    overflow:hidden;
}

.tournament-card:hover{
    border-color:#1aff00;
}

.tournament-image{
    width:100%;
    height:180px;
    object-fit:cover;
}

.tournament-placeholder{
    width:100%;
    height:180px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:50px;
    color:#1aff00;
    background:#101010;
}

.tournament-content{
    padding:22px;
}

.tournament-content h2{
    color:#1aff00;
    margin-bottom:15px;
}

.info{
    color:#aaa;
    line-height:2;
    margin-bottom:15px;
}

button{
    border:0;
    cursor:pointer;
    border-radius:7px;
    padding:11px 15px;
    font-weight:bold;
}

.register-btn{
    width:100%;
    background:#1aff00;
    color:#000;
}

.view-btn{
    width:100%;
    margin-top:10px;
    background:#151515;
    border:1px solid #1aff00;
    color:#1aff00;
}


/* ==========================================
   ROOM ANNOUNCEMENT
========================================== */

.room-announcement{
    display:none;
    position:relative;
    margin-bottom:30px;
    background:#090909;
    border:2px solid #1aff00;
    border-radius:15px;
    overflow:hidden;
    box-shadow:
        0 0 25px
        rgba(26,255,0,.15);
    animation:roomPulse 2s infinite;
}

@keyframes roomPulse{

    0%{
        box-shadow:
        0 0 15px
        rgba(26,255,0,.08);
    }

    50%{
        box-shadow:
        0 0 35px
        rgba(26,255,0,.22);
    }

    100%{
        box-shadow:
        0 0 15px
        rgba(26,255,0,.08);
    }

}

.room-image{
    width:100%;
    max-height:400px;
    object-fit:cover;
    display:block;
}

.room-content{
    padding:25px;
    text-align:center;
}

.room-title{
    color:#1aff00;
    font-size:25px;
    margin-bottom:12px;
}

.room-code{
    direction:ltr;
    color:#1aff00;
    font-size:38px;
    font-weight:bold;
    letter-spacing:5px;
    margin:15px 0;
}

.room-timer{
    color:#aaa;
    font-size:14px;
}

.room-timer strong{
    color:#fff;
}


/* ==========================================
   DETAILS
========================================== */

.details{
    display:none;
    background:#090909;
    border:1px solid #1aff00;
    border-radius:14px;
    overflow:hidden;
    margin-top:40px;
}

.details-image{
    width:100%;
    max-height:430px;
    object-fit:cover;
}

.details-content{
    padding:30px;
}

.details-title{
    color:#1aff00;
    font-size:30px;
    margin-bottom:20px;
}

.details-info{
    display:grid;
    grid-template-columns:
    repeat(
        auto-fit,
        minmax(180px,1fr)
    );
    gap:12px;
}

.detail-box{
    background:#111;
    border:1px solid #222;
    border-radius:9px;
    padding:14px;
    color:#ddd;
}

.detail-box strong{
    display:block;
    color:#1aff00;
    margin-bottom:6px;
}

.detail-block{
    margin-top:25px;
}

.detail-block h3{
    color:#1aff00;
    margin-bottom:10px;
}

.detail-text{
    background:#111;
    border:1px solid #222;
    border-radius:9px;
    padding:18px;
    color:#ccc;
    line-height:2;
    white-space:pre-wrap;
}

.slots{
    display:grid;
    grid-template-columns:
    repeat(
        auto-fit,
        minmax(230px,1fr)
    );
    gap:15px;
}

.slot{
    background:#0c0c0c;
    border:1px solid #222;
    border-radius:10px;
    padding:15px;
}

.slot-title{
    color:#1aff00;
    margin-bottom:10px;
    font-weight:bold;
}

.slot-size{
    color:#777;
    font-size:12px;
    margin-right:8px;
}

.player{
    background:#151515;
    border-radius:6px;
    padding:9px;
    margin-top:7px;
}

.empty{
    color:#666;
}

.close{
    width:100%;
    margin-top:25px;
    background:#222;
    color:#fff;
}


/* ==========================================
   SQUAD MODAL
========================================== */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.85);
    align-items:center;
    justify-content:center;
    z-index:1000;
}

.modal-box{
    width:90%;
    max-width:500px;
    background:#0b0b0b;
    border:1px solid #1aff00;
    border-radius:12px;
    padding:25px;
}

.modal-box h2{
    color:#1aff00;
    margin-bottom:20px;
}

.squad-item{
    background:#151515;
    border:1px solid #222;
    padding:14px;
    border-radius:8px;
    margin-bottom:10px;
    cursor:pointer;
}

.squad-item:hover{
    border-color:#1aff00;
}

.close-modal{
    width:100%;
    background:#222;
    color:#fff;
    margin-top:10px;
}

.loading{
    text-align:center;
    color:#777;
    padding:30px;
}

.error{
    text-align:center;
    color:#ff5555;
    padding:20px;
}

.my-tournaments{
    margin-top:50px;
}

.my-tournaments h2{
    color:#1aff00;
    margin-bottom:20px;
}

.my-item{
    background:#0c0c0c;
    border:1px solid #222;
    padding:15px;
    border-radius:8px;
    margin-bottom:10px;
}

@media(max-width:600px){

    header{
        padding:0 15px;
    }

    nav a{
        margin-left:8px;
        font-size:12px;
    }

    .container{
        width:94%;
    }

    .details-content{
        padding:20px;
    }

    .room-code{
        font-size:28px;
    }

}

</style>

</head>

<script type="module">


import {
    createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
"https://oisqrkqwbskvqkparmiw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_FGoXFElayJeRdyFxyc61hQ_c5CUn5HL";

const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


let currentUser = null;

let selectedTournament = null;

let roomTimerInterval = null;


/* ==========================================
   ESCAPE
========================================== */

function escapeHTML(value){

    if(
        value === null ||
        value === undefined
    )
        return "";

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ==========================================
   INIT
========================================== */

async function init(){

    const {
        data:{
            user
        }
    } =
    await supabase.auth.getUser();


    if(!user){

        location.href =
        "login.html";

        return;

    }


    currentUser =
    user;


    await loadTournaments();

    await loadMyTournaments();

    await checkRoomAnnouncement();


    setInterval(
        checkRoomAnnouncement,
        3000
    );

}


/* ==========================================
   LOAD TOURNAMENTS
========================================== */

async function loadTournaments(){

    const container =
    document.getElementById(
        "tournaments"
    );


    const {
        data,
        error
    } =
    await supabase
    .from("tournaments")
    .select("*")
    .order(
        "created_at",
        {
            ascending:false
        }
    );


    if(error){

        container.innerHTML =
        `<div class="error">
            ${escapeHTML(
                error.message
            )}
        </div>`;

        return;

    }


    if(!data?.length){

        container.innerHTML =
        `<div class="loading">
            No tournaments available.
        </div>`;

        return;

    }


    container.innerHTML = "";


    for(
        const tournament
        of data
    ){

        const card =
        document.createElement(
            "div"
        );


        card.className =
        "tournament-card";


        const image =
        tournament.image_url
        ?

        `<img
            class="tournament-image"
            src="${escapeHTML(
                tournament.image_url
            )}"
        >`

        :

        `<div class="tournament-placeholder">
            🏆
        </div>`;


        card.innerHTML = `

            ${image}

            <div class="tournament-content">

                <h2>
                    ${escapeHTML(
                        tournament.title
                    )}
                </h2>

                <div class="info">

                    🎮
                    ${escapeHTML(
                        tournament.game
                    )}

                    <br>

                    👥
                    ${escapeHTML(
                        tournament.type
                    )}

                    <br>

                    🪑 ظرفیت:
                    ${escapeHTML(
                        tournament.max_players
                    )}

                    <br>

                    📅
                    ${escapeHTML(
                        tournament.tournament_date || "-"
                    )}

                    <br>

                    ⏰
                    ${escapeHTML(
                        tournament.tournament_time || "-"
                    )}

                </div>


                <button
                    class="register-btn"
                    data-register="${tournament.id}"
                >
                    Register
                </button>


                <button
                    class="view-btn"
                    data-view="${tournament.id}"
                >
                    مشاهده
                </button>

            </div>

        `;


        card
        .querySelector(
            "[data-register]"
        )
        .onclick =
        () =>
        registerTournament(
            tournament
        );


        card
        .querySelector(
            "[data-view]"
        )
        .onclick =
        () =>
        showDetails(
            tournament
        );


        container.appendChild(
            card
        );

    }

}

   DETAILS

async function showDetails(

    document.getElementById(

            ${escapeHTML(

            )}

        </div>


        <div class="detail-box">

        </div>


        <div class="detail-box">

            <strong>📅 تاریخ</strong>

        <div class="detail-box">

            ${escapeHTML(

        <div class="detail-box">

            )}

    `;


    document.getElementById(

    document.getElementById(

window.closeDetails =
function(){

/* ==========================================
   SLOTS
========================================== */

async function loadSlots(
    tournament
){

    const container =
    document.getElementById(
        "detailsSlots"
    );


    container.innerHTML =
    `<div class="loading">
        Loading...
    </div>`;


    const {
        data,
        error
    } =
    await supabase.rpc(
        "get_tournament_slots",
        {
            p_tournament_id:
            tournament.id
        }
    );


    if(error){

        container.innerHTML =
        `<div class="error">
            ${escapeHTML(
                error.message
            )}
        </div>`;

        return;

    }


    container.innerHTML = "";


    /*
        تعیین تعداد نفرات هر Slot

        Solo  = 1
        Duo   = 2
        Squad = 4
    */

    const type =
    String(
        tournament.type || ""
    ).toLowerCase();


    const slotSize =
        type === "solo"
        ? 1
        :
        type === "duo"
        ? 2
        :
        type === "squad"
        ? 4
        :
        1;


    if(!data?.length){

        container.innerHTML =
        `<div class="empty">
            هنوز اسلاتی وجود ندارد.
        </div>`;

        return;

    }


    data.forEach(
        slot => {

            const div =
            document.createElement(
                "div"
            );


            div.className =
            "slot";


            /*
                بازیکنان این Slot
            */

            let players = [];


            for(
                let i = 1;
                i <= slotSize;
                i++
            ){

                const name =
                slot[
                    `player${i}_name`
                ];


                players.push(`

                    <div
                        class="player ${
                            name
                            ? ""
                            : "empty"
                        }"
                    >

                        👤

                        ${escapeHTML(
                            name || "خالی"
                        )}

                    </div>

                `);

            }


            div.innerHTML = `

                <div class="slot-title">

                    Slot #
                    ${escapeHTML(
                        slot.slot
                    )}

                    <span
                        class="slot-size"
                    >
                        ${slotSize} نفره
                    </span>

                </div>


                ${players.join("")}

            `;


            container.appendChild(
                div
            );

        }
    );

}


/* ==========================================
   ROOM ANNOUNCEMENT
========================================== */

async function checkRoomAnnouncement(){

    if(!currentUser)
        return;


    const {
        data:registrations,
        error
    } =
    await supabase
    .from(
        "tournament_registrations"
    )
    .select(
        "tournament_id"
    )
    .eq(
        "user_id",
        currentUser.id
    );


    if(error){

        console.error(error);

        return;

    }


    if(
        !registrations ||
        !registrations.length
    ){

        hideRoomAnnouncement();

        return;

    }


    const ids =
    registrations.map(
        r => r.tournament_id
    );


    const {
        data:announcements,
        error:announcementError
    } =
    await supabase
    .from(
        "tournament_room_announcements"
    )
    .select(`
        id,
        tournament_id,
        room_code,
        image_url,
        starts_at,
        ends_at,
        tournaments (
            title
        )
    `)
    .in(
        "tournament_id",
        ids
    )
    .lte(
        "starts_at",
        new Date().toISOString()
    )
    .gt(
        "ends_at",
        new Date().toISOString()
    )
    .order(
        "starts_at",
        {
            ascending:false
        }
    )
    .limit(1);


    if(announcementError){

        console.error(
            announcementError
        );

        return;

    }


    if(
        !announcements ||
        !announcements.length
    ){

        hideRoomAnnouncement();

        return;

    }


    showRoomAnnouncement(
        announcements[0]
    );

}


/* ==========================================
   SHOW ROOM
========================================== */

function showRoomAnnouncement(
    announcement
){

    const box =
    document.getElementById(
        "roomAnnouncement"
    );


    const imageContainer =
    document.getElementById(
        "roomImageContainer"
    );


    if(announcement.image_url){

        imageContainer.innerHTML =
        `<img
            class="room-image"
            src="${escapeHTML(
                announcement.image_url
            )}"
        >`;

    }
    else{

        imageContainer.innerHTML = "";

    }


    document.getElementById(
        "roomTitle"
    ).textContent =
    "🚨 " +
    (
        announcement.tournaments?.title
        ||
        "ROOM IS OPEN"
    );


    document.getElementById(
        "roomCode"
    ).textContent =
    announcement.room_code;


    box.style.display =
    "block";


    updateRoomTimer(
        announcement.ends_at
    );

}


/* ==========================================
   TIMER
========================================== */

function updateRoomTimer(
    endsAt
){

    if(roomTimerInterval){

        clearInterval(
            roomTimerInterval
        );

    }


    function update(){

        const now =
        Date.now();


        const end =
        new Date(
            endsAt
        ).getTime();


        const remaining =
        end - now;


        if(
            remaining <= 0
        ){

            hideRoomAnnouncement();

            return;

        }


        const totalSeconds =
        Math.floor(
            remaining / 1000
        );


        const minutes =
        Math.floor(
            totalSeconds / 60
        );


        const seconds =
        totalSeconds % 60;


        document.getElementById(
            "roomTimer"
        ).textContent =

        `${minutes} دقیقه و ${String(
            seconds
        ).padStart(
            2,
            "0"
        )} ثانیه`;

    }


    update();


    roomTimerInterval =
    setInterval(
        update,
        1000
    );

}


/* ==========================================
   HIDE ROOM
========================================== */

function hideRoomAnnouncement(){

    const box =
    document.getElementById(
        "roomAnnouncement"
    );


    box.style.display =
    "none";


    if(roomTimerInterval){

        clearInterval(
            roomTimerInterval
        );

        roomTimerInterval =
        null;

    }

}


/* ==========================================
   REGISTER
========================================== */

async function registerTournament(
    tournament
){

    const type =
    String(
        tournament.type || ""
    ).toLowerCase();


    if(type === "solo"){

        await doRegister(
            tournament.id,
            null
        );

        return;

    }


    selectedTournament =
    tournament;


    const modal =
    document.getElementById(
        "squadModal"
    );


    const list =
    document.getElementById(
        "squadList"
    );


    document.getElementById(
        "modalTitle"
    ).textContent =
    type === "squad"
    ?
    "Select Squad"
    :
    "Select Duo";


    modal.style.display =
    "flex";


    list.innerHTML =
    `<div class="loading">
        Loading...
    </div>`;


    const {
        data:squads,
        error
    } =
    await supabase
    .from("squads")
    .select(`
        id,
        player1_id,
        player2_id,
        player3_id,
        player4_id,
        status
    `)
    .in(
        "status",
        [
            "accepted",
            "ready"
        ]
    );


    if(error){

        list.innerHTML =
        `<div class="error">
            ${escapeHTML(
                error.message
            )}
        </div>`;

        return;

    }


    const mySquads =
    (squads || [])
    .filter(
        squad => {

            return (

                squad.player1_id ===
                currentUser.id

                ||

                squad.player2_id ===
                currentUser.id

                ||

                squad.player3_id ===
                currentUser.id

                ||

                squad.player4_id ===
                currentUser.id

            );

        }
    );


    if(!mySquads.length){

        list.innerHTML =
        `<div class="loading">
            شما Duo / Squad واجد شرایط ندارید.
        </div>`;

        return;

    }


    const ids = [];


    mySquads.forEach(
        squad => {

            [
                squad.player1_id,
                squad.player2_id,
                squad.player3_id,
                squad.player4_id
            ]
            .forEach(
                id => {

                    if(
                        id &&
                        !ids.includes(id)
                    )
                        ids.push(id);

                }
            );

        }
    );


    const {
        data:profiles
    } =
    await supabase
    .from("profiles")
    .select(
        "id,username"
    )
    .in(
        "id",
        ids
    );


    const map =
    new Map(
        (profiles || [])
        .map(
            p => [
                p.id,
                p.username
            ]
        )
    );


    list.innerHTML = "";


    mySquads.forEach(
        squad => {

            const item =
            document.createElement(
                "div"
            );


            item.className =
            "squad-item";


            const names =
            [
                squad.player1_id,
                squad.player2_id,
                squad.player3_id,
                squad.player4_id
            ]
            .filter(Boolean)
            .map(
                id =>
                map.get(id) ||
                "Unknown"
            );


            item.innerHTML = `

                <strong
                    style="color:#1aff00;"
                >

                    ${escapeHTML(
                        type === "squad"
                        ?
                        "Squad"
                        :
                        "Duo"
                    )}

                </strong>

                <br><br>

                ${names
                    .map(
                        n =>
                        `👤 ${escapeHTML(n)}`
                    )
                    .join("<br>")
                }

            `;


            item.onclick =
            async () => {

                await doRegister(
                    tournament.id,
                    squad.id
                );

            };


            list.appendChild(
                item
            );

        }
    );

}


async function doRegister(
    tournamentId,
    squadId
){

    const {
        data,
        error
    } =
    await supabase.rpc(
        "register_for_tournament",
        {
            p_tournament_id:
            tournamentId,

            p_squad_id:
            squadId
        }
    );


    if(error){

        alert(
            error.message
        );

        return;

    }


    alert(
        `ثبت‌نام موفق بود.\nSlot #${data.slot}`
    );


    closeSquadModal();


    await loadTournaments();

    await loadMyTournaments();

    await checkRoomAnnouncement();

}


window.closeSquadModal =
function(){

    document.getElementById(
        "squadModal"
    ).style.display =
    "none";

};


/* ==========================================
   MY TOURNAMENTS
========================================== */

async function loadMyTournaments(){

    const container =
    document.getElementById(
        "myTournaments"
    );


    const {
        data,
        error
    } =
    await supabase
    .from(
        "tournament_registrations"
    )
    .select(`
        slot,
        type,
        tournaments (
            title,
            game,
            tournament_date,
            tournament_time
        )
    `)
    .eq(
        "user_id",
        currentUser.id
    )
    .order(
        "created_at",
        {
            ascending:false
        }
    );


    if(error){

        container.innerHTML =
        `<div class="error">
            ${escapeHTML(
                error.message
            )}
        </div>`;

        return;

    }


    if(!data?.length){

        container.innerHTML =
        `<div class="loading">
            هنوز در مسابقه‌ای ثبت‌نام نکرده‌اید.
        </div>`;

        return;

    }


    container.innerHTML = "";


    data.forEach(
        item => {

            const div =
            document.createElement(
                "div"
            );


            div.className =
            "my-item";


            const t =
            item.tournaments;


            div.innerHTML = `

                <strong
                    style="color:#1aff00;"
                >
                    ${escapeHTML(
                        t?.title ||
                        "Tournament"
                    )}
                </strong>

                <br><br>

                🎮
                ${escapeHTML(
                    t?.game || "-"
                )}

                <br>

                📅
                ${escapeHTML(
                    t?.tournament_date || "-"
                )}

                |

                ⏰
                ${escapeHTML(
                    t?.tournament_time || "-"
                )}

                <br>

                🪑
                Slot #${escapeHTML(
                    item.slot
                )}

            `;


            container.appendChild(
                div
            );

        }
    );

}


init();
