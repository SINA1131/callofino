<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CALLAFINO | Tournaments</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    background:#050505;
    color:white;
    min-height:100vh;
}

/* HEADER */

header{
    height:80px;
    background:#080808;
    border-bottom:1px solid #1d1d1d;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 7%;
}

.logo{
    color:#00ff88;
    font-size:27px;
    font-weight:bold;
    letter-spacing:2px;
}

nav{
    display:flex;
    gap:30px;
}

nav a{
    color:#aaa;
    text-decoration:none;
    transition:.3s;
}

nav a:hover{
    color:#00ff88;
}

/* MAIN */

.container{
    width:86%;
    max-width:1200px;
    margin:auto;
    padding:70px 0;
}

.page-title{
    text-align:center;
    margin-bottom:50px;
}

.page-title h1{
    font-size:45px;
    margin-bottom:12px;
}

.page-title h1 span{
    color:#00ff88;
}

.page-title p{
    color:#777;
}

/* TOURNAMENT GRID */

.tournament-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
}

/* CARD */

.tournament-card{
    background:#0b0b0b;
    border:1px solid #202020;
    border-radius:16px;
    padding:25px;
    transition:.3s;
}

.tournament-card:hover{
    transform:translateY(-5px);
    border-color:#00ff88;
    box-shadow:0 0 25px rgba(0,255,136,.1);
}

.card-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.game{
    color:#00ff88;
    font-size:13px;
    font-weight:bold;
}

.status{
    padding:6px 10px;
    border-radius:20px;
    font-size:12px;
    background:#102b1e;
    color:#00ff88;
}

.status.full{
    background:#2b1010;
    color:#ff5555;
}

.status.closed{
    background:#252525;
    color:#888;
}

.tournament-card h2{
    font-size:22px;
    margin-bottom:18px;
}

.info{
    display:flex;
    flex-direction:column;
    gap:12px;
    color:#aaa;
    font-size:14px;
    margin-bottom:20px;
}

.info div{
    display:flex;
    justify-content:space-between;
}

.info strong{
    color:white;
}

/* CAPACITY */

.capacity{
    margin-bottom:20px;
}

.capacity-text{
    display:flex;
    justify-content:space-between;
    color:#888;
    font-size:13px;
    margin-bottom:8px;
}

.progress{
    width:100%;
    height:8px;
    background:#1b1b1b;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    background:#00ff88;
    width:0%;
    transition:.4s;
}

/* BUTTON */

.register-btn{
    width:100%;
    padding:13px;
    border:none;
    border-radius:8px;
    background:#00ff88;
    color:#000;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.register-btn:hover{
    box-shadow:0 0 20px rgba(0,255,136,.4);
}

.register-btn:disabled{
    background:#252525;
    color:#666;
    cursor:not-allowed;
    box-shadow:none;
}

/* MY TOURNAMENTS */

.my-tournaments{
    margin-top:100px;
}

.section-title{
    margin-bottom:30px;
}

.section-title h2{
    font-size:30px;
}

.section-title p{
    color:#777;
    margin-top:8px;
}

.my-list{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.my-item{
    background:#0b0b0b;
    border:1px solid #1c1c1c;
    border-radius:12px;
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.my-info h3{
    margin-bottom:8px;
}

.my-info p{
    color:#777;
    font-size:13px;
}

.slot{
    background:#102b1e;
    border:1px solid #00ff88;
    color:#00ff88;
    padding:10px 15px;
    border-radius:8px;
    font-weight:bold;
}

/* EMPTY */

.empty{
    text-align:center;
    padding:40px;
    background:#0b0b0b;
    border:1px solid #1c1c1c;
    border-radius:12px;
    color:#666;
}

/* LOADING */

.loading{
    text-align:center;
    color:#777;
    padding:50px;
}

/* RESPONSIVE */

@media(max-width:900px){

    .tournament-grid{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:650px){

    header{
        padding:0 5%;
    }

    nav{
        gap:12px;
    }

    nav a{
        font-size:12px;
    }

    .container{
        width:92%;
    }

    .tournament-grid{
        grid-template-columns:1fr;
    }

    .page-title h1{
        font-size:35px;
    }

    .my-item{
        flex-direction:column;
        align-items:flex-start;
        gap:15px;
    }

}

</style>
</head>

<body>

<header>

    <div class="logo">
        CALLAFINO.
    </div>

    <nav>
        <a href="index.html">خانه</a>
        <a href="codm.html">کالاف موبایل</a>
        <a href="dashboard.html">داشبورد</a>
    </nav>

</header>


<main class="container">

    <div class="page-title">

        <h1>
            <span>TOURNAMENT</span>
        </h1>

        <p>
            تورنمنت موردنظر خود را انتخاب و ثبت‌نام کنید
        </p>

    </div>


    <!-- ACTIVE TOURNAMENTS -->

    <section>

        <div class="section-title">

            <h2>🏆 تورنمنت‌های فعال</h2>

            <p>
                مسابقات در حال ثبت‌نام
            </p>

        </div>

        <div id="tournamentGrid" class="tournament-grid">

            <div class="loading">
                در حال دریافت تورنمنت‌ها...
            </div>

        </div>

    </section>


    <!-- MY TOURNAMENTS -->

    <section class="my-tournaments">

        <div class="section-title">

            <h2>🎟️ My Tournaments</h2>

            <p>
                تورنمنت‌هایی که در آن‌ها ثبت‌نام کرده‌اید
            </p>

        </div>

        <div id="myTournaments" class="my-list">

            <div class="loading">
                در حال دریافت اطلاعات...
            </div>

        </div>

    </section>

</main>


<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/* SUPABASE */

const SUPABASE_URL =
"https://oisqrkqwbskvqkparmiw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_FGoXFElayJeRdyFxyc61hQ_c5CUn5HL";

const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ELEMENTS */

const tournamentGrid =
document.getElementById("tournamentGrid");

const myTournaments =
document.getElementById("myTournaments");


/* LOAD */

async function loadPage(){

    const {
        data: {
            user
        }
    } = await supabase.auth.getUser();


    if(!user){

        tournamentGrid.innerHTML = `
            <div class="empty">
                برای مشاهده و ثبت‌نام باید وارد حساب خود شوید.
            </div>
        `;

        myTournaments.innerHTML = `
            <div class="empty">
                ابتدا وارد حساب کاربری شوید.
            </div>
        `;

        return;
    }


    await loadTournaments(user.id);

    await loadMyTournaments(user.id);

}


/* ACTIVE TOURNAMENTS */

async function loadTournaments(userId){

    const {
        data: tournaments,
        error
    } = await supabase
        .from("tournaments")
        .select("*")
        .in("status", ["open", "full"])
        .order("start_time", {
            ascending:true
        });


    if(error){

        console.error(error);

        tournamentGrid.innerHTML = `
            <div class="empty">
                خطا در دریافت تورنمنت‌ها.
            </div>
        `;

        return;
    }


    if(!tournaments || tournaments.length === 0){

        tournamentGrid.innerHTML = `
            <div class="empty">
                در حال حاضر تورنمنت فعالی وجود ندارد.
            </div>
        `;

        return;
    }


    tournamentGrid.innerHTML = "";


    for(const tournament of tournaments){

        /* REGISTERED PLAYERS */

        const {
            data: registrations
        } = await supabase
            .from("tournament_registrations")
            .select("id,user_id,slot")
            .eq("tournament_id", tournament.id);


        const count =
            registrations
            ? registrations.length
            : 0;


        const registered =
            registrations?.some(
                r => r.user_id === userId
            );


        const capacity =
            tournament.max_players || 0;


        const percentage =
            capacity > 0
            ? Math.min(
                100,
                Math.round(
                    (count / capacity) * 100
                )
            )
            : 0;


        let statusText =
            tournament.status;


        let statusClass =
            "";


        if(tournament.status === "open"){

            statusText = "باز";

        }

        if(tournament.status === "full"){

            statusText = "تکمیل";

            statusClass = "full";

        }

        if(
            tournament.status !== "open" &&
            tournament.status !== "full"
        ){

            statusText = "بسته";

            statusClass = "closed";

        }


        let buttonText =
            "ثبت‌نام";


        let disabled = false;


        if(registered){

            buttonText =
                "✓ ثبت‌نام شده";

            disabled = true;

        }
        else if(tournament.status !== "open"){

            buttonText =
                "ظرفیت تکمیل";

            disabled = true;

        }


        const startTime =
            tournament.start_time
            ? new Date(
                tournament.start_time
            ).toLocaleString(
                "fa-IR",
                {
                    dateStyle:"medium",
                    timeStyle:"short"
                }
            )
            : "زمان مشخص نشده";


        const card =
        document.createElement("div");

        card.className =
            "tournament-card";


        card.innerHTML = `

            <div class="card-top">

                <span class="game">
                    ${escapeHTML(
                        tournament.game
                    )}
                </span>

                <span class="status ${statusClass}">
                    ${statusText}
                </span>

            </div>


            <h2>
                ${escapeHTML(
                    tournament.title
                )}
            </h2>


            <div class="info">

                <div>
                    <span>نوع</span>
                    <strong>
                        ${escapeHTML(
                            tournament.type
                        )}
                    </strong>
                </div>


                <div>
                    <span>شروع</span>
                    <strong>
                        ${startTime}
                    </strong>
                </div>

            </div>


            <div class="capacity">

                <div class="capacity-text">

                    <span>
                        ظرفیت
                    </span>

                    <span>
                        ${count} / ${capacity}
                    </span>

                </div>


                <div class="progress">

                    <div
                        class="progress-bar"
                        style="width:${percentage}%"
                    ></div>

                </div>

            </div>


            <button
                class="register-btn"
                ${disabled ? "disabled" : ""}
                data-id="${tournament.id}"
            >
                ${buttonText}
            </button>

        `;


        const button =
            card.querySelector(
                ".register-btn"
            );


        if(!disabled){

            button.addEventListener(
                "click",
                () => registerTournament(
                    tournament.id
                )
            );

        }


        tournamentGrid.appendChild(card);

    }

}


/* REGISTER */

async function registerTournament(
    tournamentId
){

    const {
        data: {
            user
        }
    } = await supabase.auth.getUser();


    if(!user){

        alert(
            "ابتدا وارد حساب کاربری شوید."
        );

        return;

    }


    const button =
        document.querySelector(
            `[data-id="${tournamentId}"]`
        );


    if(button){

        button.disabled = true;

        button.textContent =
            "در حال ثبت‌نام...";

    }


    const {
        data,
        error
    } = await supabase.rpc(
        "register_for_tournament",
        {
            p_tournament_id:
                tournamentId,

            p_squad_id:
                null
        }
    );


    if(error){

        console.error(error);

        alert(
            error.message ||
            "ثبت‌نام انجام نشد."
        );

        if(button){

            button.disabled = false;

            button.textContent =
                "ثبت‌نام";

        }

        return;

    }


    alert(
        `ثبت‌نام با موفقیت انجام شد!\nSlot شما: ${data.slot}`
    );


    await loadTournaments(
        user.id
    );

    await loadMyTournaments(
        user.id
    );

}


/* MY TOURNAMENTS */

async function loadMyTournaments(
    userId
){

    const {
        data,
        error
    } = await supabase
        .from(
            "tournament_registrations"
        )
        .select(`
            id,
            slot,
            type,
            tournament_id,
            tournaments (
                title,
                game,
                type,
                max_players,
                status,
                start_time
            )
        `)
        .eq(
            "user_id",
            userId
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(error);

        myTournaments.innerHTML = `
            <div class="empty">
                خطا در دریافت ثبت‌نام‌های شما.
            </div>
        `;

        return;
    }


    if(!data || data.length === 0){

        myTournaments.innerHTML = `
            <div class="empty">
                هنوز در هیچ تورنمنتی ثبت‌نام نکرده‌اید.
            </div>
        `;

        return;
    }


    myTournaments.innerHTML = "";


    data.forEach(registration => {

        const tournament =
            registration.tournaments;


        if(!tournament)
            return;


        const startTime =
            tournament.start_time
            ? new Date(
                tournament.start_time
            ).toLocaleString(
                "fa-IR",
                {
                    dateStyle:"medium",
                    timeStyle:"short"
                }
            )
            : "نامشخص";


        const item =
        document.createElement("div");

        item.className =
            "my-item";


        item.innerHTML = `

            <div class="my-info">

                <h3>
                    ${escapeHTML(
                        tournament.title
                    )}
                </h3>

                <p>
                    ${escapeHTML(
                        tournament.game
                    )}
                    •
                    ${escapeHTML(
                        tournament.type
                    )}
                    •
                    شروع:
                    ${startTime}
                </p>

            </div>


            <div class="slot">

                SLOT #${registration.slot}

            </div>

        `;


        myTournaments.appendChild(
            item
        );

    });

}


/* SECURITY */

function escapeHTML(value){

    if(value === null ||
       value === undefined){

        return "";

    }

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* START */

loadPage();

</script>

</body>
</html>
