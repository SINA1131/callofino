<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>
CALLAFINO | Tournaments
</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Tahoma,sans-serif;
}


body{
    background:#080808;
    color:#fff;
    min-height:100vh;
}


header{

    background:#101010;

    border-bottom:1px solid #292929;

    padding:18px 30px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:20px;
}


.logo{

    color:#d4af37;

    font-size:25px;

    font-weight:bold;
}


nav{

    display:flex;

    gap:8px;

    flex-wrap:wrap;
}


nav a{

    color:#aaa;

    text-decoration:none;

    padding:10px 14px;

    border-radius:8px;
}


nav a:hover{

    background:#1d1d1d;

    color:#d4af37;
}


.container{

    width:92%;

    max-width:1250px;

    margin:35px auto;
}


.title{

    margin-bottom:25px;
}


.title h1{

    font-size:32px;

    color:#fff;
}


.title span{

    color:#d4af37;
}


.title p{

    color:#888;

    margin-top:8px;
}


/* TOURNAMENT GRID */

.tournaments{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(300px,1fr));

    gap:20px;
}


.tournament{

    background:#111;

    border:1px solid #292929;

    border-radius:18px;

    padding:22px;

    transition:.2s;
}


.tournament:hover{

    border-color:#d4af37;

    transform:translateY(-3px);
}


.tournament h2{

    color:#d4af37;

    margin-bottom:15px;
}


.info{

    display:grid;

    gap:8px;

    color:#aaa;

    margin-bottom:18px;
}


.info strong{

    color:#fff;
}


.badge{

    display:inline-block;

    padding:5px 10px;

    border-radius:20px;

    background:#1e1e1e;

    color:#d4af37;

    font-size:12px;
}


.register-btn{

    width:100%;

    padding:13px;

    border:0;

    border-radius:9px;

    background:#d4af37;

    color:#080808;

    font-weight:bold;

    cursor:pointer;
}


.register-btn:disabled{

    opacity:.4;

    cursor:not-allowed;
}


.register-btn:hover:not(:disabled){

    opacity:.85;
}


/* SLOTS */

.slot-section{

    margin-top:45px;
}


.slot-section h2{

    color:#d4af37;

    margin-bottom:20px;
}


.slot-title{

    color:#fff;

    margin-bottom:15px;
}


.slots{

    display:grid;

    grid-template-columns:
    repeat(auto-fill,minmax(180px,1fr));

    gap:15px;

    margin-bottom:35px;
}


.slot{

    background:#101010;

    border:1px solid #292929;

    border-radius:14px;

    padding:17px;

    min-height:145px;
}


.slot-number{

    color:#d4af37;

    font-weight:bold;

    margin-bottom:12px;
}


.player{

    background:#191919;

    border-radius:8px;

    padding:8px;

    margin-top:7px;

    color:#ddd;

    font-size:14px;
}


.empty{

    color:#555;

    text-align:center;

    margin-top:25px;
}


.full{

    border-color:#8b6420;
}


/* MY TOURNAMENTS */

.my-section{

    margin-top:45px;
}


.my-card{

    background:#111;

    border:1px solid #292929;

    border-radius:15px;

    padding:18px;

    margin-bottom:12px;
}


.my-card h3{

    color:#d4af37;

    margin-bottom:8px;
}


.error{

    display:none;

    background:#301010;

    border:1px solid #702828;

    color:#ff8585;

    padding:14px;

    border-radius:10px;

    margin-bottom:20px;
}


.success{

    display:none;

    background:#102c18;

    border:1px solid #28683a;

    color:#8dffa9;

    padding:14px;

    border-radius:10px;

    margin-bottom:20px;
}


@media(max-width:700px){

    header{

        flex-direction:column;

    }

    nav{

        justify-content:center;

    }

}

</style>

</head>


<body>


<header>

    <div class="logo">
        CALLAFINO
    </div>


    <nav>

        <a href="dashboard.html">
            داشبورد
        </a>

        <a href="tournament.html">
            تورنومنت
        </a>

        <a href="ranking.html">
            رنکینگ
        </a>

        <a href="friends.html">
            دوستان
        </a>

        <a href="squad.html">
            Squad
        </a>

    </nav>

</header>


<main class="container">


<div id="errorBox" class="error"></div>

<div id="successBox" class="success"></div>


<div class="title">

    <h1>
        🏆
        <span>Tournaments</span>
    </h1>

    <p>
        تورنومنت موردنظر خودت را انتخاب کن.
    </p>

</div>


<div
id="tournaments"
class="tournaments"
>

</div>


<section class="slot-section">

    <h2>
        🎟️ Slots
    </h2>

    <div id="slotsContainer">

        <div class="empty">
            ابتدا یک تورنومنت انتخاب کن.
        </div>

    </div>

</section>


<section class="my-section">

    <h2>
        🏆 My Tournaments
    </h2>

    <div id="myTournaments">

        <div class="empty">
            هنوز ثبت‌نامی نداری.
        </div>

    </div>

</section>


</main>


<script type="module">

import {
    createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
"https://oisqrkqwbskvqkparmiw.supabase.co";


const SUPABASE_KEY =
"sb_publishable_FGoXFElayJeRdyFxyc61hQ_c5CUn5HL";


const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


let currentUser = null;

let tournaments = [];



/* =====================================================
HELPERS
===================================================== */

function escapeHTML(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}



function showError(message){

    const box =
    document.getElementById(
        "errorBox"
    );

    box.textContent =
    message;

    box.style.display =
    "block";


    setTimeout(()=>{

        box.style.display =
        "none";

    },5000);
}



function showSuccess(message){

    const box =
    document.getElementById(
        "successBox"
    );

    box.textContent =
    message;

    box.style.display =
    "block";


    setTimeout(()=>{

        box.style.display =
        "none";

    },5000);
}



/* =====================================================
AUTH
===================================================== */

async function checkUser(){

    const {
        data:{user}
    } =
    await supabase.auth.getUser();


    if(!user){

        window.location.href =
        "login.html";

        return false;

    }


    currentUser =
    user;


    return true;
}



/* =====================================================
LOAD TOURNAMENTS
===================================================== */

async function loadTournaments(){

    const {
        data,
        error
    } =
    await supabase
    .from("tournaments")
    .select("*")
    .order(
        "created_at",
        {
            ascending:false
        }
    );


    if(error){

        console.error(error);

        showError(
            "خطا در دریافت تورنومنت‌ها."
        );

        return;

    }


    tournaments =
    data || [];


    const container =
    document.getElementById(
        "tournaments"
    );


    container.innerHTML =
    "";


    if(!tournaments.length){

        container.innerHTML = `
            <div class="empty">
                هنوز تورنومنتی ساخته نشده.
            </div>
        `;

        return;

    }


    tournaments.forEach(tournament=>{

        const card =
        document.createElement(
            "div"
        );

        card.className =
        "tournament";


        const date =
        tournament.start_time
        ?
        new Date(
            tournament.start_time
        ).toLocaleString(
            "fa-IR"
        )
        :
        "تعیین نشده";


        const type =
        tournament.type
        || "Solo";


        const status =
        tournament.status
        || "open";


        const isOpen =
        status === "open";


        card.innerHTML = `

            <h2>
                ${escapeHTML(
                    tournament.title
                )}
            </h2>

            <div class="info">

                <div>
                    🎮 بازی:
                    <strong>
                        ${escapeHTML(
                            tournament.game
                        )}
                    </strong>
                </div>

                <div>
                    👥 نوع:
                    <span class="badge">
                        ${escapeHTML(type)}
                    </span>
                </div>

                <div>
                    🎟️ تعداد Slot:
                    <strong>
                        ${tournament.max_players}
                    </strong>
                </div>

                <div>
                    🕐 زمان:
                    <strong>
                        ${escapeHTML(date)}
                    </strong>
                </div>

                <div>
                    وضعیت:
                    <strong>
                        ${escapeHTML(status)}
                    </strong>
                </div>

            </div>


            <button
                class="register-btn"
                data-id="${tournament.id}"
                ${!isOpen ? "disabled" : ""}
            >

                ${
                    isOpen
                    ? "ثبت‌نام در تورنومنت"
                    : "ثبت‌نام بسته است"
                }

            </button>

        `;


        container.appendChild(card);

    });


    document
    .querySelectorAll(
        ".register-btn"
    )
    .forEach(button=>{

        button.addEventListener(
            "click",
            ()=>{

                registerTournament(
                    button.dataset.id
                );

            }
        );

    });

}



/* =====================================================
REGISTER
===================================================== */

async function registerTournament(
    tournamentId
){

    const tournament =
    tournaments.find(
        t =>
        t.id === tournamentId
    );


    if(!tournament){

        return;

    }


    let squadId = null;


    /*
    SOLO
    */

    if(
        tournament.type
        .toLowerCase()
        ===
        "solo"
    ){

        squadId = null;

    }


    /*
    DUO / SQUAD
    */

    else{

        const {
            data,
            error
        } =
        await supabase
        .from("squads")
        .select(
            "id,player1_id,player2_id,player3_id,player4_id,status"
        )
        .eq(
            "status",
            "accepted"
        );


        if(error){

            console.error(error);

            showError(
                "خطا در دریافت تیم."
            );

            return;

        }


        const mySquad =
        (data || []).find(
            squad => {

                return (

                    squad.player1_id
                    ===
                    currentUser.id

                    ||

                    squad.player2_id
                    ===
                    currentUser.id

                    ||

                    squad.player3_id
                    ===
                    currentUser.id

                    ||

                    squad.player4_id
                    ===
                    currentUser.id

                );

            }
        );


        if(!mySquad){

            showError(
                tournament.type.toLowerCase()
                ===
                "duo"
                ?
                "ابتدا یک Duo بساز و عضو تیمت شو."
                :
                "ابتدا یک Squad چهار نفره بساز."
            );

            return;

        }


        if(
            tournament.type.toLowerCase()
            ===
            "squad"
        ){

            if(
                !mySquad.player1_id ||
                !mySquad.player2_id ||
                !mySquad.player3_id ||
                !mySquad.player4_id
            ){

                showError(
                    "Squad باید ۴ بازیکن داشته باشد."
                );

                return;

            }

        }


        if(
            tournament.type.toLowerCase()
            ===
            "duo"
        ){

            if(
                !mySquad.player1_id ||
                !mySquad.player2_id
            ){

                showError(
                    "Duo باید ۲ بازیکن داشته باشد."
                );

                return;

            }

        }


        squadId =
        mySquad.id;

    }


    const {
        error
    } =
    await supabase.rpc(
        "register_for_tournament",
        {
            p_tournament_id:
            tournamentId,

            p_squad_id:
            squadId
        }
    );


    if(error){

        console.error(error);

        showError(
            error.message
        );

        return;

    }


    showSuccess(
        "با موفقیت در تورنومنت ثبت‌نام شدی ✅"
    );


    await loadSlots(
        tournamentId
    );


    await loadMyTournaments();

}



/* =====================================================
LOAD SLOTS
===================================================== */

async function loadSlots(
    tournamentId
){

    const tournament =
    tournaments.find(
        t =>
        t.id === tournamentId
    );


    if(!tournament){

        return;

    }


    const {
        data,
        error
    } =
    await supabase
    .from(
        "tournament_registrations"
    )
    .select(`
        id,
        slot,
        type,
        player1_id,
        player2_id,
        player3_id,
        player4_id
    `)
    .eq(
        "tournament_id",
        tournamentId
    )
    .order(
        "slot",
        {
            ascending:true
        }
    );


    if(error){

        console.error(error);

        showError(
            "خطا در دریافت Slotها."
        );

        return;

    }


    const registrations =
    data || [];


    /*
    GET ALL USER IDS
    */

    const ids = [];


    registrations.forEach(
        registration=>{

            [
                registration.player1_id,
                registration.player2_id,
                registration.player3_id,
                registration.player4_id

            ].forEach(id=>{

                if(
                    id &&
                    !ids.includes(id)
                ){

                    ids.push(id);

                }

            });

        }
    );


    /*
    GET USERNAMES
    */

    let profiles = [];


    if(ids.length){

        const result =
        await supabase
        .from("profiles")
        .select(
            "id,username"
        )
        .in(
            "id",
            ids
        );


        if(result.error){

            console.error(
                result.error
            );

        }else{

            profiles =
            result.data || [];

        }

    }


    function username(id){

        const profile =
        profiles.find(
            p =>
            p.id === id
        );


        return profile
        ? profile.username
        : "Player";

    }


    const map =
    new Map();


    registrations.forEach(
        registration=>{

            map.set(
                registration.slot,
                registration
            );

        }
    );


    const container =
    document.getElementById(
        "slotsContainer"
    );


    container.innerHTML =
    "";


    const slots =
    document.createElement(
        "div"
    );


    slots.className =
    "slots";


    for(
        let i=1;
        i<=tournament.max_players;
        i++
    ){

        const registration =
        map.get(i);


        const slot =
        document.createElement(
            "div"
        );


        slot.className =
        "slot";


        if(registration){

            slot.classList.add(
                "full"
            );


            let players = [];


            if(
                registration.player1_id
            ){

                players.push(
                    username(
                        registration.player1_id
                    )
                );

            }


            if(
                registration.player2_id
            ){

                players.push(
                    username(
                        registration.player2_id
                    )
                );

            }


            if(
                registration.player3_id
            ){

                players.push(
                    username(
                        registration.player3_id
                    )
                );

            }


            if(
                registration.player4_id
            ){

                players.push(
                    username(
                        registration.player4_id
                    )
                );

            }


            slot.innerHTML = `

                <div class="slot-number">
                    SLOT ${i}
                </div>

                ${
                    players
                    .map(
                        name =>
                        `<div class="player">
                            👤 ${escapeHTML(name)}
                        </div>`
                    )
                    .join("")
                }

            `;

        }else{

            slot.innerHTML = `

                <div class="slot-number">
                    SLOT ${i}
                </div>

                <div class="empty">
                    🔓 خالی
                </div>

            `;

        }


        slots.appendChild(
            slot
        );

    }


    const title =
    document.createElement(
        "h3"
    );


    title.className =
    "slot-title";


    title.textContent =
    `${tournament.title} — ${tournament.type}`;


    container.appendChild(
        title
    );


    container.appendChild(
        slots
    );

}



/* =====================================================
MY TOURNAMENTS
===================================================== */

async function loadMyTournaments(){

    const {
        data,
        error
    } =
    await supabase
    .from(
        "tournament_registrations"
    )
    .select(`
        slot,
        type,
        tournament_id,
        tournaments(
            title,
            game,
            type,
            start_time
        )
    `)
    .or(
        `player1_id.eq.${currentUser.id},player2_id.eq.${currentUser.id},player3_id.eq.${currentUser.id},player4_id.eq.${currentUser.id}`
    )
    .order(
        "slot",
        {
            ascending:true
        }
    );


    if(error){

        console.error(error);

        return;

    }


    const container =
    document.getElementById(
        "myTournaments"
    );


    container.innerHTML =
    "";


    if(
        !data ||
        !data.length
    ){

        container.innerHTML = `
            <div class="empty">
                هنوز ثبت‌نامی نداری.
            </div>
        `;

        return;

    }


    data.forEach(item=>{

        const tournament =
        item.tournaments;


        const card =
        document.createElement(
            "div"
        );


        card.className =
        "my-card";


        card.innerHTML = `

            <h3>
                ${escapeHTML(
                    tournament?.title || "-"
                )}
            </h3>

            <div>
                🎮
                ${escapeHTML(
                    tournament?.game || "-"
                )}
            </div>

            <div>
                👥
                ${escapeHTML(
                    item.type || "-"
                )}
            </div>

            <div>
                🎟️
                Slot ${item.slot}
            </div>

        `;


        container.appendChild(
            card
        );

    });

}



/* =====================================================
START
===================================================== */

async function start(){

    const loggedIn =
    await checkUser();


    if(!loggedIn){

        return;

    }


    await loadTournaments();

    await loadMyTournaments();

}


start();

</script>

</body>
</html>
