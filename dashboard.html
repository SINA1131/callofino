<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CALLAFINO | Dashboard</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Tahoma,sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    color:#fff;
    overflow-x:hidden;
    background:#030604;
    position:relative;
}

/* =========================================================
   ANIMATED BACKGROUND
========================================================= */

body::before{
    content:"";
    position:fixed;
    width:650px;
    height:650px;
    top:-280px;
    left:-180px;
    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(57,255,114,.13),
            rgba(57,255,114,.035) 35%,
            transparent 70%
        );

    filter:blur(10px);
    animation:floatingLight 12s ease-in-out infinite alternate;
    pointer-events:none;
    z-index:-3;
}

body::after{
    content:"";
    position:fixed;
    width:600px;
    height:600px;
    bottom:-300px;
    right:-180px;
    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(0,255,120,.11),
            rgba(0,255,120,.025) 40%,
            transparent 70%
        );

    filter:blur(15px);
    animation:floatingLight2 15s ease-in-out infinite alternate;
    pointer-events:none;
    z-index:-3;
}

@keyframes floatingLight{

    0%{
        transform:translate(0,0) scale(1);
    }

    50%{
        transform:translate(150px,100px) scale(1.12);
    }

    100%{
        transform:translate(280px,30px) scale(.95);
    }

}

@keyframes floatingLight2{

    0%{
        transform:translate(0,0) scale(1);
    }

    50%{
        transform:translate(-120px,-90px) scale(1.12);
    }

    100%{
        transform:translate(-220px,-30px) scale(.96);
    }

}

/* =========================================================
   MOVING GRID
========================================================= */

body{

    background-image:

        linear-gradient(
            rgba(57,255,114,.025) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(57,255,114,.025) 1px,
            transparent 1px
        ),

        radial-gradient(
            circle at 50% 20%,
            rgba(57,255,114,.035),
            transparent 35%
        ),

        #030604;

    background-size:
        55px 55px,
        55px 55px,
        auto,
        auto;

    animation:gridMove 20s linear infinite;
}

@keyframes gridMove{

    from{
        background-position:
            0 0,
            0 0,
            center,
            center;
    }

    to{
        background-position:
            55px 55px,
            55px 55px,
            center,
            center;
    }

}

/* =========================================================
   NAVBAR
========================================================= */

.navbar{

    height:72px;

    padding:0 6%;

    display:flex;

    align-items:center;

    justify-content:space-between;

    background:
        rgba(3,7,4,.78);

    border-bottom:
        1px solid rgba(57,255,114,.14);

    backdrop-filter:blur(20px);

    position:sticky;

    top:0;

    z-index:1000;

    box-shadow:
        0 10px 40px rgba(0,0,0,.25);
}

.logo{

    text-decoration:none;

    color:#39ff72;

    font-size:26px;

    font-weight:900;

    letter-spacing:3px;

    text-shadow:
        0 0 12px rgba(57,255,114,.45),
        0 0 30px rgba(57,255,114,.12);

    transition:.3s;
}

.logo:hover{

    transform:scale(1.04);

    text-shadow:
        0 0 15px rgba(57,255,114,.7),
        0 0 35px rgba(57,255,114,.25);
}

.nav-links{

    display:flex;

    align-items:center;

    gap:5px;
}

.nav-links a{

    text-decoration:none;

    color:#858b86;

    padding:10px 13px;

    border-radius:9px;

    font-size:13px;

    transition:.3s;

    position:relative;
}

.nav-links a::after{

    content:"";

    position:absolute;

    bottom:4px;

    right:50%;

    width:0;

    height:2px;

    background:#39ff72;

    box-shadow:
        0 0 10px rgba(57,255,114,.7);

    transition:.3s;

    transform:translateX(50%);
}

.nav-links a:hover{

    color:#39ff72;

    background:
        rgba(57,255,114,.07);

    transform:translateY(-2px);
}

.nav-links a:hover::after{

    width:45%;
}

.logout{

    color:#ff6262 !important;

    border:
        1px solid rgba(255,70,70,.25);
}

.logout::after{

    display:none;
}

.logout:hover{

    background:
        rgba(255,60,60,.08) !important;

    border-color:#ff5555;

    color:#ff7777 !important;
}

/* =========================================================
   MAIN
========================================================= */

.container{

    width:88%;

    max-width:1250px;

    margin:auto;
}

/* =========================================================
   WELCOME
========================================================= */

.welcome{

    padding:55px 0 28px;

    animation:
        fadeDown .8s ease both;
}

@keyframes fadeDown{

    from{
        opacity:0;
        transform:translateY(-25px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.welcome h1{

    font-size:36px;

    font-weight:900;

    margin-bottom:12px;
}

.welcome h1 span{

    color:#39ff72;

    text-shadow:
        0 0 14px rgba(57,255,114,.4),
        0 0 30px rgba(57,255,114,.12);

    animation:
        textGlow 3s ease-in-out infinite alternate;
}

@keyframes textGlow{

    from{
        text-shadow:
            0 0 10px rgba(57,255,114,.3);
    }

    to{
        text-shadow:
            0 0 20px rgba(57,255,114,.65),
            0 0 40px rgba(57,255,114,.15);
    }

}

.welcome p{

    color:#707670;

    font-size:14px;
}

/* =========================================================
   PROFILE
========================================================= */

.profile{

    position:relative;

    overflow:hidden;

    display:flex;

    align-items:center;

    gap:24px;

    padding:30px;

    margin-bottom:24px;

    border-radius:22px;

    background:
        linear-gradient(
            135deg,
            rgba(14,31,18,.96),
            rgba(5,10,6,.98)
        );

    border:
        1px solid rgba(57,255,114,.2);

    box-shadow:
        0 20px 60px rgba(0,0,0,.4),
        0 0 35px rgba(57,255,114,.025);

    animation:
        fadeUp .8s ease .15s both;

    transition:.35s;
}

.profile:hover{

    border-color:
        rgba(57,255,114,.38);

    box-shadow:
        0 20px 60px rgba(0,0,0,.45),
        0 0 40px rgba(57,255,114,.06);
}

.profile::before{

    content:"";

    position:absolute;

    width:180px;
    height:180px;

    right:-80px;
    top:-100px;

    border-radius:50%;

    background:#39ff72;

    opacity:.035;

    animation:
        profileGlow 5s ease-in-out infinite alternate;
}

.profile::after{

    content:"";

    position:absolute;

    width:220px;
    height:220px;

    left:-100px;
    top:-110px;

    border-radius:50%;

    background:#39ff72;

    opacity:.035;
}

@keyframes profileGlow{

    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(-50px,50px);
    }

}

.avatar{

    width:82px;
    height:82px;

    flex-shrink:0;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:38px;

    border-radius:20px;

    background:#071009;

    border:
        1px solid rgba(57,255,114,.55);

    box-shadow:
        0 0 25px rgba(57,255,114,.08);

    animation:
        avatarPulse 3s ease-in-out infinite;

    position:relative;

    z-index:2;
}

@keyframes avatarPulse{

    0%,100%{
        box-shadow:
            0 0 20px rgba(57,255,114,.06);
    }

    50%{
        box-shadow:
            0 0 35px rgba(57,255,114,.18);
    }

}

.profile-info{

    position:relative;

    z-index:2;
}

.profile-info h2{

    font-size:23px;

    margin-bottom:7px;
}

.profile-info p{

    color:#6e756f;

    font-size:13px;
}

/* =========================================================
   PANELS
========================================================= */

.panel{

    padding:30px;

    margin-bottom:30px;

    border-radius:20px;

    background:
        linear-gradient(
            145deg,
            rgba(9,18,11,.98),
            rgba(4,8,5,.98)
        );

    border:
        1px solid rgba(57,255,114,.16);

    box-shadow:
        0 15px 45px rgba(0,0,0,.3);

    animation:
        fadeUp .8s ease .3s both;

    transition:.35s;
}

.panel:hover{

    border-color:
        rgba(57,255,114,.27);

    box-shadow:
        0 18px 50px rgba(0,0,0,.4),
        0 0 30px rgba(57,255,114,.025);
}

@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.panel-title{

    font-size:21px;

    margin-bottom:8px;
}

.panel-subtitle{

    color:#696f6b;

    font-size:13px;

    margin-bottom:25px;
}

/* =========================================================
   FORM
========================================================= */

.form-group{

    margin-bottom:20px;
}

.form-group label{

    display:block;

    color:#e0e0e0;

    font-size:14px;

    font-weight:bold;

    margin-bottom:10px;
}

.form-group input{

    width:100%;

    padding:15px 17px;

    background:#020502;

    color:#fff;

    border:
        1px solid #26352a;

    border-radius:11px;

    outline:none;

    font-size:14px;

    transition:.3s;
}

.form-group input::placeholder{

    color:#505650;
}

.form-group input:focus{

    border-color:#39ff72;

    box-shadow:
        0 0 0 3px
        rgba(57,255,114,.04),

        0 0 25px
        rgba(57,255,114,.1);

    transform:translateY(-1px);
}

.help{

    color:#747a75;

    font-size:12px;

    margin-top:9px;
}

/* =========================================================
   SAVE BUTTON
========================================================= */

.save-btn{

    width:100%;

    padding:15px;

    border:0;

    border-radius:11px;

    background:#39ff72;

    color:#031007;

    font-size:14px;

    font-weight:900;

    cursor:pointer;

    transition:.3s;

    position:relative;

    overflow:hidden;
}

.save-btn::before{

    content:"";

    position:absolute;

    top:0;

    left:-120%;

    width:70%;

    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.35),
            transparent
        );

    transform:skewX(-20deg);

    transition:.6s;
}

.save-btn:hover::before{

    left:140%;
}

.save-btn:hover{

    background:#65ff91;

    transform:translateY(-2px);

    box-shadow:
        0 10px 30px
        rgba(57,255,114,.16);
}

.save-btn:active{

    transform:translateY(0);
}

.save-btn:disabled{

    opacity:.55;

    cursor:not-allowed;

    transform:none;
}

/* =========================================================
   STATUS
========================================================= */

.status{

    display:none;

    margin-top:15px;

    padding:12px;

    border-radius:10px;

    background:#08140b;

    font-size:13px;

    text-align:center;

    animation:
        statusAppear .35s ease both;
}

@keyframes statusAppear{

    from{
        opacity:0;
        transform:translateY(-5px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.success{

    color:#39ff72;
}

.error{

    color:#ff5d5d;
}

/* =========================================================
   CARDS
========================================================= */

.cards{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:18px;

    margin-bottom:45px;
}

.card{

    position:relative;

    overflow:hidden;

    min-height:165px;

    padding:25px;

    color:#fff;

    text-decoration:none;

    background:
        linear-gradient(
            145deg,
            rgba(9,18,11,.98),
            rgba(4,8,5,.98)
        );

    border:
        1px solid rgba(57,255,114,.12);

    border-radius:18px;

    transition:
        transform .35s,
        border-color .35s,
        box-shadow .35s;

    animation:
        cardAppear .7s ease both;
}

.card:nth-child(1){animation-delay:.35s;}
.card:nth-child(2){animation-delay:.42s;}
.card:nth-child(3){animation-delay:.49s;}
.card:nth-child(4){animation-delay:.56s;}
.card:nth-child(5){animation-delay:.63s;}
.card:nth-child(6){animation-delay:.70s;}
.card:nth-child(7){animation-delay:.77s;}
.card:nth-child(8){animation-delay:.84s;}

@keyframes cardAppear{

    from{
        opacity:0;
        transform:translateY(35px) scale(.97);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }

}

.card::before{

    content:"";

    position:absolute;

    width:140px;
    height:140px;

    right:-70px;
    bottom:-80px;

    border-radius:50%;

    background:#39ff72;

    opacity:.025;

    transition:.4s;
}

.card:hover::before{

    transform:
        scale(1.8)
        translate(-15px,-15px);

    opacity:.06;
}

.card:hover{

    transform:
        translateY(-7px)
        scale(1.01);

    border-color:
        rgba(57,255,114,.45);

    box-shadow:
        0 15px 40px rgba(0,0,0,.35),
        0 0 25px rgba(57,255,114,.06);
}

.card-icon{

    font-size:31px;

    margin-bottom:16px;

    transition:.35s;
}

.card:hover .card-icon{

    transform:
        scale(1.12)
        rotate(-4deg);

    filter:
        drop-shadow(
            0 0 8px
            rgba(57,255,114,.18)
        );
}

.card h3{

    font-size:17px;

    margin-bottom:8px;
}

.card p{

    color:#707770;

    font-size:12px;

    line-height:1.8;
}

/* =========================================================
   WALLET CARD
========================================================= */

.wallet-card{

    cursor:pointer;

    border-color:
        rgba(57,255,114,.22);
}

.wallet-balance{

    color:#39ff72;

    font-size:18px;

    font-weight:900;

    margin-top:12px;

    text-shadow:
        0 0 12px rgba(57,255,114,.25);
}

/* =========================================================
   WALLET MODAL
========================================================= */

.wallet-overlay{

    position:fixed;

    inset:0;

    display:none;

    align-items:center;

    justify-content:center;

    padding:20px;

    background:
        rgba(0,0,0,.72);

    backdrop-filter:blur(10px);

    z-index:5000;

    animation:walletFade .25s ease;
}

.wallet-overlay.active{

    display:flex;
}

@keyframes walletFade{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }

}

.wallet-modal{

    width:100%;

    max-width:470px;

    padding:30px;

    border-radius:22px;

    background:
        linear-gradient(
            145deg,
            #0b160d,
            #030704
        );

    border:
        1px solid rgba(57,255,114,.3);

    box-shadow:
        0 25px 80px rgba(0,0,0,.6),
        0 0 45px rgba(57,255,114,.06);

    position:relative;

    animation:
        walletModalIn .35s ease;
}

@keyframes walletModalIn{

    from{
        opacity:0;
        transform:translateY(25px) scale(.96);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }

}

.wallet-close{

    position:absolute;

    top:14px;

    left:14px;

    width:35px;

    height:35px;

    border-radius:9px;

    border:1px solid #29352c;

    background:#080d09;

    color:#aaa;

    cursor:pointer;

    font-size:17px;

    transition:.25s;
}

.wallet-close:hover{

    color:#ff6262;

    border-color:#ff6262;

}

.wallet-title{

    text-align:center;

    font-size:24px;

    margin-bottom:7px;

}

.wallet-description{

    text-align:center;

    color:#6d756e;

    font-size:12px;

    margin-bottom:25px;
}

.wallet-balance-box{

    padding:22px;

    border-radius:15px;

    background:
        rgba(57,255,114,.045);

    border:
        1px solid rgba(57,255,114,.15);

    text-align:center;

    margin-bottom:18px;
}

.wallet-balance-label{

    color:#777f79;

    font-size:12px;

    margin-bottom:8px;
}

.wallet-balance-value{

    color:#39ff72;

    font-size:27px;

    font-weight:900;

    text-shadow:
        0 0 18px rgba(57,255,114,.25);
}

.wallet-info{

    display:grid;

    gap:12px;
}

.wallet-info-box{

    padding:15px;

    border-radius:12px;

    background:#070c08;

    border:1px solid #1d2920;
}

.wallet-info-label{

    display:block;

    color:#666e68;

    font-size:11px;

    margin-bottom:7px;
}

.wallet-info-value{

    color:#fff;

    font-size:15px;

    font-weight:bold;

    direction:ltr;

    text-align:left;

    word-break:break-all;
}

.wallet-note{

    margin-top:18px;

    color:#626a64;

    font-size:11px;

    line-height:1.9;

    text-align:center;
}

/* =========================================================
   RANKING COMING SOON
========================================================= */

.ranking-disabled{

    cursor:not-allowed;

    opacity:.78;
}

.ranking-disabled:hover{

    transform:none;

    border-color:
        rgba(57,255,114,.12);

    box-shadow:none;
}

.ranking-disabled:hover .card-icon{

    transform:none;

    filter:none;
}

.coming-soon{

    display:inline-block;

    margin-top:12px;

    padding:5px 10px;

    border-radius:8px;

    color:#39ff72;

    background:
        rgba(57,255,114,.07);

    border:
        1px solid rgba(57,255,114,.18);

    font-size:11px;

    font-weight:bold;

    animation:
        comingPulse 2.5s ease-in-out infinite;
}

@keyframes comingPulse{

    0%,100%{
        box-shadow:
            0 0 0 rgba(57,255,114,0);
    }

    50%{
        box-shadow:
            0 0 15px rgba(57,255,114,.08);
    }

}

/* =========================================================
   ADMIN
========================================================= */

.admin-card{

    display:none;

    border-color:
        rgba(57,255,114,.35);

    background:
        linear-gradient(
            135deg,
            rgba(15,42,22,.98),
            rgba(5,10,6,.98)
        );
}

.admin-card:hover{

    border-color:#39ff72;
}

/* =========================================================
   FOOTER
========================================================= */

footer{

    padding:35px 20px;

    text-align:center;

    color:#414741;

    font-size:11px;

    border-top:
        1px solid rgba(255,255,255,.03);

    animation:
        fadeUp .8s ease .8s both;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:900px){

    .navbar{

        height:auto;

        padding:15px 4%;

        flex-direction:column;

        gap:14px;
    }

    .nav-links{

        flex-wrap:wrap;

        justify-content:center;
    }

    .cards{

        grid-template-columns:
            repeat(2,1fr);
    }

}

@media(max-width:600px){

    .container{

        width:92%;
    }

    .welcome{

        padding-top:35px;
    }

    .welcome h1{

        font-size:27px;
    }

    .profile{

        padding:22px;
    }

    .avatar{

        width:65px;

        height:65px;

        font-size:29px;
    }

    .profile-info h2{

        font-size:18px;
    }

    .panel{

        padding:22px;
    }

    .cards{

        grid-template-columns:1fr;
    }

}

/* =========================================================
   REDUCE MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{

        animation-duration:.01ms !important;

        animation-iteration-count:1 !important;

        scroll-behavior:auto !important;

        transition-duration:.01ms !important;
    }

}

</style>

</head>
