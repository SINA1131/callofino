<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CALLAFINO | Dashboard</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    background:#080808;
    color:#fff;
    min-height:100vh;
}

header{
    height:70px;
    background:#101010;
    border-bottom:1px solid #242424;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
}

.logo{
    color:#d4af37;
    font-size:25px;
    font-weight:bold;
}

nav{
    display:flex;
    align-items:center;
    gap:10px;
}

nav a,
.logout{
    text-decoration:none;
    color:#ccc;
    padding:10px 15px;
    border-radius:8px;
    transition:.2s;
    cursor:pointer;
}

nav a:hover,
.logout:hover{
    background:#1c1c1c;
    color:#d4af37;
}

.admin-link{
    display:none;
    border:1px solid #d4af37;
    color:#d4af37 !important;
}

.container{
    width:90%;
    max-width:1200px;
    margin:40px auto;
}

.welcome{
    background:linear-gradient(135deg,#151515,#0d0d0d);
    border:1px solid #292929;
    border-radius:18px;
    padding:35px;
    margin-bottom:25px;
}

.welcome h1{
    font-size:32px;
    margin-bottom:10px;
}

.welcome h1 span{
    color:#d4af37;
}

.welcome p{
    color:#999;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.card{
    background:#111;
    border:1px solid #242424;
    border-radius:16px;
    padding:25px;
    text-decoration:none;
    color:white;
    transition:.25s;
}

.card:hover{
    transform:translateY(-4px);
    border-color:#d4af37;
}

.card h2{
    color:#d4af37;
    margin-bottom:10px;
}

.card p{
    color:#999;
}

#loading{
    text-align:center;
    color:#999;
    margin-top:40px;
}

#error{
    display:none;
    background:#351010;
    border:1px solid #8b2929;
    color:#ff8585;
    padding:15px;
    border-radius:10px;
    margin-bottom:20px;
}

@media(max-width:800px){
    header{
        height:auto;
        padding:20px;
        flex-direction:column;
        gap:15px;
    }

    nav{
        flex-wrap:wrap;
        justify-content:center;
    }

    .welcome h1{
        font-size:25px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        CALLAFINO
    </div>

    <nav>

        <a href="dashboard.html">
            داشبورد
        </a>

        <a href="tournament.html">
            تورنومنت
        </a>

        <a href="ranking.html">
            رنکینگ
        </a>

        <!-- فقط برای ادمین نمایش داده می‌شود -->
        <a
            href="admin.html"
            id="adminPanelLink"
            class="admin-link"
        >
            ⚙️ پنل ادمین
        </a>

        <a
            href="#"
            class="logout"
            id="logoutBtn"
        >
            خروج
        </a>

    </nav>

</header>


<main class="container">

    <div id="error"></div>

    <section class="welcome">

        <h1>
            سلام،
            <span id="username">...</span>
            👋
        </h1>

        <p>
            به داشبورد CALLAFINO خوش آمدی.
        </p>

    </section>


    <section class="cards">

        <a href="tournament.html" class="card">

            <h2>🏆 Tournament</h2>

            <p>
                شرکت در تورنومنت‌ها و مشاهده مسابقات
            </p>

        </a>


        <a href="ranking.html" class="card">

            <h2>🥇 Ranking</h2>

            <p>
                مشاهده رتبه‌بندی بازیکنان
            </p>

        </a>


        <a href="friends.html" class="card">

            <h2>👥 Friends</h2>

            <p>
                مدیریت دوستان و درخواست‌ها
            </p>

        </a>


        <a href="squad.html" class="card">

            <h2>⚔️ Squad</h2>

            <p>
                ساخت و مدیریت Squad
            </p>

        </a>

    </section>

    <div id="loading">
        در حال بارگذاری...
    </div>

</main>


<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
"https://oisqrkqwbskvqkparmiw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_FGoXFElayJeRdyFxyc61hQ_c5CUn5HL";


const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const usernameElement =
document.getElementById("username");

const adminPanelLink =
document.getElementById("adminPanelLink");

const loading =
document.getElementById("loading");

const errorBox =
document.getElementById("error");

const logoutBtn =
document.getElementById("logoutBtn");


async function loadDashboard(){

    try{

        const {
            data: { user },
            error: userError
        } = await supabase.auth.getUser();


        if(userError){
            throw userError;
        }


        if(!user){

            window.location.href =
            "login.html";

            return;
        }


        /*
        -------------------------
        USERNAME
        -------------------------
        */

        const {
            data: profile,
            error: profileError
        } =
        await supabase
        .from("profiles")
        .select("username")
        .eq("id", user.id)
        .maybeSingle();


        if(profileError){
            console.error(profileError);
        }


        if(profile){

            usernameElement.textContent =
            profile.username;

        }else{

            usernameElement.textContent =
            user.email?.split("@")[0] || "Player";

        }


        /*
        -------------------------
        ADMIN CHECK
        -------------------------
        */

        const {
            data: admin,
            error: adminError
        } =
        await supabase
        .from("admins")
        .select("user_id")
        .eq("user_id", user.id)
        .maybeSingle();


        if(adminError){

            console.error(
                "Admin check error:",
                adminError
            );

        }


        /*
        اگر کاربر در admins باشد،
        لینک پنل ادمین نمایش داده می‌شود.
        */

        if(admin){

            adminPanelLink.style.display =
            "inline-block";

        }else{

            adminPanelLink.style.display =
            "none";

        }


        loading.style.display =
        "none";

    }catch(error){

        console.error(error);

        errorBox.textContent =
        "خطا در بارگذاری اطلاعات.";

        errorBox.style.display =
        "block";

        loading.style.display =
        "none";
    }
}


/*
-------------------------
LOGOUT
-------------------------
*/

logoutBtn.addEventListener(
    "click",
    async function(e){

        e.preventDefault();

        await supabase.auth.signOut();

        window.location.href =
        "login.html";
    }
);


loadDashboard();

</script>

</body>
</html>
