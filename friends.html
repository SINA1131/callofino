    margin:0;

<script type="module">

import {
    createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://oisqrkqwbskvqkparmiw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_FGoXFElayJeRdyFxyc61hQ_c5CUn5HL";

const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   GLOBAL USER
========================= */

let currentUser = null;


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   TOAST
========================= */

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent =
        message;

    toast.classList.add("show");

    setTimeout(() => {

        toast.classList.remove("show");

    },3000);

}


/* =========================
   LOAD USER
========================= */

async function loadUser(){

    const {
        data,
        error
    } =
    await supabase.auth.getUser();


    if(error || !data.user){

        window.location.href =
            "login.html";

        return;

    }


    currentUser =
        data.user;


    await Promise.all([

        loadFriends(),

        loadRequests()

    ]);

}


/* =========================
   LOAD FRIENDS
========================= */

async function loadFriends(){

    const box =
        document.getElementById("friends");


    if(!currentUser){

        return;

    }


    const {
        data: friendships,
        error: friendshipError
    } =
    await supabase
        .from("friendships")
        .select(
            "user_id, friend_id"
        )
        .or(
            `user_id.eq.${currentUser.id},friend_id.eq.${currentUser.id}`
        );


    if(friendshipError){

        console.error(
            "Friendship error:",
            friendshipError
        );

        box.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ⚠️
                </div>

                خطا در دریافت دوستان.

            </div>

        `;

        return;

    }


    if(
        !friendships ||
        friendships.length === 0
    ){

        document.getElementById(
            "friendCount"
        ).textContent = "0";


        box.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    👥
                </div>

                هنوز دوستی نداری.

            </div>

        `;

        return;

    }


    const friendIds = [];


    friendships.forEach(
        friendship => {

            let friendId;


            if(
                friendship.user_id ===
                currentUser.id
            ){

                friendId =
                    friendship.friend_id;

            }else{

                friendId =
                    friendship.user_id;

            }


            if(
                friendId &&
                friendId !== currentUser.id
            ){

                friendIds.push(
                    friendId
                );

            }

        }
    );


    const uniqueFriendIds =
        [
            ...new Set(friendIds)
        ];


    if(!uniqueFriendIds.length){

        document.getElementById(
            "friendCount"
        ).textContent = "0";

        box.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    👥
                </div>

                هنوز دوستی نداری.

            </div>

        `;

        return;

    }


    const {
        data: profiles,
        error: profileError
    } =
    await supabase
        .from("profiles")
        .select(
            "id, username"
        )
        .in(
            "id",
            uniqueFriendIds
        );


    if(profileError){

        console.error(
            "Profile error:",
            profileError
        );

        return;

    }


    const profileMap =
        new Map(
            (profiles || []).map(
                profile => [
                    profile.id,
                    profile.username
                ]
            )
        );


    box.innerHTML = "";

    document.getElementById(
        "friendCount"
    ).textContent =
        uniqueFriendIds.length;


    uniqueFriendIds.forEach(
        (friendId,index) => {

            const username =
                profileMap.get(friendId);


            const div =
                document.createElement("div");


            div.className =
                "friend";


            div.style.animationDelay =
                `${index * 0.06}s`;


            div.innerHTML = `

                <div class="friend-avatar">
                    🎮
                </div>

                <div class="username">

                    ${escapeHTML(
                        username ||
                        "نام کاربر پیدا نشد"
                    )}

                </div>

                <div class="friend-status">

                    <span class="status-dot"></span>

                    FRIEND

                </div>

            `;


            box.appendChild(div);

        }
    );

}


/* =========================
   SEARCH USER
========================= */

async function searchUser(){

    const input =
        document.getElementById(
            "usernameSearch"
        );

    const result =
        document.getElementById(
            "searchResult"
        );


    const username =
        input.value.trim();


    if(!username){

        result.innerHTML = `

            <div class="empty">
                نام کاربری را وارد کنید.
            </div>

        `;

        return;

    }


    if(!currentUser){

        return;

    }


    result.innerHTML = `

        <div class="empty">
            🔎 در حال جستجو...
        </div>

    `;


    const {
        data: users,
        error
    } =
    await supabase
        .from("profiles")
        .select(
            "id, username"
        )
        .ilike(
            "username",
            username
        )
        .limit(10);


    if(error){

        console.error(
            "Search error:",
            error
        );

        result.innerHTML = `

            <div class="empty">
                ⚠️ خطا در جستجوی کاربر.
            </div>

        `;

        return;

    }


    const filteredUsers =
        (users || []).filter(
            user =>
                user.id !==
                currentUser.id
        );


    if(!filteredUsers.length){

        result.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🔍
                </div>

                کاربری با این نام پیدا نشد.

            </div>

        `;

        return;

    }


    result.innerHTML = "";


    for(const user of filteredUsers){

        const card =
            document.createElement("div");

        card.className =
            "user-result";


        card.innerHTML = `

            <div class="user-info">

                <div class="user-avatar">
                    🎮
                </div>

                <div>

                    <div class="user-name">

                        ${escapeHTML(
                            user.username
                        )}

                    </div>

                    <div class="user-id">
                        کاربر CALLAFINO
                    </div>

                </div>

            </div>

            <button
                class="request-btn"
                data-user-id="${user.id}"
            >
                ➕ افزودن دوست
            </button>

        `;


        const button =
            card.querySelector(
                ".request-btn"
            );


        button.addEventListener(
            "click",
            () => sendFriendRequest(
                user.id,
                button
            )
        );


        result.appendChild(card);

    }

}


/* =========================
   SEND FRIEND REQUEST
========================= */

async function sendFriendRequest(
    receiverId,
    button
){

    if(!currentUser){

        return;

    }


    if(
        receiverId ===
        currentUser.id
    ){

        showToast(
            "❌ نمی‌توانی به خودت درخواست بدهی."
        );

        return;

    }


    button.disabled = true;

    button.textContent =
        "در حال بررسی...";


    /* =========================
       CHECK FRIENDSHIP
    ========================= */

    const {
        data: friendships,
        error: friendshipError
    } =
    await supabase
        .from("friendships")
        .select(
            "user_id, friend_id"
        )
        .or(
            `user_id.eq.${currentUser.id},friend_id.eq.${currentUser.id}`
        );


    if(friendshipError){

        console.error(
            friendshipError
        );

        button.disabled = false;
        button.textContent =
            "➕ افزودن دوست";

        showToast(
            "خطا در بررسی دوستی."
        );

        return;

    }


    const alreadyFriend =
        (friendships || []).some(
            friendship =>
                (
                    friendship.user_id ===
                    currentUser.id &&
                    friendship.friend_id ===
                    receiverId
                ) ||
                (
                    friendship.user_id ===
                    receiverId &&
                    friendship.friend_id ===
                    currentUser.id
                )
        );


    if(alreadyFriend){

        button.textContent =
            "✓ دوست شماست";

        showToast(
            "این کاربر قبلاً دوست شماست."
        );

        return;

    }


    /* =========================
       CHECK EXISTING REQUEST
    ========================= */

    const {
        data: existingRequests,
        error: requestCheckError
    } =
    await supabase
        .from("friend_requests")
        .select(
            "id, sender_id, receiver_id, status"
        )
        .or(
            `and(sender_id.eq.${currentUser.id},receiver_id.eq.${receiverId}),and(sender_id.eq.${receiverId},receiver_id.eq.${currentUser.id})`
        )
        .eq(
            "status",
            "pending"
        );


    if(requestCheckError){

        console.error(
            requestCheckError
        );

        button.disabled = false;

        button.textContent =
            "➕ افزودن دوست";

        showToast(
            "خطا در بررسی درخواست."
        );

        return;

    }


    if(
        existingRequests &&
        existingRequests.length > 0
    ){

        const request =
            existingRequests[0];


        if(
            request.sender_id ===
            currentUser.id
        ){

            button.textContent =
                "✓ درخواست ارسال شد";

            showToast(
                "درخواست قبلاً ارسال شده است."
            );

        }else{

            button.textContent =
                "📩 درخواست دارد";

            showToast(
                "این کاربر برای شما درخواست فرستاده است."
            );

        }

        return;

    }


    /* =========================
       INSERT REQUEST
    ========================= */

    const {
        error: insertError
    } =
    await supabase
        .from("friend_requests")
        .insert({

            sender_id:
                currentUser.id,

            receiver_id:
                receiverId,

            status:
                "pending"

        });


    if(insertError){

        console.error(
            "Insert request error:",
            insertError
        );

        button.disabled = false;

        button.textContent =
            "➕ افزودن دوست";

        showToast(
            "❌ ارسال درخواست ناموفق بود."
        );

        return;

    }


    button.textContent =
        "✓ درخواست ارسال شد";


    showToast(
        "✅ درخواست دوستی ارسال شد."
    );

}


/* =========================
   LOAD REQUESTS
========================= */

async function loadRequests(){

    const box =
        document.getElementById(
            "requests"
        );


    const {
        data: requests,
        error
    } =
    await supabase
        .from("friend_requests")
        .select(
            "id, sender_id, receiver_id, status, created_at"
        )
        .eq(
            "receiver_id",
            currentUser.id
        )
        .eq(
            "status",
            "pending"
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(
            "Requests error:",
            error
        );

        document.getElementById(
            "requestCount"
        ).textContent = "0";


        box.innerHTML = `

            <div class="empty">

                ⚠️ خطا در دریافت درخواست‌ها.

            </div>

        `;

        return;

    }


    document.getElementById(
        "requestCount"
    ).textContent =
        requests?.length || 0;


    if(
        !requests ||
        requests.length === 0
    ){

        box.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    📭
                </div>

                درخواست جدیدی نداری.

            </div>

        `;

        return;

    }


    const senderIds =
        [
            ...new Set(
                requests.map(
                    request =>
                        request.sender_id
                )
            )
        ];


    const {
        data: profiles,
        error: profileError
    } =
    await supabase
        .from("profiles")
        .select(
            "id, username"
        )
        .in(
            "id",
            senderIds
        );


    if(profileError){

        console.error(
            profileError
        );

        return;

    }


    const profileMap =
        new Map(
            (profiles || []).map(
                profile => [
                    profile.id,
                    profile.username
                ]
            )
        );


    box.innerHTML = "";


    requests.forEach(
        request => {

            const username =
                profileMap.get(
                    request.sender_id
                ) ||
                "کاربر ناشناس";


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "request-card";


            card.innerHTML = `

                <div class="request-user">

                    <div class="request-avatar">
                        🎮
                    </div>

                    <div>

                        <div class="request-name">

                            ${escapeHTML(
                                username
                            )}

                        </div>

                        <div class="request-text">

                            برای شما درخواست دوستی فرستاده است

                        </div>

                    </div>

                </div>


                <div class="request-actions">

                    <button
                        class="accept-btn"
                        data-id="${request.id}"
                    >
                        ✓ قبول
                    </button>

                    <button
                        class="reject-btn"
                        data-id="${request.id}"
                    >
                        ✕ رد
                    </button>

                </div>

            `;


            card
                .querySelector(".accept-btn")
                .addEventListener(
                    "click",
                    () =>
                        acceptRequest(
                            request,
                            card
                        )
                );


            card
                .querySelector(".reject-btn")
                .addEventListener(
                    "click",
                    () =>
                        rejectRequest(
                            request.id,
                            card
                        )
                );


            box.appendChild(card);

        }
    );

}


/* =========================
   ACCEPT REQUEST
========================= */

async function acceptRequest(
    request,
    card
){

    const acceptButton =
        card.querySelector(
            ".accept-btn"
        );


    acceptButton.disabled =
        true;


    acceptButton.textContent =
        "در حال انجام...";


    /* =========================
       CREATE FRIENDSHIP
    ========================= */

    const {
        error: friendshipError
    } =
    await supabase
        .from("friendships")
        .insert({

            user_id:
                request.sender_id,

            friend_id:
                request.receiver_id

        });


    if(friendshipError){

        console.error(
            "Friendship insert error:",
            friendshipError
        );

        acceptButton.disabled =
            false;

        acceptButton.textContent =
            "✓ قبول";

        showToast(
            "❌ ایجاد دوستی ناموفق بود."
        );

        return;

    }


    /* =========================
       UPDATE REQUEST
    ========================= */

    const {
        error: updateError
    } =
    await supabase
        .from("friend_requests")
        .update({

            status:
                "accepted"

        })
        .eq(
            "id",
            request.id
        );


    if(updateError){

        console.error(
            updateError
        );

        showToast(
            "دوستی ایجاد شد، ولی وضعیت درخواست تغییر نکرد."
        );

        return;

    }


    card.remove();


    await loadRequests();
    await loadFriends();


    showToast(
        "🎉 درخواست قبول شد و کاربر به دوستان اضافه شد."
    );

}


/* =========================
   REJECT REQUEST
========================= */

async function rejectRequest(
    requestId,
    card
){

    const button =
        card.querySelector(
            ".reject-btn"
        );


    button.disabled =
        true;


    button.textContent =
        "در حال انجام...";


    const {
        error
    } =
    await supabase
        .from("friend_requests")
        .update({

            status:
                "rejected"

        })
        .eq(
            "id",
            requestId
        );


    if(error){

        console.error(
            "Reject error:",
            error
        );

        button.disabled =
            false;

        button.textContent =
            "✕ رد";

        showToast(
            "❌ رد درخواست ناموفق بود."
        );

        return;

    }


    card.remove();


    await loadRequests();


    showToast(
        "درخواست رد شد."
    );

}
