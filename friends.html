<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CALLAFINO | Friends</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    min-height:100vh;
    background:#050505;
    color:white;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    background:#ffc107;
    filter:blur(180px);
    opacity:.08;
    top:-220px;
    left:-180px;
    z-index:-1;
}

body::after{
    content:"";
    position:fixed;
    width:450px;
    height:450px;
    background:#b8860b;
    filter:blur(180px);
    opacity:.07;
    bottom:-220px;
    right:-150px;
    z-index:-1;
}

header{
    height:75px;
    padding:0 6%;

    display:flex;
    align-items:center;
    justify-content:space-between;

    position:sticky;
    top:0;
    z-index:10;

    background:rgba(5,5,5,.88);
    border-bottom:1px solid rgba(255,193,7,.15);

    backdrop-filter:blur(15px);
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:2px;
}

.logo span{
    color:#ffc107;
    text-shadow:0 0 15px #ffc107;
}

.back{
    color:#aaa;
    text-decoration:none;
    transition:.3s;
}

.back:hover{
    color:#ffc107;
}

.container{
    width:90%;
    max-width:1050px;
    margin:45px auto;
}

.title{
    margin-bottom:25px;
}

.title small{
    color:#777;
}

.title h1{
    margin-top:8px;
    font-size:38px;
}

.title h1 span{
    color:#ffc107;
}

.box{
    background:rgba(12,12,12,.9);
    border:1px solid #252525;
    border-radius:20px;
    padding:25px;
    margin-bottom:20px;
}

.box h2{
    font-size:20px;
    color:#ffc107;
    margin-bottom:18px;
}

.search{
    display:flex;
    gap:10px;
}

.search input{
    flex:1;

    background:#080808;
    color:white;

    border:1px solid #292929;
    border-radius:10px;

    padding:14px;

    outline:none;
}

.search input:focus{
    border-color:#ffc107;
}

button{
    border:none;
    border-radius:10px;

    padding:12px 18px;

    font-weight:900;
    cursor:pointer;

    transition:.3s;
}

.search button{
    background:#ffc107;
    color:#000;
}

button:hover{
    transform:translateY(-2px);
}

.result,
.friend,
.request{

    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:10px;

    padding:14px;

    background:#090909;

    border:1px solid #202020;

    border-radius:12px;

    margin-top:10px;
}

.username{
    font-weight:bold;
}

.action{
    background:#ffc107;
    color:#000;
    padding:9px 13px;
}

.accept{
    background:#ffc107;
    color:#000;
}

.reject{
    background:#191919;
    color:#aaa;
    border:1px solid #292929;
}

.empty{
    text-align:center;
    color:#666;
    padding:18px;
}

.message{
    text-align:center;
    color:#ffc107;
    min-height:22px;
    margin-top:15px;
}

@media(max-width:600px){

    .search{
        flex-direction:column;
    }

    .search button{
        width:100%;
    }

    .title h1{
        font-size:30px;
    }

    .result,
    .friend,
    .request{
        flex-direction:column;
        align-items:stretch;
        text-align:center;
    }

}

</style>

</head>


<body>


<header>

    <div class="logo">
        CALLAFINO<span>.</span>
    </div>

    <a
        href="dashboard.html"
        class="back"
    >
        ← داشبورد
    </a>

</header>


<main class="container">


    <section class="title">

        <small>
            CALLAFINO GAMING
        </small>

        <h1>
            Friends <span>👥</span>
        </h1>

    </section>


    <!-- SEARCH -->

    <section class="box">

        <h2>
            🔎 پیدا کردن بازیکن
        </h2>

        <div class="search">

            <input
                type="text"
                id="searchInput"
                placeholder="Username را وارد کن..."
            >

            <button
                id="searchBtn"
            >
                SEARCH
            </button>

        </div>

        <div id="searchResults"></div>

    </section>


    <!-- REQUESTS -->

    <section class="box">

        <h2>
            📩 درخواست‌های دوستی
        </h2>

        <div id="requests">

            <div class="empty">
                در حال دریافت...
            </div>

        </div>

    </section>


    <!-- FRIENDS -->

    <section class="box">

        <h2>
            👥 دوستان من
        </h2>

        <div id="friends">

            <div class="empty">
                در حال دریافت...
            </div>

        </div>

    </section>


    <div
        class="message"
        id="message"
    ></div>


</main>


<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
"https://oisqrkqwbskvqkparmiw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_FGoXFElayJeRdyFxyc61hQ_c5CUn5HL";


const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


let currentUser = null;


/* =========================
   USER
========================= */

async function getUser(){

    const {
        data:{
            user
        }
    } =
    await supabase.auth.getUser();


    if(!user){

        window.location.href =
            "login.html";

        return null;

    }


    return user;

}


/* =========================
   MESSAGE
========================= */

function showMessage(text){

    document.getElementById(
        "message"
    ).textContent = text;

}


/* =========================
   SEARCH
========================= */

document
.getElementById("searchBtn")
.addEventListener(
    "click",
    searchUsers
);


document
.getElementById("searchInput")
.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Enter"){
            searchUsers();
        }

    }
);


async function searchUsers(){

    const input =
        document.getElementById(
            "searchInput"
        ).value.trim();


    const results =
        document.getElementById(
            "searchResults"
        );


    if(input.length < 2){

        results.innerHTML = `
            <div class="empty">
                حداقل ۲ حرف وارد کن.
            </div>
        `;

        return;

    }


    results.innerHTML = `
        <div class="empty">
            در حال جستجو...
        </div>
    `;


    const {
        data,
        error
    } =
    await supabase
    .from("profiles")
    .select("id, username")
    .ilike(
        "username",
        `%${input}%`
    )
    .neq(
        "id",
        currentUser.id
    )
    .limit(10);


    if(error){

        console.error(error);

        results.innerHTML = `
            <div class="empty">
                خطا در جستجو.
            </div>
        `;

        return;

    }


    if(!data || data.length === 0){

        results.innerHTML = `
            <div class="empty">
                بازیکنی پیدا نشد.
            </div>
        `;

        return;

    }


    results.innerHTML = "";


    data.forEach(user => {

        const div =
            document.createElement("div");

        div.className =
            "result";


        div.innerHTML = `

            <div class="username">
                👤 ${escapeHTML(user.username)}
            </div>

            <button class="action">
                + ADD FRIEND
            </button>

        `;


        div
        .querySelector("button")
        .addEventListener(
            "click",
            () =>
            sendRequest(
                user.id,
                user.username,
                div
            )
        );


        results.appendChild(div);

    });

}


/* =========================
   SEND REQUEST
========================= */

async function sendRequest(
    receiverId,
    username,
    element
){

    const {
        data:existing
    } =
    await supabase
    .from("friend_requests")
    .select("id,status")
    .or(
        `and(sender_id.eq.${currentUser.id},receiver_id.eq.${receiverId}),and(sender_id.eq.${receiverId},receiver_id.eq.${currentUser.id})`
    )
    .limit(1);


    if(existing && existing.length > 0){

        showMessage(
            "قبلاً درخواست یا رابطه‌ای با این کاربر وجود دارد."
        );

        return;

    }


    const {
        error
    } =
    await supabase
    .from("friend_requests")
    .insert({

        sender_id:
            currentUser.id,

        receiver_id:
            receiverId,

        status:
            "pending"

    });


    if(error){

        console.error(error);

        showMessage(
            "ارسال درخواست انجام نشد."
        );

        return;

    }


    element.innerHTML = `
        <div class="username">
            👤 ${escapeHTML(username)}
        </div>

        <div style="color:#ffc107">
            درخواست ارسال شد ✓
        </div>
    `;


    showMessage(
        "درخواست دوستی ارسال شد."
    );

}


/* =========================
   LOAD REQUESTS
========================= */

async function loadRequests(){

    const box =
        document.getElementById(
            "requests"
        );


    const {
        data,
        error
    } =
    await supabase
    .from("friend_requests")
    .select(
        "id, sender_id, status"
    )
    .eq(
        "receiver_id",
        currentUser.id
    )
    .eq(
        "status",
        "pending"
    );


    if(error){

        console.error(error);

        box.innerHTML = `
            <div class="empty">
                خطا در دریافت درخواست‌ها.
            </div>
        `;

        return;

    }


    if(!data || data.length === 0){

        box.innerHTML = `
            <div class="empty">
                درخواست جدیدی نداری.
            </div>
        `;

        return;

    }


    box.innerHTML = "";


    for(
        const request
        of data
    ){

        const {
            data:profile
        } =
        await supabase
        .from("profiles")
        .select("username")
        .eq(
            "id",
            request.sender_id
        )
        .single();


        const username =
            profile?.username
            || "Unknown";


        const div =
            document.createElement("div");

        div.className =
            "request";


        div.innerHTML = `

            <div class="username">
                👤 ${escapeHTML(username)}
            </div>

            <div>

                <button
                    class="accept"
                >
                    ACCEPT
                </button>

                <button
                    class="reject"
                >
                    REJECT
                </button>

            </div>

        `;


        div
        .querySelector(".accept")
        .addEventListener(
            "click",
            () =>
            acceptRequest(
                request.id,
                request.sender_id
            )
        );


        div
        .querySelector(".reject")
        .addEventListener(
            "click",
            () =>
            rejectRequest(
                request.id
            )
        );


        box.appendChild(div);

    }

}


/* =========================
   ACCEPT
========================= */

async function acceptRequest(
    requestId,
    senderId
){

    const {
        error:updateError
    } =
    await supabase
    .from("friend_requests")
    .update({
        status:"accepted"
    })
    .eq(
        "id",
        requestId
    );


    if(updateError){

        console.error(updateError);

        showMessage(
            "قبول درخواست انجام نشد."
        );

        return;

    }


    const {
        error:insertError
    } =
    await supabase
    .from("friendships")
    .insert([

        {
            user_id:
                currentUser.id,

            friend_id:
                senderId
        },

        {
            user_id:
                senderId,

            friend_id:
                currentUser.id
        }

    ]);


    if(insertError){

        console.error(insertError);

        showMessage(
            "دوستی ایجاد نشد."
        );

        return;

    }


    showMessage(
        "درخواست قبول شد 🎉"
    );


    await loadRequests();

    await loadFriends();

}


/* =========================
   REJECT
========================= */

async function rejectRequest(
    requestId
){

    const {
        error
    } =
    await supabase
    .from("friend_requests")
    .update({
        status:"rejected"
    })
    .eq(
        "id",
        requestId
    );


    if(error){

        console.error(error);

        showMessage(
            "رد درخواست انجام نشد."
        );

        return;

    }


    showMessage(
        "درخواست رد شد."
    );


    await loadRequests();

}


/* =========================
   LOAD FRIENDS
========================= */

async function loadFriends(){

    const box =
        document.getElementById(
            "friends"
        );


    const {
        data,
        error
    } =
    await supabase
    .from("friendships")
    .select(
        "friend_id"
    )
    .eq(
        "user_id",
        currentUser.id
    );


    if(error){

        console.error(error);

        box.innerHTML = `
            <div class="empty">
                خطا در دریافت دوستان.
            </div>
        `;

        return;

    }


    if(!data || data.length === 0){

        box.innerHTML = `
            <div class="empty">
                هنوز دوستی نداری.
            </div>
        `;

        return;

    }


    box.innerHTML = "";


    for(
        const friend
        of data
    ){

        const {
            data:profile
        } =
        await supabase
        .from("profiles")
        .select("username")
        .eq(
            "id",
            friend.friend_id
        )
        .single();


        const username =
            profile?.username
            || "Unknown";


        const div =
            document.createElement("div");

        div.className =
            "friend";


        div.innerHTML = `

            <div class="username">
                👤 ${escapeHTML(username)}
            </div>

            <div style="color:#777">
                FRIEND
            </div>

        `;


        box.appendChild(div);

    }

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text){

    return text
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================
   START
========================= */

async function start(){

    currentUser =
        await getUser();


    if(!currentUser)
        return;


    await loadRequests();

    await loadFriends();

}


start();

</script>

</body>

</html>
