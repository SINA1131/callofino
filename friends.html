<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>CALLAFINO | دوستان</title>

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
        Tahoma,
        Arial,
        sans-serif;

    background:#050505;
    color:#fff;

    min-height:100vh;

    overflow-x:hidden;
}


/* =========================
   BACKGROUND
========================= */

body::before{
    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;

    background:
        radial-gradient(
            circle at 15% 15%,
            rgba(0,255,136,.09),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 80%,
            rgba(0,255,136,.06),
            transparent 30%
        );

    z-index:-2;
}

body::after{
    content:"";

    position:fixed;

    width:500px;
    height:500px;

    border-radius:50%;

    background:
        rgba(0,255,136,.025);

    filter:blur(100px);

    top:30%;
    left:50%;

    transform:translate(-50%,-50%);

    pointer-events:none;

    z-index:-1;
}


/* =========================
   NAVBAR
========================= */

.navbar{

    position:sticky;

    top:0;

    z-index:1000;

    height:70px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 6%;

    background:
        rgba(5,5,5,.92);

    backdrop-filter:blur(18px);

    border-bottom:
        1px solid
        rgba(0,255,136,.15);

    box-shadow:
        0 5px 25px
        rgba(0,0,0,.25);
}

.logo{

    font-size:24px;

    font-weight:900;

    letter-spacing:2px;

    color:#00ff88;

    text-shadow:
        0 0 10px
        rgba(0,255,136,.5);
}

.nav-links{

    display:flex;

    align-items:center;

    gap:25px;
}

.nav-links a{

    position:relative;

    color:#999;

    text-decoration:none;

    font-size:14px;

    transition:.3s;
}

.nav-links a::after{

    content:"";

    position:absolute;

    right:0;

    bottom:-8px;

    width:0;

    height:2px;

    background:#00ff88;

    box-shadow:
        0 0 8px
        rgba(0,255,136,.6);

    transition:.3s;
}

.nav-links a:hover{

    color:#00ff88;
}

.nav-links a:hover::after{

    width:100%;
}


/* =========================
   MAIN
========================= */

.container{

    width:90%;

    max-width:1100px;

    margin:
        50px
        auto
        80px;
}


/* =========================
   PAGE TITLE
========================= */

.page-title{

    text-align:center;

    margin-bottom:45px;
}

.page-title h1{

    font-size:38px;

    margin-bottom:12px;

    font-weight:900;
}

.page-title h1 span{

    color:#00ff88;

    text-shadow:
        0 0 15px
        rgba(0,255,136,.5);
}

.page-title p{

    color:#666;

    font-size:14px;
}


/* =========================
   SEARCH BOX
========================= */

.search-box{

    position:relative;

    background:
        linear-gradient(
            145deg,
            rgba(18,18,18,.96),
            rgba(7,7,7,.96)
        );

    border:
        1px solid
        rgba(0,255,136,.13);

    border-radius:22px;

    padding:30px;

    margin-bottom:28px;

    overflow:hidden;

    box-shadow:
        0 15px 45px
        rgba(0,0,0,.35);

    transition:.3s;
}

.search-box::before{

    content:"";

    position:absolute;

    top:0;
    right:0;

    width:100%;

    height:2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #00ff88,
            transparent
        );

    opacity:.5;
}

.search-box:hover{

    border-color:
        rgba(0,255,136,.3);
}

.search-title{

    font-size:21px;

    font-weight:bold;

    margin-bottom:8px;
}

.search-subtitle{

    color:#666;

    font-size:13px;

    margin-bottom:20px;
}

.search-row{

    display:flex;

    gap:12px;
}

.search-input{

    flex:1;

    height:52px;

    border-radius:13px;

    border:
        1px solid
        #222;

    background:#0c0c0c;

    color:#fff;

    outline:none;

    padding:
        0 18px;

    font-size:14px;

    font-family:inherit;

    direction:rtl;

    transition:.3s;
}

.search-input::placeholder{

    color:#555;
}

.search-input:focus{

    border-color:#00ff88;

    box-shadow:
        0 0 18px
        rgba(0,255,136,.1);
}

.search-btn{

    height:52px;

    padding:
        0 27px;

    border:none;

    border-radius:13px;

    background:#00ff88;

    color:#000;

    font-weight:bold;

    font-family:inherit;

    cursor:pointer;

    transition:.3s;
}

.search-btn:hover{

    transform:
        translateY(-2px);

    box-shadow:
        0 0 25px
        rgba(0,255,136,.3);
}

.search-btn:active{

    transform:
        translateY(0);
}


/* =========================
   SEARCH RESULT
========================= */

.search-result{

    margin-top:20px;
}

.user-card{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:20px;

    padding:19px;

    background:
        linear-gradient(
            145deg,
            #101010,
            #090909
        );

    border:
        1px solid
        rgba(0,255,136,.12);

    border-radius:16px;

    transition:.3s;
}

.user-card:hover{

    border-color:
        rgba(0,255,136,.35);

    transform:
        translateY(-2px);
}

.user-info{

    display:flex;

    flex-direction:column;

    gap:7px;

    min-width:0;
}

.username{

    font-size:16px;

    font-weight:bold;

    color:#fff;
}

.user-id{

    color:#00ff88;

    font-size:12px;

    font-weight:bold;

    direction:ltr;

    text-align:right;
}

.user-type{

    color:#555;

    font-size:11px;
}

.add-btn{

    flex-shrink:0;

    border:
        1px solid
        rgba(0,255,136,.35);

    background:
        rgba(0,255,136,.07);

    color:#00ff88;

    border-radius:11px;

    padding:
        10px 17px;

    cursor:pointer;

    font-family:inherit;

    transition:.3s;
}

.add-btn:hover{

    background:#00ff88;

    color:#000;

    box-shadow:
        0 0 18px
        rgba(0,255,136,.2);
}

.add-btn:disabled{

    opacity:.5;

    cursor:not-allowed;

    transform:none;

    box-shadow:none;
}


/* =========================
   SECTION
========================= */

.section{

    position:relative;

    background:
        linear-gradient(
            145deg,
            rgba(15,15,15,.97),
            rgba(7,7,7,.97)
        );

    border:
        1px solid
        rgba(255,255,255,.055);

    border-radius:22px;

    padding:28px;

    margin-bottom:25px;

    box-shadow:
        0 12px 40px
        rgba(0,0,0,.25);

    overflow:hidden;
}

.section::before{

    content:"";

    position:absolute;

    top:0;
    right:8%;

    width:35%;

    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(0,255,136,.5),
            transparent
        );
}

.section-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:22px;
}

.section-title{

    font-size:20px;

    font-weight:bold;
}

.section-title span{

    color:#00ff88;

    text-shadow:
        0 0 8px
        rgba(0,255,136,.3);
}

.count{

    min-width:31px;

    height:31px;

    padding:0 8px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:50%;

    background:
        rgba(0,255,136,.08);

    border:
        1px solid
        rgba(0,255,136,.2);

    color:#00ff88;

    font-size:12px;

    font-weight:bold;
}


/* =========================
   REQUESTS
========================= */

.requests{

    display:flex;

    flex-direction:column;

    gap:12px;
}

.request-card{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:18px;

    padding:18px;

    background:
        linear-gradient(
            145deg,
            #101010,
            #0a0a0a
        );

    border:
        1px solid
        rgba(255,255,255,.05);

    border-radius:15px;

    transition:.3s;
}

.request-card:hover{

    border-color:
        rgba(0,255,136,.22);
}

.request-info{

    display:flex;

    flex-direction:column;

    gap:6px;

    min-width:0;
}

.request-name{

    font-size:15px;

    font-weight:bold;
}

.request-id{

    color:#00ff88;

    font-size:11px;

    font-weight:bold;

    direction:ltr;

    text-align:right;
}

.request-text{

    color:#555;

    font-size:11px;
}

.request-actions{

    display:flex;

    gap:8px;

    flex-shrink:0;
}

.accept-btn,
.reject-btn{

    border:none;

    border-radius:10px;

    padding:
        9px 15px;

    cursor:pointer;

    font-family:inherit;

    font-size:12px;

    transition:.3s;
}

.accept-btn{

    background:#00ff88;

    color:#000;

    font-weight:bold;
}

.accept-btn:hover{

    box-shadow:
        0 0 18px
        rgba(0,255,136,.3);

    transform:
        translateY(-1px);
}

.reject-btn{

    background:#151515;

    color:#aaa;

    border:
        1px solid
        #292929;
}

.reject-btn:hover{

    color:#fff;

    border-color:#444;
}


/* =========================
   FRIENDS GRID
========================= */

.friends-grid{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(250px,1fr)
        );

    gap:16px;
}


/* =========================
   FRIEND CARD
========================= */

.friend-card{

    position:relative;

    min-height:155px;

    padding:22px;

    background:
        linear-gradient(
            145deg,
            #111,
            #080808
        );

    border:
        1px solid
        rgba(0,255,136,.1);

    border-radius:18px;

    overflow:hidden;

    transition:.35s;
}

.friend-card::before{

    content:"";

    position:absolute;

    top:0;

    right:0;

    width:100%;

    height:2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #00ff88,
            transparent
        );

    opacity:.4;
}

.friend-card::after{

    content:"";

    position:absolute;

    width:100px;
    height:100px;

    border-radius:50%;

    background:
        rgba(0,255,136,.04);

    filter:blur(25px);

    left:-40px;

    bottom:-50px;

    pointer-events:none;
}

.friend-card:hover{

    transform:
        translateY(-5px);

    border-color:
        rgba(0,255,136,.3);

    box-shadow:
        0 12px 35px
        rgba(0,255,136,.07);
}

.friend-top{

    display:flex;

    align-items:center;

    gap:14px;

    margin-bottom:18px;
}

.friend-avatar{

    width:48px;

    height:48px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:14px;

    background:
        rgba(0,255,136,.08);

    border:
        1px solid
        rgba(0,255,136,.18);

    color:#00ff88;

    font-size:18px;

    font-weight:900;

    box-shadow:
        inset 0 0 15px
        rgba(0,255,136,.04);
}

.friend-details{

    min-width:0;

    flex:1;
}

.friend-name{

    font-size:16px;

    font-weight:bold;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    margin-bottom:6px;
}

.friend-id{

    color:#00ff88;

    font-size:11px;

    font-weight:bold;

    direction:ltr;

    text-align:right;
}

.friend-status{

    display:flex;

    align-items:center;

    gap:6px;

    color:#666;

    font-size:10px;

    margin-bottom:16px;
}

.status-dot{

    width:6px;

    height:6px;

    border-radius:50%;

    background:#00ff88;

    box-shadow:
        0 0 8px
        rgba(0,255,136,.7);
}

.remove-friend-btn{

    width:100%;

    height:38px;

    border-radius:10px;

    border:
        1px solid
        rgba(255,70,70,.18);

    background:
        rgba(255,70,70,.04);

    color:#999;

    font-family:inherit;

    font-size:11px;

    cursor:pointer;

    transition:.3s;
}

.remove-friend-btn:hover{

    background:
        rgba(255,70,70,.1);

    border-color:
        rgba(255,70,70,.4);

    color:#ff7070;
}


/* =========================
   EMPTY
========================= */

.empty{

    text-align:center;

    padding:32px 10px;

    color:#555;

    font-size:13px;
}


/* =========================
   BACK BUTTON
========================= */

.back-btn{

    display:block;

    width:max-content;

    margin:
        32px
        auto
        0;

    padding:
        12px 27px;

    border-radius:12px;

    text-decoration:none;

    color:#00ff88;

    border:
        1px solid
        rgba(0,255,136,.25);

    background:
        rgba(0,255,136,.05);

    transition:.3s;
}

.back-btn:hover{

    background:#00ff88;

    color:#000;

    box-shadow:
        0 0 22px
        rgba(0,255,136,.2);

    transform:
        translateY(-2px);
}


/* =========================
   TOAST
========================= */

.toast{

    position:fixed;

    bottom:25px;

    left:50%;

    transform:
        translateX(-50%)
        translateY(20px);

    min-width:220px;

    max-width:90%;

    text-align:center;

    background:
        rgba(15,15,15,.96);

    border:
        1px solid
        rgba(0,255,136,.25);

    color:#fff;

    padding:
        13px 22px;

    border-radius:12px;

    font-size:13px;

    opacity:0;

    pointer-events:none;

    transition:.3s;

    z-index:9999;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.4);
}

.toast.show{

    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .navbar{

        padding:0 4%;

    }

    .logo{

        font-size:20px;
    }

    .nav-links{

        gap:12px;
    }

    .nav-links a{

        font-size:11px;
    }

    .container{

        width:94%;

        margin-top:35px;
    }

    .page-title h1{

        font-size:29px;
    }

    .search-box{

        padding:22px;
    }

    .search-row{

        flex-direction:column;
    }

    .search-btn{

        width:100%;
    }

    .user-card{

        align-items:flex-start;

        flex-direction:column;
    }

    .add-btn{

        width:100%;
    }

    .request-card{

        align-items:flex-start;

        flex-direction:column;
    }

    .request-actions{

        width:100%;
    }

    .accept-btn,
    .reject-btn{

        flex:1;
    }

    .friends-grid{

        grid-template-columns:
            1fr;
    }

}


/* =========================
   EXTRA SMALL
========================= */

@media(max-width:430px){

    .nav-links{

        gap:8px;
    }

    .nav-links a{

        font-size:10px;
    }

    .section{

        padding:20px;
    }

    .section-title{

        font-size:17px;
    }

}

</style>

</head>


<body>

     NAVBAR
========================= -->

<nav class="navbar">

<!-- =========================

<main class="container">

    <div class="page-title">

        <h1>

         FRIENDS
    ========================= -->

    <section class="section">

        <div class="section-header">

            <div class="section-title">
                <span>دوستان</span> من
            </div>

            <div
                class="count"
                id="friendCount"
            >
                0
            </div>

        </div>

        <div
            class="friends-grid"

<!-- =========================
     SUPABASE
========================= -->

<script type="module">

import {
    createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
"https://oisqrkqwbskvqkparmiw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_FGoXFElayJeRdyFxyc61hQ_c5CUn5HL";


const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   GLOBAL
========================= */

let currentUser = null;


/* =========================
   ELEMENTS
========================= */

const userIdSearch =
document.getElementById(
    "userIdSearch"
);

const searchBtn =
document.getElementById(
    "searchBtn"
);

const searchResult =
document.getElementById(
    "searchResult"
);

const requests =
document.getElementById(
    "requests"
);

const requestCount =
document.getElementById(
    "requestCount"
);

const friends =
document.getElementById(
    "friends"
);

const friendCount =
document.getElementById(
    "friendCount"
);

const toast =
document.getElementById(
    "toast"
);


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================
   NORMALIZE DIGITS
========================= */

function normalizeDigits(value){

    return String(value ?? "")
        .replace(/[۰-۹]/g, function(digit){

            return String(
                "۰۱۲۳۴۵۶۷۸۹"
                .indexOf(digit)
            );

        })
        .replace(/[٠-٩]/g, function(digit){

            return String(
                "٠١٢٣٤٥٦٧٨٩"
                .indexOf(digit)
            );

        });

}


/* =========================
   FORMAT USER ID
========================= */

function formatUserId(userCode){

    if(
        userCode === null ||
        userCode === undefined
    ){

        return "-----";

    }

    return String(userCode)
        .padStart(5,"0");
}


/* =========================
   GET AVATAR LETTER
========================= */

function getAvatarLetter(username){

    const name =
        String(
            username ||
            "C"
        ).trim();

    return escapeHTML(
        name.charAt(0).toUpperCase()
    );

}


/* =========================
   TOAST
========================= */

let toastTimer = null;

function showToast(message){

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(() => {

            toast.classList.remove(
                "show"
            );

        },3000);

}


/* =========================
   LOAD USER
========================= */

async function loadUser(){

    const {
        data,
        error
    } =
    await supabase.auth
        .getUser();


    if(
        error ||
        !data ||
        !data.user
    ){

        showToast(
            "ابتدا وارد حساب کاربری شوید."
        );

        setTimeout(() => {

            window.location.href =
                "login.html";

        },1500);

        return;

    }


    currentUser =
        data.user;


    await Promise.all([

        loadFriends(),

        loadRequests()

    ]);

}


/* =========================
   LOAD FRIENDS
========================= */

async function loadFriends(){

    if(!currentUser)
        return;


    const {
        data: friendshipsData,
        error: friendshipsError
    } =
    await supabase

        .from("friendships")

        .select(
            "user_id, friend_id"
        )

        .or(
            `user_id.eq.${currentUser.id},friend_id.eq.${currentUser.id}`
        );


    if(friendshipsError){

        console.error(
            friendshipsError
        );

        friends.innerHTML = `
            <div class="empty">
                خطا در دریافت دوستان
            </div>
        `;

        friendCount.textContent =
            "0";

        return;

    }


    const friendIds = [];


    (friendshipsData || [])
        .forEach(row => {

            if(
                row.user_id ===
                currentUser.id
            ){

                friendIds.push(
                    row.friend_id
                );

            }
            else{

                friendIds.push(
                    row.user_id
                );

            }

        });


    const uniqueFriendIds =
        [
            ...new Set(friendIds)
        ];


    friendCount.textContent =
        uniqueFriendIds.length;


    if(
        uniqueFriendIds.length === 0
    ){

        friends.innerHTML = `
            <div class="empty">
                هنوز دوستی اضافه نکرده‌اید.
            </div>
        `;

        return;

    }


    const {
        data: profiles,
        error: profilesError
    } =
    await supabase

        .from("profiles")

        .select(
            "id, username, user_code"
        )

        .in(
            "id",
            uniqueFriendIds
        );


    if(profilesError){

        console.error(
            profilesError
        );

        friends.innerHTML = `
            <div class="empty">
                خطا در دریافت اطلاعات دوستان
            </div>
        `;

        return;

    }


    friends.innerHTML =
        (profiles || [])
        .map(friend => `

            <div
                class="friend-card"
                id="friend-${escapeHTML(
                    friend.id
                )}"
            >

                <div class="friend-top">

                    <div class="friend-avatar">
                        ${getAvatarLetter(
                            friend.username
                        )}
                    </div>

                    <div class="friend-details">

                        <div class="friend-name">
                            ${escapeHTML(
                                friend.username ||
                                "کاربر CALLAFINO"
                            )}
                        </div>

                        <div class="friend-id">
                            ID:
                            ${escapeHTML(
                                formatUserId(
                                    friend.user_code
                                )
                            )}
                        </div>

                    </div>

                </div>

                <div class="friend-status">

                    <span class="status-dot"></span>

                    دوست شما در CALLAFINO

                </div>

                <button
                    class="remove-friend-btn"
                    data-friend-id="${escapeHTML(
                        friend.id
                    )}"
                    data-friend-name="${escapeHTML(
                        friend.username ||
                        "این کاربر"
                    )}"
                >
                    حذف دوست
                </button>

            </div>

        `)
        .join("");


    /*
       DELETE BUTTONS
    */

    document
        .querySelectorAll(
            ".remove-friend-btn"
        )
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    removeFriend(
                        button.dataset.friendId,
                        button.dataset.friendName
                    );

                }
            );

        });

}


/* =========================
   SEARCH USER BY ID
========================= */

async function searchUser(){

    if(!currentUser)
        return;


    const rawValue =
        userIdSearch.value.trim();


    const searchCode =
        normalizeDigits(
            rawValue
        );


    if(!/^\d{5}$/.test(searchCode)){

        searchResult.innerHTML = `
            <div class="empty">
                لطفاً یک ID پنج‌رقمی معتبر وارد کنید.
            </div>
        `;

        return;

    }


    searchResult.innerHTML = `
        <div class="empty">
            در حال جستجو...
        </div>
    `;


    const {
        data: user,
        error
    } =
    await supabase

        .from("profiles")

        .select(
            "id, username, user_code"
        )

        .eq(
            "user_code",
            Number(searchCode)
        )

        .maybeSingle();


    if(error){

        console.error(
            error
        );

        searchResult.innerHTML = `
            <div class="empty">
                خطا در جستجوی کاربر.
            </div>
        `;

        return;

    }


    if(!user){

        searchResult.innerHTML = `
            <div class="empty">
                کاربری با این ID پیدا نشد.
            </div>
        `;

        return;

    }


    if(
        user.id ===
        currentUser.id
    ){

        searchResult.innerHTML = `
            <div class="empty">
                این ID متعلق به خود شماست.
            </div>
        `;

        return;

    }


    /*
       CHECK FRIENDSHIP
    */

    const {
        data: friendship,
        error: friendshipError
    } =
    await supabase

        .from("friendships")

        .select(
            "user_id, friend_id"
        )

        .or(
            `and(user_id.eq.${currentUser.id},friend_id.eq.${user.id}),and(user_id.eq.${user.id},friend_id.eq.${currentUser.id})`
        )
        .maybeSingle();


    if(friendshipError){

        console.error(
            friendshipError
        );

    }


    /*
       CHECK PENDING REQUEST
    */

    const {
        data: pendingRequest,
        error: pendingError
    } =
    await supabase

        .from("friend_requests")

        .select(
            "id, sender_id, receiver_id, status"
        )

        .or(
            `and(sender_id.eq.${currentUser.id},receiver_id.eq.${user.id},status.eq.pending),and(sender_id.eq.${user.id},receiver_id.eq.${currentUser.id},status.eq.pending)`
        )
        .maybeSingle();


    if(pendingError){

        console.error(
            pendingError
        );

    }


    let buttonText =
        "افزودن به دوستان";

    let disabled =
        false;


    if(friendship){

        buttonText =
            "در لیست دوستان";

        disabled =
            true;

    }
    else if(pendingRequest){

        if(
            pendingRequest.sender_id ===
            currentUser.id
        ){

            buttonText =
                "درخواست ارسال شده";

        }
        else{

            buttonText =
                "درخواست دوستی دارد";

        }

        disabled =
            true;

    }


    searchResult.innerHTML = `

        <div class="user-card">

            <div class="user-info">

                <div class="username">
                    ${escapeHTML(
                        user.username ||
                        "کاربر CALLAFINO"
                    )}
                </div>

                <div class="user-id">
                    ID:
                    ${escapeHTML(
                        formatUserId(
                            user.user_code
                        )
                    )}
                </div>

                <div class="user-type">
                    کاربر CALLAFINO
                </div>

            </div>

            <button
                class="add-btn"
                id="addFriendBtn"
                ${disabled ? "disabled" : ""}
            >
                ${buttonText}
            </button>

        </div>

    `;


    const addFriendBtn =
        document.getElementById(
            "addFriendBtn"
        );


    if(addFriendBtn){

        addFriendBtn.addEventListener(
            "click",
            () => {

                sendFriendRequest(
                    user.id,
                    addFriendBtn
                );

            }
        );

    }

}


/* =========================
   SEND FRIEND REQUEST
========================= */

async function sendFriendRequest(
    receiverId,
    button
){

    if(!currentUser)
        return;


    if(
        receiverId ===
        currentUser.id
    ){

        showToast(
            "نمی‌توانید برای خودتان درخواست بفرستید."
        );

        return;

    }


    button.disabled =
        true;


    /*
       CHECK FRIENDSHIP
    */

    const {
        data: friendship,
        error: friendshipError
    } =
    await supabase

        .from("friendships")

        .select(
            "user_id, friend_id"
        )

        .or(
            `and(user_id.eq.${currentUser.id},friend_id.eq.${receiverId}),and(user_id.eq.${receiverId},friend_id.eq.${currentUser.id})`
        )
        .maybeSingle();


    if(friendshipError){

        console.error(
            friendshipError
        );

        button.disabled =
            false;

        showToast(
            "خطا در بررسی دوستی."
        );

        return;

    }


    if(friendship){

        button.textContent =
            "در لیست دوستان";

        showToast(
            "این کاربر قبلاً دوست شماست."
        );

        return;

    }


    /*
       CHECK REQUEST
    */

    const {
        data: existingRequest,
        error: requestCheckError
    } =
    await supabase

        .from("friend_requests")

        .select(
            "id, sender_id, receiver_id, status"
        )

        .or(
            `and(sender_id.eq.${currentUser.id},receiver_id.eq.${receiverId},status.eq.pending),and(sender_id.eq.${receiverId},receiver_id.eq.${currentUser.id},status.eq.pending)`
        )
        .maybeSingle();


    if(requestCheckError){

        console.error(
            requestCheckError
        );

        button.disabled =
            false;

        showToast(
            "خطا در بررسی درخواست."
        );

        return;

    }


    if(existingRequest){

        button.textContent =
            "درخواست ارسال شده";

        showToast(
            "قبلاً یک درخواست دوستی وجود دارد."
        );

        return;

    }


    /*
       INSERT REQUEST
    */

    const {
        error
    } =
    await supabase

        .from("friend_requests")

        .insert({

            sender_id:
                currentUser.id,

            receiver_id:
                receiverId,

            status:
                "pending"

        });


    if(error){

        console.error(
            error
        );

        button.disabled =
            false;

        showToast(
            "ارسال درخواست ناموفق بود."
        );

        return;

    }


    button.textContent =
        "درخواست ارسال شد";


    showToast(
        "درخواست دوستی ارسال شد."
    );


    await loadRequests();

}


/* =========================
   LOAD REQUESTS
========================= */

async function loadRequests(){

    if(!currentUser)
        return;


    const {
        data: requestData,
        error
    } =
    await supabase

        .from("friend_requests")

        .select(
            "id, sender_id, receiver_id, status"
        )

        .eq(
            "receiver_id",
            currentUser.id
        )

        .eq(
            "status",
            "pending"
        );


    if(error){

        console.error(
            error
        );

        requests.innerHTML = `
            <div class="empty">
                خطا در دریافت درخواست‌ها
            </div>
        `;

        requestCount.textContent =
            "0";

        return;

    }


    const list =
        requestData || [];


    requestCount.textContent =
        list.length;


    if(list.length === 0){

        requests.innerHTML = `
            <div class="empty">
                درخواست دوستی جدیدی ندارید.
            </div>
        `;

        return;

    }


    const senderIds =
        list.map(
            request =>
                request.sender_id
        );


    const {
        data: senders,
        error: senderError
    } =
    await supabase

        .from("profiles")

        .select(
            "id, username, user_code"
        )

        .in(
            "id",
            senderIds
        );


    if(senderError){

        console.error(
            senderError
        );

        requests.innerHTML = `
            <div class="empty">
                خطا در دریافت اطلاعات کاربران
            </div>
        `;

        return;

    }


    const senderMap =
        new Map(
            (senders || [])
            .map(
                sender => [
                    sender.id,
                    sender
                ]
            )
        );


    requests.innerHTML =
        list.map(request => {

            const sender =
                senderMap.get(
                    request.sender_id
                );


            return `

                <div
                    class="request-card"
                    data-request-id="${escapeHTML(
                        request.id
                    )}"
                >

                    <div class="request-info">

                        <div class="request-name">
                            ${escapeHTML(
                                sender?.username ||
                                "کاربر CALLAFINO"
                            )}
                        </div>

                        <div class="request-id">
                            ID:
                            ${escapeHTML(
                                formatUserId(
                                    sender?.user_code
                                )
                            )}
                        </div>

                        <div class="request-text">
                            برای شما درخواست دوستی فرستاده است.
                        </div>

                    </div>

                    <div class="request-actions">

                        <button
                            class="accept-btn"
                            data-request-id="${escapeHTML(
                                request.id
                            )}"
                            data-sender-id="${escapeHTML(
                                request.sender_id
                            )}"
                        >
                            قبول
                        </button>

                        <button
                            class="reject-btn"
                            data-request-id="${escapeHTML(
                                request.id
                            )}"
                        >
                            رد
                        </button>

                    </div>

                </div>

            `;

        })
        .join("");


    /*
       ACCEPT BUTTONS
    */

    document
        .querySelectorAll(
            ".accept-btn"
        )
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    acceptRequest(
                        button.dataset.requestId,
                        button.dataset.senderId
                    );

                }
            );

        });


    /*
       REJECT BUTTONS
    */

    document
        .querySelectorAll(
            ".reject-btn"
        )
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    rejectRequest(
                        button.dataset.requestId
                    );

                }
            );

        });

}


/* =========================
   ACCEPT REQUEST
========================= */

async function acceptRequest(
    requestId,
    senderId
){

    if(!currentUser)
        return;


    const {
        error: friendshipError
    } =
    await supabase

        .from("friendships")

        .insert({

            user_id:
                senderId,

            friend_id:
                currentUser.id

        });


    if(friendshipError){

        console.error(
            friendshipError
        );

        showToast(
            "قبول درخواست ناموفق بود."
        );

        return;

    }


    const {
        error: updateError
    } =
    await supabase

        .from("friend_requests")

        .update({

            status:
                "accepted"

        })

        .eq(
            "id",
            requestId
        );


    if(updateError){

        console.error(
            updateError
        );

        showToast(
            "دوستی ایجاد شد، اما وضعیت درخواست تغییر نکرد."
        );

    }
    else{

        showToast(
            "درخواست دوستی قبول شد."
        );

    }


    await Promise.all([

        loadFriends(),

        loadRequests()

    ]);

}


/* =========================
   REJECT REQUEST
========================= */

async function rejectRequest(
    requestId
){

    const {
        error
    } =
    await supabase

        .from("friend_requests")

        .update({

            status:
                "rejected"

        })

        .eq(
            "id",
            requestId
        );


    if(error){

        console.error(
            error
        );

        showToast(
            "رد کردن درخواست ناموفق بود."
        );

        return;

    }


    showToast(
        "درخواست رد شد."
    );


    await loadRequests();

}


/* =========================
   REMOVE FRIEND
========================= */

async function removeFriend(
    friendId,
    friendName
){

    if(!currentUser)
        return;


    /*
       CONFIRM
    */

    const confirmed =
        confirm(
            `آیا مطمئن هستید که می‌خواهید ${friendName} را از دوستان خود حذف کنید؟`
        );


    if(!confirmed)
        return;


    /*
       DELETE FRIENDSHIP
       چه کاربر اول باشد چه دوم
    */

    const {
        error
    } =
    await supabase

        .from("friendships")

        .delete()

        .or(
            `and(user_id.eq.${currentUser.id},friend_id.eq.${friendId}),and(user_id.eq.${friendId},friend_id.eq.${currentUser.id})`
        );


    if(error){

        console.error(
            error
        );

        showToast(
            "حذف دوست ناموفق بود."
        );

        return;

    }


    showToast(
        `${friendName} از دوستان شما حذف شد.`
    );


    /*
       REFRESH
    */

    await loadFriends();

}


/* =========================
   SEARCH EVENTS
========================= */

searchBtn.addEventListener(
    "click",
    searchUser
);


userIdSearch.addEventListener(
    "keydown",
    event => {

        if(
            event.key ===
            "Enter"
        ){

            searchUser();

        }

    }
);


/* =========================
   ONLY NUMBERS
========================= */

userIdSearch.addEventListener(
    "input",
    () => {

        const normalized =
            normalizeDigits(
                userIdSearch.value
            );

        userIdSearch.value =
            normalized
                .replace(
                    /[^0-9]/g,
                    ""
                )
                .slice(0,5);

    }
);


/* =========================
   START
========================= */

loadUser();

</script>
