<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CALLAFINO | Register</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    min-height:100vh;
    background:#050505;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:90%;
    max-width:420px;
    background:#101010;
    padding:35px;
    border-radius:18px;
    border:1px solid #292929;
    box-shadow:0 0 30px rgba(255,193,7,.08);
}

.logo{
    text-align:center;
    font-size:32px;
    font-weight:bold;
    color:#ffc107;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#888;
    margin-bottom:30px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#ccc;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:18px;
    background:#181818;
    color:white;
    border:1px solid #333;
    border-radius:10px;
    outline:none;
}

input:focus{
    border-color:#ffc107;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#ffc107;
    color:#000;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    margin-top:18px;
    text-align:center;
    min-height:20px;
}

.login{
    text-align:center;
    margin-top:22px;
    color:#888;
}

.login a{
    color:#ffc107;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">CALLAFINO</div>

    <div class="subtitle">
        ساخت حساب کاربری
    </div>

    <form id="registerForm">

        <label for="username">نام کاربری</label>

        <input
            type="text"
            id="username"
            placeholder="نام کاربری"
            required
            minlength="3"
        >

        <label for="email">ایمیل</label>

        <input
            type="email"
            id="email"
            placeholder="example@email.com"
            required
        >

        <label for="password">رمز عبور</label>

        <input
            type="password"
            id="password"
            placeholder="حداقل 6 کاراکتر"
            required
            minlength="6"
        >

        <button type="submit" id="registerBtn">
            ثبت نام
        </button>

    </form>

    <div class="message" id="message"></div>

    <div class="login">
        قبلاً حساب داری؟
        <a href="login.html">ورود</a>
    </div>

</div>

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
"https://oisqrkqwbskvqkparmiw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_FGoXFElayJeRdyFxyc61hQ_c5CUn5HL";


const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const form =
document.getElementById("registerForm");

const message =
document.getElementById("message");

const registerBtn =
document.getElementById("registerBtn");


form.addEventListener("submit", async (event) => {

    event.preventDefault();

    message.textContent = "";
    message.style.color = "#ff5252";

    const username =
    document.getElementById("username")
    .value
    .trim();

    const email =
    document.getElementById("email")
    .value
    .trim();

    const password =
    document.getElementById("password")
    .value;


    if(username.length < 3){
        message.textContent =
        "نام کاربری باید حداقل ۳ کاراکتر باشد.";
        return;
    }


    if(password.length < 6){
        message.textContent =
        "رمز عبور باید حداقل ۶ کاراکتر باشد.";
        return;
    }


    registerBtn.disabled = true;
    registerBtn.textContent = "در حال ثبت نام...";


    try{

        /* ساخت حساب */

        const { data, error } =
        await supabase.auth.signUp({

            email: email,

            password: password

        });


        if(error){
            throw error;
        }


        if(!data || !data.user){
            throw new Error(
                "حساب کاربری ساخته نشد."
            );
        }


        const userId =
        data.user.id;


        /* ساخت پروفایل */

        const { error: profileError } =
        await supabase
        .from("profiles")
        .insert({

            id: userId,

            username: username

        });


        if(profileError){

            /* اگر پروفایل ساخته نشد،
               حساب ساخته‌شده باقی می‌ماند */

            throw profileError;
        }


        message.style.color = "#4caf50";

        message.textContent =
        "ثبت نام با موفقیت انجام شد!";


        setTimeout(() => {

            window.location.href =
            "login.html";

        }, 1000);


    }catch(error){

        message.style.color = "#ff5252";

        message.textContent =
        error.message ||
        "خطایی هنگام ثبت نام رخ داد.";

    }


    registerBtn.disabled = false;

    registerBtn.textContent =
    "ثبت نام";

});

</script>

</body>
</html>
