<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CALLAFINO | Ranking</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    background:#050505;
    color:#fff;
    min-height:100vh;
}

header{
    height:75px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 7%;
    background:#080808;
    border-bottom:1px solid #222;
}

.logo{
    color:#ffd000;
    font-size:26px;
    font-weight:bold;
    letter-spacing:2px;
}

.back{
    color:#aaa;
    text-decoration:none;
}

.back:hover{
    color:#ffd000;
}

.container{
    width:92%;
    max-width:1000px;
    margin:40px auto;
}

.title{
    text-align:center;
    margin-bottom:30px;
}

.title h1{
    color:#ffd000;
    font-size:38px;
    margin-bottom:10px;
}

.title p{
    color:#888;
}

.message{
    text-align:center;
    color:#ffd000;
    min-height:22px;
    margin-bottom:15px;
}

.ranking{
    background:#0b0b0b;
    border:1px solid #242424;
    border-radius:16px;
    overflow:hidden;
}

.rank-row{
    display:grid;
    grid-template-columns:80px 1fr 1fr 120px;
    align-items:center;
    min-height:75px;
    border-bottom:1px solid #202020;
    padding:10px 20px;
}

.rank-row:last-child{
    border-bottom:none;
}

.rank-number{
    font-size:24px;
    font-weight:bold;
    color:#ffd000;
    text-align:center;
}

.player{
    padding:5px 15px;
}

.player-name{
    font-weight:bold;
}

.player-label{
    color:#777;
    font-size:12px;
    margin-top:5px;
}

.points{
    text-align:center;
    color:#00d084;
    font-weight:bold;
}

.empty{
    text-align:center;
    color:#777;
    padding:35px;
}

.admin-panel{
    background:#0b0b0b;
    border:1px solid #242424;
    border-radius:16px;
    padding:25px;
    margin-top:25px;
}

.admin-panel h2{
    color:#ffd000;
    margin-bottom:20px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

input{
    width:100%;
    padding:13px;
    border-radius:8px;
    border:1px solid #333;
    background:#111;
    color:#fff;
    outline:none;
}

input:focus{
    border-color:#ffd000;
}

button{
    margin-top:15px;
    width:100%;
    padding:13px;
    border:none;
    border-radius:8px;
    background:#ffd000;
    color:#000;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:.85;
}

.refresh{
    background:#222;
    color:#ffd000;
}

@media(max-width:700px){

    .rank-row{
        grid-template-columns:55px 1fr;
        gap:8px;
    }

    .player{
        padding:5px;
    }

    .points{
        grid-column:2;
        text-align:right;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .title h1{
        font-size:30px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">CALLAFINO</div>
    <a href="dashboard.html" class="back">← داشبورد</a>
</header>


<div class="container">

    <div class="title">
        <h1>🏆 RANKING</h1>
        <p>جدول رده‌بندی بازیکنان CALLAFINO</p>
    </div>

    <div id="message" class="message"></div>


    <!-- RANKING -->

    <div class="ranking">

        <div id="rankingList">
            <div class="empty">
                در حال بارگذاری Ranking...
            </div>
        </div>

    </div>


    <!-- ADD RANK -->

    <div class="admin-panel">

        <h2>➕ افزودن رتبه</h2>

        <div class="form-grid">

            <input
                id="player1"
                type="text"
                placeholder="نام بازیکن اول"
            >

            <input
                id="player2"
                type="text"
                placeholder="نام بازیکن دوم"
            >

            <input
                id="points"
                type="number"
                min="0"
                placeholder="امتیاز"
            >

            <input
                id="position"
                type="number"
                min="1"
                placeholder="رتبه"
            >

        </div>

        <button id="addBtn">
            ADD TO RANKING
        </button>

        <button id="refreshBtn" class="refresh">
            🔄 REFRESH
        </button>

    </div>

</div>


<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
"https://oisqrkqwbskvqkparmiw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_FGoXFElayJeRdyFxyc61hQ_c5CUn5HL";


const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


let currentUser = null;


/* =========================
   MESSAGE
========================= */

function showMessage(text){

    const message =
        document.getElementById("message");

    message.textContent = text;

    setTimeout(()=>{
        message.textContent = "";
    },3000);
}


/* =========================
   AUTH
========================= */

async function checkAuth(){

    const {
        data:{
            user
        }
    } = await supabase.auth.getUser();


    if(!user){

        window.location.href =
            "login.html";

        return;
    }


    currentUser = user;

    await loadRanking();
}


/* =========================
   LOAD RANKING
========================= */

async function loadRanking(){

    const container =
        document.getElementById("rankingList");


    const {
        data,
        error
    } = await supabase
        .from("ranking")
        .select("*")
        .order("position",{ascending:true});


    if(error){

        console.error(error);

        container.innerHTML =
            `<div class="empty">
                خطا در دریافت Ranking
             </div>`;

        return;
    }


    if(!data || data.length===0){

        container.innerHTML =
            `<div class="empty">
                هنوز رتبه‌ای ثبت نشده است.
             </div>`;

        return;
    }


    container.innerHTML = "";


    data.forEach(item=>{

        const row =
            document.createElement("div");

        row.className =
            "rank-row";


        row.innerHTML = `

            <div class="rank-number">
                #${Number(item.position)}
            </div>

            <div class="player">

                <div class="player-name">
                    ${escapeHTML(item.player1_name)}
                </div>

                <div class="player-label">
                    PLAYER 1
                </div>

            </div>

            <div class="player">

                ${
                    item.player2_name
                    ? `
                    <div class="player-name">
                        ${escapeHTML(item.player2_name)}
                    </div>

                    <div class="player-label">
                        PLAYER 2
                    </div>
                    `
                    :
                    `<div class="player-label">
                        —
                    </div>`
                }

            </div>

            <div class="points">
                ${Number(item.points || 0)} PTS
            </div>

        `;


        container.appendChild(row);

    });

}


/* =========================
   ADD RANK
========================= */

async function addRanking(){

    const player1Name =
        document.getElementById("player1").value.trim();

    const player2Name =
        document.getElementById("player2").value.trim();

    const points =
        Number(
            document.getElementById("points").value || 0
        );

    const position =
        Number(
            document.getElementById("position").value
        );


    if(!player1Name){

        showMessage(
            "نام بازیکن اول را وارد کن."
        );

        return;
    }


    if(!position || position < 1){

        showMessage(
            "رتبه را درست وارد کن."
        );

        return;
    }


    const {
        error
    } = await supabase
        .from("ranking")
        .insert({

            player1_id:
                currentUser.id,

            player2_id:
                null,

            player1_name:
                player1Name,

            player2_name:
                player2Name || null,

            points:
                points,

            position:
                position
        });


    if(error){

        console.error(error);

        showMessage(
            "ثبت رتبه انجام نشد."
        );

        return;
    }


    document.getElementById("player1").value="";
    document.getElementById("player2").value="";
    document.getElementById("points").value="";
    document.getElementById("position").value="";


    showMessage(
        "رتبه با موفقیت اضافه شد 🏆"
    );


    await loadRanking();
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =========================
   EVENTS
========================= */

document
.getElementById("addBtn")
.addEventListener(
    "click",
    addRanking
);


document
.getElementById("refreshBtn")
.addEventListener(
    "click",
    loadRanking
);


/* =========================
   START
========================= */

checkAuth();

</script>

</body>
</html>
