<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CALLAFINO | Profile</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma, Arial, sans-serif;
}

body{
    background:#050505;
    color:#fff;
    min-height:100vh;
    overflow-x:hidden;
}

/* =========================
BACKGROUND
========================= */

body::before{
    content:"";
    position:fixed;
    width:600px;
    height:600px;
    background:#00ff88;
    opacity:.05;
    filter:blur(140px);
    top:-200px;
    right:-200px;
    z-index:-1;
}

body::after{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    background:#00ff88;
    opacity:.04;
    filter:blur(130px);
    bottom:-200px;
    left:-150px;
    z-index:-1;
}

/* =========================
HEADER
========================= */

header{
    position:sticky;
    top:0;
    z-index:100;
    height:75px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 7%;
    background:rgba(5,5,5,.88);
    backdrop-filter:blur(15px);
    border-bottom:1px solid rgba(0,255,136,.12);
}

.logo{
    font-size:25px;
    font-weight:900;
    color:#00ff88;
    letter-spacing:1px;
}

nav{
    display:flex;
    gap:10px;
}

nav a{
    text-decoration:none;
    color:#aaa;
    padding:10px 16px;
    border-radius:10px;
    transition:.3s;
    font-size:14px;
}

nav a:hover{
    color:#00ff88;
    background:rgba(0,255,136,.07);
}

/* =========================
MAIN
========================= */

.container{
    width:90%;
    max-width:1150px;
    margin:45px auto;
}

/* =========================
PROFILE HERO
========================= */

.profile-card{
    position:relative;
    display:flex;
    align-items:center;
    gap:30px;
    padding:35px;
    border-radius:24px;
    background:linear-gradient(
        145deg,
        rgba(20,20,20,.95),
        rgba(8,8,8,.95)
    );
    border:1px solid rgba(0,255,136,.16);
    box-shadow:
        0 20px 70px rgba(0,0,0,.5),
        inset 0 0 40px rgba(0,255,136,.015);
    overflow:hidden;
}

.profile-card::before{
    content:"";
    position:absolute;
    width:250px;
    height:250px;
    background:#00ff88;
    opacity:.04;
    filter:blur(70px);
    top:-120px;
    left:-80px;
}

.avatar-box{
    position:relative;
    width:130px;
    height:130px;
    flex-shrink:0;
}

.avatar{
    width:130px;
    height:130px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid #00ff88;
    padding:4px;
    background:#080808;
    box-shadow:
        0 0 25px rgba(0,255,136,.25);
}

.online-dot{
    position:absolute;
    width:18px;
    height:18px;
    background:#00ff88;
    border:3px solid #080808;
    border-radius:50%;
    bottom:8px;
    right:8px;
    box-shadow:0 0 12px rgba(0,255,136,.8);
}

.profile-info{
    flex:1;
}

.profile-label{
    color:#00ff88;
    font-size:11px;
    letter-spacing:2px;
    margin-bottom:10px;
}

.profile-info h2{
    font-size:28px;
    margin-bottom:8px;
}

.username{
    color:#888;
    font-size:14px;
    margin-bottom:18px;
}

.edit-btn{
    border:none;
    background:#00ff88;
    color:#00150b;
    padding:11px 20px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.edit-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 25px rgba(0,255,136,.2);
}

/* =========================
STATS
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    margin-top:22px;
}

.stat-card{
    padding:25px;

.stat-card:hover{

.stat-number{

.wallet-status{

/* =========================

.actions{

    gap:15px;
}

.action-btn{

.action-btn:hover{

/* =========================
MODAL

.modal{

    display:none;

.modal.active{

}

.avatar-option img{
    width:100%;

/* =========================
EMPTY
========================= */

.empty{
    padding:35px;
    text-align:center;

    background:#0b0b0b;
    border:1px solid rgba(255,255,255,.06);

/* =========================

========================= */

@media(max-width:700px){

    }

    .avatar-grid{
        grid-template-columns:repeat(3,1fr);
    }
}

</style>

<script>

/* =========================
SUPABASE
========================= */

const SUPABASE_URL =
"https://oisqrkqwbskvqkparmiw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_FGoXFElayJeRdyFxyc61hQ_c5CUn5HL";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
AVATARS
========================= */

const defaultAvatar =
"https://raw.githubusercontent.com/SINA1131/callofino/main/avatars/file_000000001cec820a80715b1deedc0a36.png";

let selectedAvatar = null;


/* =========================
OPEN MODAL
========================= */

function openAvatarModal(){

    document
        .getElementById("avatarModal")
        .classList.add("active");

}


/* =========================
CLOSE MODAL
========================= */

function closeAvatarModal(){

    document
        .getElementById("avatarModal")
        .classList.remove("active");

}


/* =========================
SELECT AVATAR
========================= */

async function selectAvatar(element, url){

    document
        .querySelectorAll(".avatar-option")
        .forEach(item => {
            item.classList.remove("selected");
        });


    element.classList.add("selected");


    selectedAvatar = url;


    document
        .getElementById("profileAvatar")
        .src = url;


    /* ذخیره محلی */

    localStorage.setItem(
        "callafino_avatar",
        url
    );


    /* =========================
       ذخیره در SUPABASE
    ========================= */

    const {
        data: {
            user
        }
    } = await supabaseClient.auth.getUser();


    if(user){

        const {
            error
        } = await supabaseClient
            .from("profiles")
            .update({
                avatar_url:url
            })
            .eq(
                "id",
                user.id
            );


        if(error){

            console.error(
                "Avatar save error:",
                error
            );

        }

    }


    setTimeout(() => {

        closeAvatarModal();

    }, 300);

}


/* =========================
LOAD USER
========================= */

async function loadProfile(){

    const {
        data: {
            user
        }
    } = await supabaseClient.auth.getUser();


    if(!user){

        window.location.href =
            "login.html";

        return;

    }


    /* =========================
       PROFILE
    ========================= */

    const {
        data: profile
    } = await supabaseClient
        .from("profiles")
        .select("*")
        .eq(
            "id",
            user.id
        )
        .maybeSingle();


    let displayName =
        "کاربر CALLAFINO";


    let username =
        user.email
        ? user.email.split("@")[0]
        : "username";


    if(profile){

        if(profile.username){

            username =
                profile.username;

        }


        if(profile.full_name){

            displayName =
                profile.full_name;

        }
        else if(profile.name){

            displayName =
                profile.name;

        }

    }


    document
        .getElementById("displayName")
        .textContent =
        displayName;


    document
        .getElementById("username")
        .textContent =
        "@" + username;


    /* =========================
       AVATAR
    ========================= */

    const savedAvatar =
        (
            profile &&
            profile.avatar_url
        )
        ? profile.avatar_url
        : (
            localStorage.getItem(
                "callafino_avatar"
            ) || defaultAvatar
        );


    document
        .getElementById("profileAvatar")
        .src =
        savedAvatar;


    selectedAvatar =
        savedAvatar;


    localStorage.setItem(
        "callafino_avatar",
        savedAvatar
    );


    /* =========================
       TOURNAMENT COUNT
    ========================= */

    const {
        count: tournamentCount
    } = await supabaseClient
        .from("tournament_registrations")
        .select(
            "*",
            {
                count:"exact",
                head:true
            }
        )
        .eq(
            "user_id",
            user.id
        );


    document
        .getElementById("tournamentCount")
        .textContent =
        tournamentCount || 0;


    /* =========================
       FRIEND COUNT
    ========================= */

    const {
        count: friendCount
    } = await supabaseClient
        .from("friendships")
        .select(
            "*",
            {
                count:"exact",
                head:true
            }
        )
        .or(
            `user_id.eq.${user.id},friend_id.eq.${user.id}`
        );


    document
        .getElementById("friendCount")
        .textContent =
        friendCount || 0;


    /* =========================
       MY TOURNAMENTS
    ========================= */

    const {
        data: registrations
    } = await supabaseClient
        .from("tournament_registrations")
        .select(`
            slot,
            type,
            created_at,
            tournament_id,
            tournaments (
                title,
                game,
                tournament_date,
                tournament_time
            )
        `)
        .eq(
            "user_id",
            user.id
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    const list =
        document.getElementById(
            "tournamentsList"
        );


    if(
        !registrations ||
        registrations.length === 0
    ){

        list.innerHTML = `
            <div class="empty">
                هنوز در هیچ تورنمنتی ثبت‌نام نکرده‌اید.
            </div>
        `;

        return;

    }


    list.innerHTML = "";


    registrations.forEach(item => {

        const tournament =
            item.tournaments;


        if(!tournament){

            return;

        }


        const card =
            document.createElement("div");


        card.className =
            "tournament";


        card.innerHTML = `

            <h4>
                ${escapeHTML(
                    tournament.title ||
                    "Tournament"
                )}
            </h4>

            <div class="tournament-info">

                🎮 بازی:
                ${escapeHTML(
                    tournament.game ||
                    "-"
                )}

                <br>

                📅 تاریخ:
                ${escapeHTML(
                    tournament.tournament_date ||
                    "-"
                )}

                <br>

                ⏰ ساعت:
                ${escapeHTML(
                    tournament.tournament_time ||
                    "-"
                )}

                <br>

                👥 نوع:
                ${escapeHTML(
                    item.type ||
                    "-"
                )}

                <br>

                🎯 اسلات:
                ${escapeHTML(
                    String(
                        item.slot ||
                        "-"
                    )
                )}

            </div>

        `;


        list.appendChild(card);

    });

}


/* =========================
HTML SAFE

function escapeHTML(value){

        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}
