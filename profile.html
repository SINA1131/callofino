<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CALLAFINO | Profile</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Tahoma, Arial, sans-serif;
    background:#050505;
    color:#fff;
    min-height:100vh;
}

/* =========================
   HEADER
========================= */

header{
    height:70px;
    background:#080808;
    border-bottom:1px solid rgba(0,255,136,.18);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6%;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:2px;
    color:#00ff88;
    text-decoration:none;
}

nav{
    display:flex;
    gap:28px;
}

nav a{
    color:#aaa;
    text-decoration:none;
    font-size:14px;
    transition:.3s;
}

nav a:hover{
    color:#00ff88;
}

/* =========================
   PAGE
========================= */

.container{
    width:90%;
    max-width:1100px;
    margin:45px auto;
}

/* =========================
   PROFILE HERO
========================= */

.profile-top{
    background:linear-gradient(
        135deg,
        rgba(0,255,136,.08),
        rgba(0,0,0,.95)
    );

    border:1px solid rgba(0,255,136,.18);
    border-radius:24px;

    padding:35px;

    display:flex;
    align-items:center;
    gap:28px;

    box-shadow:
        0 0 40px rgba(0,255,136,.04);
}

.avatar{
    width:110px;
    height:110px;
    border-radius:50%;

    background:
        radial-gradient(
            circle at center,
            #123c2c,
            #07110c 65%
        );

    border:3px solid #00ff88;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:42px;
    font-weight:bold;
    color:#00ff88;

    box-shadow:
        0 0 25px rgba(0,255,136,.25);

    flex-shrink:0;
}

.profile-info{
    flex:1;
}

.profile-info h1{
    font-size:30px;
    margin-bottom:10px;
}

.username{
    color:#00ff88;
    font-size:15px;
}

.user-id{
    margin-top:10px;
    color:#777;
    font-size:12px;
    direction:ltr;
    text-align:right;
}

/* =========================
   GRID
========================= */

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    margin-top:22px;
}

.card{
    background:#0a0a0a;
    border:1px solid #171717;
    border-radius:18px;
    padding:25px;

    transition:.3s;
}

.card:hover{
    transform:translateY(-4px);
    border-color:rgba(0,255,136,.35);

    box-shadow:
        0 10px 35px rgba(0,255,136,.06);
}

.card-icon{
    font-size:25px;
    margin-bottom:15px;
}

.card-title{
    color:#888;
    font-size:13px;
    margin-bottom:9px;
}

.card-value{
    color:#00ff88;
    font-size:26px;
    font-weight:bold;
}

/* =========================
   SECTIONS
========================= */

.section{
    margin-top:25px;

    background:#080808;
    border:1px solid #151515;

    border-radius:20px;
    padding:25px;
}

.section h2{
    font-size:18px;
    margin-bottom:20px;
}

.section h2 span{
    color:#00ff88;
}

/* =========================
   BUTTONS
========================= */

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
}

.btn{
    border:none;
    border-radius:12px;
    padding:13px 22px;

    cursor:pointer;

    font-family:inherit;
    font-size:13px;

    transition:.3s;
}

.btn-green{
    background:#00ff88;
    color:#000;
    font-weight:bold;
}

.btn-green:hover{
    box-shadow:0 0 20px rgba(0,255,136,.3);
    transform:translateY(-2px);
}

.btn-dark{
    background:#111;
    color:#ddd;
    border:1px solid #222;
}

.btn-dark:hover{
    border-color:#00ff88;
    color:#00ff88;
}

.btn-danger{
    background:#160707;
    color:#ff5555;
    border:1px solid rgba(255,70,70,.2);
}

.btn-danger:hover{
    background:#210909;
}

/* =========================
   EMPTY
========================= */

.empty{
    color:#666;
    font-size:13px;
    text-align:center;
    padding:25px 0;
}

/* =========================
   LOADING
========================= */

.loading{
    text-align:center;
    padding:80px 20px;
    color:#00ff88;
    font-size:15px;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    bottom:25px;
    right:25px;

    background:#101010;
    color:#fff;

    border:1px solid rgba(0,255,136,.3);
    border-radius:12px;

    padding:14px 20px;

    opacity:0;
    transform:translateY(20px);

    pointer-events:none;

    transition:.3s;

    z-index:999;
}

.toast.show{
    opacity:1;
    transform:translateY(0);
}

/* =========================
   MOBILE
========================= */

@media(max-width:800px){

    header{
        padding:0 4%;
    }

    nav{
        gap:13px;
    }

    nav a{
        font-size:12px;
    }

    .container{
        width:94%;
        margin-top:25px;
    }

    .profile-top{
        padding:25px;
        flex-direction:column;
        text-align:center;
    }

    .user-id{
        text-align:center;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .actions{
        flex-direction:column;
    }

    .btn{
        width:100%;
    }
}

</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header>

<a href="index.html" class="logo">
CALLAFINO.
</a>

<nav>
<a href="index.html">خانه</a>
<a href="codm.html">کالاف موبایل</a>
<a href="dashboard.html">داشبورد</a>
</nav>

</header>


<!-- =========================
     MAIN
========================= -->

<main class="container">

<div id="loading" class="loading">
در حال بارگذاری پروفایل...
</div>


<div id="profileContent" style="display:none;">

<!-- PROFILE -->

<section class="profile-top">

<div class="avatar" id="avatar">
C
</div>

<div class="profile-info">

<h1 id="displayName">
کاربر CALLAFINO
</h1>

<div class="username" id="username">
@username
</div>

<div class="user-id" id="userId">
ID: -
</div>

</div>

</section>


<!-- STATS -->

<div class="grid">

<div class="card">

<div class="card-icon">
🏆
</div>

<div class="card-title">
تورنمنت‌ها
</div>

<div class="card-value" id="tournamentCount">
0
</div>

</div>


<div class="card">

<div class="card-icon">
🥇
</div>

<div class="card-title">
بردها
</div>

<div class="card-value">
-
</div>

</div>


<div class="card">

<div class="card-icon">
👥
</div>

<div class="card-title">
دوستان
</div>

<div class="card-value" id="friendCount">
0
</div>

</div>

</div>


<!-- WALLET -->

<section class="section">

<h2>
💰 <span>کیف پول</span>
</h2>

<div class="card">

<div class="card-title">
موجودی حساب
</div>

<div class="card-value">
به‌زودی
</div>

</div>

</section>


<!-- ACCOUNT -->

<section class="section">

<h2>
⚙️ <span>حساب کاربری</span>
</h2>

<div class="actions">

<button class="btn btn-green" onclick="editProfile()">
ویرایش پروفایل
</button>

<button class="btn btn-dark" onclick="comingSoon()">
تنظیمات حساب
</button>

<button class="btn btn-danger" onclick="logout()">
خروج از حساب
</button>

</div>

</section>


<!-- TOURNAMENTS -->

<section class="section">

<h2>
🎮 <span>تورنمنت‌های من</span>
</h2>

<div id="myTournaments" class="empty">
در حال بررسی...
</div>

</section>

</div>

</main>


<div id="toast" class="toast"></div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://oisqrkqwbskvqkparmiw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_FGoXFElayJeRdyFxyc61hQ_c5CUn5HL";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   TOAST
========================= */

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent = message;

    toast.classList.add("show");

    setTimeout(() => {
        toast.classList.remove("show");
    },3000);
}


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile(){

    try{

        const {
            data: {
                user
            },
            error: authError
        } =
        await supabaseClient.auth.getUser();


        if(authError || !user){

            window.location.href =
                "login.html";

            return;
        }


        /* USER ID */

        document.getElementById("userId")
            .textContent =
            "ID: " + user.id;


        /* =========================
           PROFILE
        ========================= */

        let profile = null;

        const {
            data: profileData
        } =
        await supabaseClient
            .from("profiles")
            .select("*")
            .eq("id", user.id)
            .maybeSingle();


        profile = profileData;


        if(profile){

            const name =
                profile.username ||
                user.user_metadata?.username ||
                "کاربر CALLAFINO";


            document.getElementById(
                "displayName"
            ).textContent = name;


            document.getElementById(
                "username"
            ).textContent =
                "@" + name;


            const firstLetter =
                name.charAt(0).toUpperCase();


            document.getElementById(
                "avatar"
            ).textContent = firstLetter;


            /* اگر avatar_url در پروفایل وجود داشته باشد */

            if(profile.avatar_url){

                document.getElementById(
                    "avatar"
                ).style.backgroundImage =
                    `url("${profile.avatar_url}")`;

                document.getElementById(
                    "avatar"
                ).style.backgroundSize =
                    "cover";

                document.getElementById(
                    "avatar"
                ).style.backgroundPosition =
                    "center";

                document.getElementById(
                    "avatar"
                ).textContent = "";

            }

        }else{

            const name =
                user.user_metadata?.username ||
                user.email?.split("@")[0] ||
                "کاربر CALLAFINO";


            document.getElementById(
                "displayName"
            ).textContent = name;


            document.getElementById(
                "username"
            ).textContent =
                "@" + name;


            document.getElementById(
                "avatar"
            ).textContent =
                name.charAt(0).toUpperCase();

        }


        /* =========================
           TOURNAMENT COUNT
        ========================= */

        const {
            count: tournamentCount
        } =
        await supabaseClient
            .from("tournament_registrations")
            .select(
                "*",
                {
                    count:"exact",
                    head:true
                }
            )
            .eq("user_id", user.id);


        document.getElementById(
            "tournamentCount"
        ).textContent =
            tournamentCount || 0;


        /* =========================
           FRIEND COUNT
        ========================= */

        const {
            count: friendCount
        } =
        await supabaseClient
            .from("friendships")
            .select(
                "*",
                {
                    count:"exact",
                    head:true
                }
            )
            .or(
                `user_id.eq.${user.id},friend_id.eq.${user.id}`
            );


        document.getElementById(
            "friendCount"
        ).textContent =
            friendCount || 0;


        /* =========================
           MY TOURNAMENTS
        ========================= */

        const {
            data: registrations
        } =
        await supabaseClient
            .from("tournament_registrations")
            .select(`
                tournament_id,
                created_at,
                tournaments (
                    title,
                    game,
                    type
                )
            `)
            .eq("user_id", user.id)
            .order(
                "created_at",
                {
                    ascending:false
                }
            )
            .limit(5);


        const tournamentsBox =
            document.getElementById(
                "myTournaments"
            );


        if(
            !registrations ||
            registrations.length === 0
        ){

            tournamentsBox.innerHTML =
                "هنوز در هیچ تورنمنتی ثبت‌نام نکرده‌ای.";

        }else{

            tournamentsBox.innerHTML =
                registrations.map(item => {

                    const t =
                        item.tournaments;

                    if(!t) return "";

                    return `
                        <div style="
                            padding:15px;
                            margin-bottom:10px;
                            background:#101010;
                            border:1px solid #191919;
                            border-radius:12px;
                        ">

                            <div style="
                                color:#00ff88;
                                font-weight:bold;
                                margin-bottom:7px;
                            ">
                                ${escapeHtml(t.title)}
                            </div>

                            <div style="
                                color:#777;
                                font-size:12px;
                            ">
                                ${escapeHtml(t.game || "-")}
                                •
                                ${escapeHtml(t.type || "-")}
                            </div>

                        </div>
                    `;

                }).join("");

        }


        /* SHOW */

        document.getElementById(
            "loading"
        ).style.display = "none";


        document.getElementById(
            "profileContent"
        ).style.display = "block";


    }catch(error){

        console.error(error);

        document.getElementById(
            "loading"
        ).textContent =
            "خطا در بارگذاری پروفایل.";

    }

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================
   EDIT
========================= */

function editProfile(){

    showToast(
        "بخش ویرایش پروفایل به‌زودی اضافه می‌شود."
    );

}


/* =========================
   SETTINGS
========================= */

function comingSoon(){

    showToast(
        "تنظیمات حساب به‌زودی اضافه می‌شود."
    );

}


/* =========================
   LOGOUT
========================= */

async function logout(){

    const {
        error
    } =
    await supabaseClient.auth.signOut();


    if(error){

        showToast(
            "خطا در خروج از حساب"
        );

        return;
    }


    window.location.href =
        "login.html";

}


/* =========================
   START
========================= */

loadProfile();

</script>

</body>
</html>
